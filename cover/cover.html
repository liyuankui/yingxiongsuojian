<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .container {
    width: 750px; height: 395px; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #a63c2f 0%, #7e2d23 55%, #571f17 100%);
    font-family: 'Songti SC', 'Noto Serif SC', Georgia, serif; color: #f7f3ea;
    display: flex; flex-direction: column; justify-content: center; padding: 0 64px;
  }
  .kicker { font-size: 15px; letter-spacing: .5em; opacity: .75; margin-bottom: 14px; }
  h1 { font-size: 64px; font-weight: 900; letter-spacing: .1em; line-height: 1.15; }
  h1 b { color: #e9c46a; }
  .sub { margin-top: 16px; font-size: 19px; opacity: .92; letter-spacing: .04em; }
  .q {
    margin-top: 26px; font-size: 21px; line-height: 1.6; opacity: .95;
    border-left: 3px solid #e9c46a; padding-left: 16px; max-width: 560px;
  }
  .q .n { font-size: 13px; color: #e9c46a; margin-top: 4px; font-family: Georgia, serif; }
  .foot { position: absolute; bottom: 22px; left: 64px; font-size: 13px; letter-spacing: .12em; opacity: .65; }
</style>
</head>
<body>
<div class="container">
  <div class="kicker">微信读书 · 热门划线</div>
  <h1>英雄<b>所见</b></h1>
  <div class="sub">万人划过的句子,英雄所见略同;译本各异,所见亦有不同</div>
  <div class="q">看东西只有用心才能看得清楚。重要的东西用眼睛是看不见的。
    <div class="n">3.1 万人划过 · 《小王子》第 21 章</div>
  </div>
  <div class="foot">小王子 · 约翰·克利斯朵夫|双译本对照</div>
</div>
</body>
</html>
