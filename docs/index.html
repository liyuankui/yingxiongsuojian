<script>
const DATA = {"books": [{"id": "siddhartha", "name": "悉达多", "author": "黑塞", "link": "https://weread.qq.com/web/bookDetail/855327", "x_on": true, "editions": [{"label": "姜乙 · 果麦", "pool": 256, "rating": "top1 7.2 万人划线", "items": [{"c": "沙门", "n": 71968, "t": "一切都是欺骗，都散发着恶臭，谎言的恶臭。一切欲望、幸福和优美皆为虚幻。一切都在腐朽。世界是苦涩的。生活即是折磨。"}, {"c": "乔文达", "n": 50256, "t": "悉达多的微笑让他忆起一生中爱过的一切，忆起一生中宝贵和神圣的一切。"}, {"c": "觉醒", "n": 46332, "t": "意义和本质绝非隐藏在事物背后，它们就在事物当中，在一切事物当中。"}, {"c": "迦摩罗", "n": 39914, "t": "所有这自古有之的一切，悉达多一直熟视无睹。他从不在场。而现在，他归属其中。流光魅影在他眼中闪耀，星辰月亮在他心中运行。"}, {"c": "婆罗门之子", "n": 38196, "t": "如果在林中，你寻得至高无上的幸福，就回来教我修习。如果你只收获幻灭，那也回来，我们再一道祭奉诸神。"}, {"c": "尘世间", "n": 34102, "t": "“或许是。”悉达多疲惫地说，“我就像你。你也谁都不爱——否则你怎会将爱当作艺术经营？像你我这类人大概都不会爱。如孩童般的世人才会爱。这是他们的秘密。”"}, {"c": "乔达摩", "n": 33156, "t": "“佛陀劫掠了我。”悉达多想，“他劫掠了我，但他馈赠得更多。他夺走了我的朋友，那曾经信奉我，如今信奉他的朋友；那曾经是我的影子，如今是乔达摩的影子的朋友。而他所馈赠的，则是悉达多，是……"}, {"c": "婆罗门之子", "n": 31446, "t": "“你来了。”悉达多含笑道。 “我来了。”乔文达道。"}, {"c": "船夫", "n": 31264, "t": "我的生活也是一条河。这条河用幻象，而非现实，隔开少年悉达多、成年悉达多和老年悉达多。悉达多的前世并非过去，死亡和重归梵天亦并非未来。没有过去，没有未来。一切都是本质和当下。”"}, {"c": "婆罗门之子", "n": 28910, "t": "内在“我”之源泉，必须拥有自己的阿特曼！其他一切都只是寻觅、走弯路和误入歧途。"}, {"c": "唵", "n": 28288, "t": "他理解他们。理解并同情他们不是由思想和理智，而是由冲动和欲望掌管的生活。他感同身受。尽管他已近乎完人，只承受着最后的伤痛，却视世人如兄弟。他不再嘲笑他们的虚荣、欲望和荒谬，反而通晓……"}, {"c": "沙门", "n": 28278, "t": "当“我”被彻底征服，当“我”消亡，当渴求和欲望在心中寂灭，那最终的、最深的非“我”存在，那个大秘密，必定觉醒。"}, {"c": "船夫", "n": 26866, "t": "他看见河水不懈奔流，却总在此处。永远是这条河，却时刻更新！"}, {"c": "迦摩罗", "n": 25690, "t": "如果一个人扼杀了感官意义上的偶然之我，却喂养思想意义上博学多能的偶然之我，他是不会寻得自我的。"}, {"c": "尘世间", "n": 25456, "t": "大多数人，迦摩罗，仿佛一片落叶，在空中翻滚、飘摇，最后踉跄着归于尘土。有的人，极少数，如同天际之星，沿着固定的轨迹运行。没有风能动摇他，他内心自有律法和轨道。"}, {"c": "唵", "n": 25128, "t": "一切未受尽的苦，未获得的救赎都会重来。苦难从未改变。"}, {"c": "婆罗门之子", "n": 24660, "t": "所有人都热爱悉达多。悉达多令所有人喜悦。所有人都对他兴致勃勃。 可是他，悉达多，却无法让自己喜悦，无法让自己略有兴致。"}, {"c": "乔文达", "n": 24444, "t": "真的反面同样真实！也就是说，只有片面的真才得以以言辞彰显。可以思想和言说的一切都是片面的，是局部，都缺乏整体、完满、统一。"}, {"c": "迦摩罗", "n": 24372, "t": "如若人能毫无希求，质朴而天真无邪地看待世界，世界何其隽美！"}, {"c": "乔文达", "n": 23268, "t": "我不再将这个世界与我所期待的，塑造的圆满世界比照，而是接受这个世界，爱它，属于它。"}, {"c": "在河边", "n": 22608, "t": "我做得不错，我必须赞美自己，我终结了自我憎恨，终结了可恶荒谬的生活！我赞美你，悉达多！愚蠢多年后又能思想和行动，又能听见心中鸣鸟的欢歌，又能跟随它！"}, {"c": "觉醒", "n": 21913, "t": "可是他，悉达多，他属于哪里？和谁分享生活？说谁的话？"}, {"c": "沙门", "n": 21196, "t": "“在水面行走并不是我的追求。”悉达多道，“还是让那些沙门老朽为这些把戏沾沾自喜吧！”"}, {"c": "乔达摩", "n": 20240, "t": "这就是我为何要继续我的求道之路——并非去寻找更好的法义，我知道它并不存在——而是为摆脱所有圣贤及法义，独自去实现我的目标，或者去幻灭。"}, {"c": "船夫", "n": 19854, "t": "他永不停歇地向河水求教，首要的是学会抛弃激情和期盼，不论断、无成见地以寂静的心、侍奉和敞开的灵去倾听。"}, {"c": "乔达摩", "n": 19170, "t": "“你很聪明，哦，沙门。”世尊道，“你能言善道，我的朋友。要提防不要太过聪明！”"}, {"c": "沙门", "n": 19142, "t": "禅定是什么？什么是脱离肉体？斋戒是什么？什么是屏息敛气？那不过是逃避‘我’，是暂时从‘我’的折磨中逃出来，是对生命的虚无和痛苦的暂时麻醉。"}, {"c": "在河边", "n": 19063, "t": "他想：“亲口品尝尘世的一切很好。尽管孩提时我已知道，淫乐和财富不属于善。我熟知已久，却刚刚经历，不仅用思想，还用眼睛、心灵和肉体经历。我庆幸我经历了它！”"}, {"c": "觉醒", "n": 18975, "t": "我不再苦修。我要拜自己为师。我要认识自己，认识神秘的悉达多。”"}, {"c": "儿子", "n": 18904, "t": "你果真相信，你的蠢行，能免除他的蠢行？难道你通过教育、祈祷和劝诫，能保他免于轮回？"}, {"c": "乔文达", "n": 18090, "t": "“一个探求之人，”悉达多道，“往往只关注探求的事物。他一无所获，一无所纳。因为他一心想着探求，被目的左右。探求意味着拥有目标。而发现则意味自由、敞开、全无目的。"}, {"c": "沙门", "n": 17935, "t": "他从“我”中溜走，融入陌生的万物中。他是动物，是尸身，是石，是木，是水。但他总是重新出定，在阳光下或月光中重归于“我”，在轮回中打转，重新觉察到渴望。他压制渴望，又收获新的渴望。"}, {"c": "乔文达", "n": 17880, "t": "智慧无法言传。智者试图传授智慧，总像痴人说梦。”"}, {"c": "乔文达", "n": 17640, "t": "我不会因它终将变为这个或那个而敬爱它，而会因为它一直是石头——正因为它是石头——今天和现在出现在我面前的石头而爱它。"}, {"c": "尘世间", "n": 17184, "t": "他看见他们为一些在他看来毫无价值的东西，为了钱，为了微不足道的欲望，为了可怜的尊严而操劳、受苦、衰老。他看见他们彼此责骂、羞辱，看见他们为那些令沙门付之一哂的痛苦恸哭，为那些令沙门……"}, {"c": "沙门", "n": 17136, "t": "当天，悉达多便告知沙门长老，他们决定离开。他的礼貌和谦逊符合后辈和弟子的规矩，可沙门长老却因为两位青年要离开而大发雷霆。他高声叫嚷，甚至破口大骂。"}, {"c": "轮回", "n": 17130, "t": "毫无价值，自己过着既无价值又无意义的生活。了无生气，他没有得到任何珍贵的、值得保留的东西。他孤单伫立，空洞得如同岸边遇难的破船。"}, {"c": "迦摩罗", "n": 17072, "t": "如此听凭内心的召唤而非听凭外在的命令是善的。除了时刻等待这声音的召唤，再没什么行为是必要的。"}, {"c": "尘世间", "n": 16974, "t": "悉达多则视一切如游戏。他努力学习规则，内容他并不记挂于心。"}, {"c": "轮回", "n": 16752, "t": "他爱那种在掷骰子时、豪赌时，心惊肉跳令人窒息的恐惧感。他爱这种恐惧，爱不断翻新、不断升级的强烈刺激。只有在这种刺激下，他才能在浑噩的、醉生梦死的寡淡生活中感受到一丝类似幸福、波澜和……"}]}, {"label": "苏念秋 · 陕西师大", "pool": 259, "rating": "", "items": [{"c": "在人群中", "n": 4992, "t": "大多数的人就像是一片片落叶，在空中随风飘游、翻飞、荡漾，最后落到地上。有少数人像是天上的星星，循着固定的轨道运行，任何风都吹不到他们那儿，在他们内心中，有他们自己的引导者和方向。"}, {"c": "沙门的生活", "n": 4719, "t": "悉达多只有一个目标——变得空无：没有渴望、意愿、梦想、快乐和悲哀——让“我”死掉。不再有“我”，体味空无心灵的平静，体味纯洁的思想，那就是他的目标。"}, {"c": "婆罗门的儿子", "n": 4400, "t": "人必须在自己的“我”中找到泉源，人必须保有这泉源。此外，一切都是虚假、迂回和错误。"}, {"c": "觉悟", "n": 3078, "t": "意义和真实不是躲藏在种种事物的后面，而是在它们的里面，所有的全是如此。"}, {"c": "歌文达", "n": 2768, "t": "智慧是不能言传的。一个有智慧的人如果想要把智慧讲给别人听，那些话一旦说出口来，反而会让人觉得很愚蠢。"}, {"c": "河边", "n": 2464, "t": "他开始爱一切东西，对他所看见的一切东西，他都充满了愉悦的爱。现在他明白了自己以前为什么那样不快，因为以前他不爱任何东西，不爱任何人。"}, {"c": "摆渡人", "n": 2314, "t": "每一样东西，没有以前，没有以后，只有现在和现在的实在。"}, {"c": "觉悟", "n": 2280, "t": "思考的本质就是认识根源，只有通过思考，种种感觉才会变成知识，变成真实，开始成熟，不致迷失。"}, {"c": "甘玛拉", "n": 2197, "t": "心境如此纯朴，如此清醒，如此关怀眼前遇到的一切，不带任何怀疑，就这样活在这世界上是美好而愉快的事。"}, {"c": "摆渡人", "n": 1938, "t": "所有的悲哀不都是在时间里面吗？所有的自我折磨和恐惧不都是在时间里面吗？一旦人克服了时间，不是也就立刻克服了世界上所有的困难和邪恶吗？"}, {"c": "摆渡人", "n": 1935, "t": "他看到河中的水在不停地流淌，可是仍然永远在那里，并未减少。河水永远是一样的，可是每个瞬间都在不停更新。"}, {"c": "唵", "n": 1694, "t": "那目标不是别的，而是在生命的每一个时刻中灵魂的一种准备，一种容纳力，一种思考、感觉和呼吸万物圆融统一思想的秘技。"}, {"c": "摆渡人", "n": 1610, "t": "他不断地向那条河学，尤其是向那条河学习如何倾听，如何用一颗平静的心去倾听，如何用一个等待的、开敞的灵魂去倾听，没有激情，没有愿望，没有判断，没有意见。"}, {"c": "沙门的生活", "n": 1484, "t": "“我不要在水上走路，”悉达多说，“让那些老沙门以这种本领去满足他们自己吧！”"}, {"c": "婆罗门的儿子", "n": 1452, "t": "“你来了。”悉达多笑了。“我来了。”歌文达应道。"}, {"c": "沙门的生活", "n": 1440, "t": "虽然一切貌似充实、快乐和完美，然而一切到头来都注定要腐朽。世界弥漫着辛酸，人生充满了痛苦。"}, {"c": "摆渡人", "n": 1312, "t": "这时候，他更深切地感到了每个人生的不可磨灭性、每个时刻的永恒。"}, {"c": "婆罗门的儿子", "n": 1230, "t": "歌文达知道悉达多不会变成一个平凡的婆罗门，一个懒惰的祭祀官，一个贪婪的买空卖空的商人，一个毫无价值却又自夸的演说家，一个邪恶奸诈的教士，或者一大群羊中善良却愚蠢的一只。"}, {"c": "觉悟", "n": 1170, "t": "他放眼四望，好像是第一次看见这个世界。这个世界美丽、陌生、神秘，有蓝色，有黄色，有绿色，有天有河，有森林有山丘，一切都美丽，一切都神秘、迷人。在这一切之间，他，觉醒了的悉达多，正向……"}, {"c": "总序", "n": 1170, "t": "1962年8月8日，85岁的黑塞在听完一首莫扎特的钢琴协奏曲后，与世长辞。"}, {"c": "甘玛拉", "n": 1152, "t": "所有这一切一直都在那里，而他却熟视无睹，一直心不在焉。而现在，他与这一切在一起了，他属于这一切了。他的眼睛看到了光明和阴影；月亮和星星在他的心中闪烁。"}, {"c": "儿子", "n": 1110, "t": "这时候悉达多开始明白了，儿子给自己带来的并不是快乐和安宁，而是悲哀和苦恼。然而他仍然爱自己的孩子，他宁愿忍受爱所带来的悲哀和苦恼，而不愿享受身边没有孩子时的快乐和安宁。"}, {"c": "沙门的生活", "n": 1105, "t": "世界令人悲观，人生之路艰难，可是在佛那里，似乎是有个新的希望，似乎有个充满了美好许诺的信息，温煦而又慰人。"}, {"c": "沙门的生活", "n": 1056, "t": "当整个“我”被征服、死去，所有的激情和愿望都寂止了的时候，那最后的东西，那不再有“我”的人生奥妙——那大秘密，一定会苏醒。"}, {"c": "歌文达", "n": 1026, "t": "每一张面孔都是最后难免一死的生物，都是整个空幻界中的一个激情的、痛苦的例子。然而他们却没有一个死掉，他们只是不断地变幻，不断地重生，不断地有新的面孔，只有作为纽带的时间站在一张面孔……"}, {"c": "乔达摩", "n": 1024, "t": "世尊，您没有从别人的教导中学到过东西，所以我认为没有人能从别人的教导中找到解脱。在您彻悟的时刻所悟到的一切，没有法子能用言语教导给别人。"}, {"c": "婆罗门的儿子", "n": 1008, "t": "他的杯子没有满，他的智怀没有饱，他的灵魂不安宁，他的心情不平静。"}, {"c": "甘玛拉", "n": 976, "t": "突然间，一种骄傲的感觉充满了他心中，他觉得自己不再是个沙门了，自己不应该再去乞讨食物，因为那已经不适合他的身份。于是他把那块米糕丢给一只狗，宁愿自己空着肚子。"}, {"c": "歌文达", "n": 972, "t": "语言无法将思想完全表达出来，思想一旦被语言表达出来，总是会与心中的原意有所不同，有所曲解，显得有点愚蠢。"}, {"c": "乔达摩", "n": 960, "t": "“然而他，佛，却给了我一件东西——悉达多，我自己。”"}, {"c": "唵", "n": 960, "t": "在悉达多眼中，他们的虚荣、愿望和琐琐屑屑，已不再显得可笑了，它们都变成了可以理解的可爱的东西，甚至很值得自己尊敬。"}, {"c": "在人群中", "n": 949, "t": "我像你。你也不会真正爱任何人，不然的话，你怎么能够把爱情当作一种艺术呢？也许像你我这样的人无法去爱别人。而一般的人却能够，那就是他们的秘密。"}, {"c": "唵", "n": 890, "t": "每个人都朝着自己的目标，每个人都被自己的目标缠住了，每个人都忍受着痛苦。"}, {"c": "觉悟", "n": 864, "t": "他迈开步子重新上路，开始急切地快步走去，不再向着家园，不再向着父亲，也不再回顾走过的路。"}, {"c": "婆罗门的儿子", "n": 846, "t": "如果你在森林中找到了幸福，你就回来把幸福的秘诀教给我；如果你找到的是幻灭，你也回来，让我们再一起去向诸神献祭。"}, {"c": "唵", "n": 836, "t": "那条河笑了，是的，人生就是这样的。每样事情，在没有忍受到尽头之前，在没有最后终结之前，都会重演，同样的悲哀也会再度被人历经一次。"}, {"c": "觉悟", "n": 830, "t": "顿时，四周的世界消失了，悉达多孤独地站在那里，像是一颗天上的星，冰冷的绝望感淹没了他，然而他却比以前更为自信。这些不过是他苏醒时最后的战栗，是他新生时最后的阵痛。"}, {"c": "沙门的生活", "n": 828, "t": "沉思冥想是什么？舍弃身体是什么？斋戒绝食是什么？屏息是什么？那都不过是从‘我’中飞出，从‘我’的折磨中暂时逃脱出来，不过是暂时减轻生命痛苦、抵抗生命虚无的一种麻醉剂。"}, {"c": "轮回", "n": 810, "t": "过了不久，她发觉自己怀孕了，那是她最后一次同悉达多在一起欢聚的结果。"}, {"c": "沙门的生活", "n": 792, "t": "一只苍鹭飞过竹林，悉达多就把那苍鹭摄入自己的灵魂，于是他变成了一只苍鹭，飞过树林和山岳，食鱼度日，熬受苍鹭的饥饿，使用苍鹭的语言，又像苍鹭一样死亡。"}]}], "x": [{"seg": "知识与智慧 · 乔文达章", "rows": [["姜乙", "智慧无法言传。智者试图传授智慧，总像痴人说梦。", 17880], ["苏念秋", "知识可以传授，但智慧却不行。", 348], ["杨武能", "知识可以传达，智慧却不能。", 825]]}, {"seg": "片面的真 · 乔文达章", "rows": [["姜乙", "真的反面同样真实！只有片面的真才得以以言辞彰显。可以思想和言说的一切都是片面的，都缺乏整体、完满、统一。", 24444], ["李蒙漪", "每一个真理，它的对立面也同样为真。唯有当真理是片面的，才可以被言说。", 3222], ["杨武能", "能够让人思考和言说的一切，通通都是片面的；一切都缺少圆满和统一。", 256]]}, {"seg": "落叶与星辰 · 迦摩罗章", "rows": [["姜乙", "大多数人仿佛一片落叶，在空中翻滚、飘摇，最后踉跄着归于尘土。有的人，极少数，如同天际之星，沿着固定的轨迹运行。他内心自有律法和轨道。", 25456], ["苏念秋", "大多数的人就像是一片片落叶，在空中随风飘游，最后落到地上。有少数人像是天上的星星，循着固定的轨道运行，他们有自己内心的引导者。", 4992], ["杨武能", "大多数人都好像落叶，在空中飘舞、翻卷。可是也有另一些人，像沿着一条固定轨道运行的星星，它们有自身的规律和轨道。", 585]]}]}, {"id": "oldman", "name": "老人与海", "author": "海明威", "link": "https://weread.qq.com/web/bookDetail/40527660", "x_on": true, "editions": [{"label": "吴劳 · 上海译文(双版合并)", "pool": 286, "rating": "top1 5,814", "items": [{"c": "10", "n": 5814, "t": "在大路另一头的窝棚里，老人又睡着了。他依旧脸朝下躺着，男孩坐在他身边，守着他。老人正梦见狮子。"}, {"c": "4", "n": 5525, "t": "每一天都是一个新的日子。走运当然更好。不过我情愿做到分毫不差。这样，运气来的时候，你就有所准备了。"}, {"c": "9", "n": 5412, "t": "“然而人不是为失败而生的，”他说。“一个人可以被毁灭，但不能给打败。”"}, {"c": "1", "n": 2616, "t": "他身上的一切都显得古老，除了那双眼睛，它们像海水一般蓝，显得喜洋洋而不服输。"}, {"c": "《老人与海》的多层次涵义", "n": 2533, "t": "为什么一个几乎什么都有的人，在获奖后不久选择了死亡，而一个几乎一无所有的渔夫，却悠然地颐养天年？这是值得引人深思的。"}, {"c": "1", "n": 2034, "t": "不少渔夫拿老人开玩笑，老人并不生气。另外一些上了些年纪的渔夫望着他，感到难受。"}, {"c": "2", "n": 2004, "t": "实在并没有撒网，男孩还记得他们是什么时候把它卖掉的。然而他们每天都要扯一套这种谎话。也没有一锅鱼煮黄米饭，这一点男孩也知道。"}, {"c": "1", "n": 1914, "t": "尽管老人深信当地不会有人来偷他的东西，但他认为，把一把鱼钩和一支鱼叉留在船上实在是不必要的引诱。"}, {"c": "1", "n": 1875, "t": "他心地单纯，不去捉摸自己什么时候达到了这样谦卑的地步。可是他知道这时正达到了这地步，知道这并不丢脸，所以也无损于真正的自尊心。"}, {"c": "5", "n": 1846, "t": "我不知道如果它决意朝下沉，我该怎么办。我不知道如果它潜入海底，死在那儿，我该怎么办。可是我必须干些什么。我能做的事情多着呢。"}, {"c": "10", "n": 1820, "t": "眼下可不是想你缺乏什么东西的时候。想想你用手头现有的东西能做什么事儿吧。"}, {"c": "4", "n": 1794, "t": "一桩好事如果说破了，也许就不会发生了"}, {"c": "5", "n": 1782, "t": "“鱼啊，”他轻轻地说出声来，“我要跟你奉陪到死。”"}, {"c": "5", "n": 1742, "t": "他说出声来，“但愿那男孩在就好了。”"}, {"c": "3", "n": 1680, "t": "“年纪是我的闹钟，”老人说。“为什么老头儿醒得那么早？难道是要让白天长些吗？”"}, {"c": "1", "n": 1586, "t": "他是个独自在湾流中一条平底小帆船上钓鱼的老人，这一回已去了八十四天，没逮上一条鱼。"}, {"c": "10", "n": 1472, "t": "这时航行得很轻松，他什么念头都没有，什么感觉也没有。他此刻超脱了这一切，只顾尽可能出色而明智地把小帆船驶回他家乡的港口。"}, {"c": "3", "n": 1352, "t": "我该为他把水带到这儿来，男孩想，还带块肥皂和一条干净毛巾。我为什么这样粗心大意？我该再给他弄件衬衫，一件过冬的茄克衫，还弄双什么鞋子，再来条毯子。"}, {"c": "10", "n": 1344, "t": "它们如今可把我打垮了，他想。我太老了，不能用棍子打死鲨鱼了。但是只要我有桨和短棍和舵把，我还要试试。"}, {"c": "6", "n": 1343, "t": "一个人在海上是永远不会孤单的。"}, {"c": "9", "n": 1312, "t": "想点开心的事儿吧，老家伙，”他说。“每过一分钟，你就离家近一步。丢了四十磅鱼肉，你航行起来更轻快了。”"}, {"c": "《老人与海》的多层次涵义", "n": 1290, "t": "然而人不是为失败而生的，一个人可以被毁灭，但不能给打败。"}, {"c": "6", "n": 1290, "t": "然而这是不公平的，他想。不过我要让它知道人有多少能耐，人能忍受多少磨难。"}, {"c": "4", "n": 1275, "t": "“水母，”老人说。“你这婊子。”"}, {"c": "4", "n": 1260, "t": "现在只应该思量一桩事。那就是我生来要干的事。"}, {"c": "4", "n": 1207, "t": "好久以来，吃饭使他感到厌烦，因此从来不带午饭。他在小帆船的船头上放着一瓶水，一整天只需要这个就够了。"}, {"c": "", "n": 1206, "t": "他依旧脸朝下躺着，男孩坐在他身边，守着他。老人正梦见狮子。"}, {"c": "4", "n": 1200, "t": "老人知道自己要驶向远方，所以把陆地的气息抛在后方，划进海洋上清晨的清新气息中。"}, {"c": "7", "n": 1183, "t": "于是他替这条没东西吃的大鱼感到伤心，但是要杀死它的决心绝对没有因为替它伤心而减弱。它能供多少人吃啊，他想。可是他们配吃它吗？不配，当然不配。凭它的举止风度和它的高度尊严来看，谁也不……"}, {"c": "6", "n": 1166, "t": "他已经证实过上千回了，这算不上什么。眼下他正要再证实一回。每一回都是重新开始，他这样做的时候，从来不去想过去。"}, {"c": "5", "n": 1162, "t": "它选择的是待在黑暗的深水里，远远地避开一切圈套、罗网和诡计。我选择的是赶到谁也没到过的地方去找它。到世界上没人去过的地方。如今我跟它给拴在一起了，从中午起就是如此。而且我和它都没有……"}, {"c": "10", "n": 1156, "t": "男孩看见老人在喘气，跟着看见老人的那双手，就哭起来了。他悄没声儿地走出来，去拿点咖啡，一路上边走边哭。"}, {"c": "1", "n": 1144, "t": "帆上用面粉袋片打了些补丁，收拢后看来像是一面标志着永远失败的旗子。"}, {"c": "3", "n": 1139, "t": "他把长裤卷起来当枕头，把那张报纸塞在里头。他用毯子裹住了身子，在弹簧垫上铺着的其他旧报纸上睡下了。"}, {"c": "5", "n": 1120, "t": "它们这情景是我看到的最伤心的了，老人想。男孩也很伤心，因此我们请求这条雌鱼原谅，马上把它宰了。"}, {"c": "5", "n": 1068, "t": "“鱼啊，”他说，“我爱你，非常尊敬你。不过今天我得把你杀死。”"}, {"c": "10", "n": 1050, "t": "船还是好好的，他想。它是完好的，没受一点儿损伤，除了那个舵把。那是容易更换的。"}, {"c": "1", "n": 1037, "t": "老人教会了这男孩捕鱼，男孩爱他。"}, {"c": "10", "n": 1022, "t": "“跟它们斗，”他说。“我要跟它们斗到死。”"}, {"c": "3", "n": 1020, "t": "“我也许不像我自以为的那样强壮了，”老人说。“可是我懂得不少窍门，而且有决心。”"}]}, {"label": "李继宏 · 天津人民", "pool": 137, "rating": "", "items": [{"c": "老人与海", "n": 1872, "t": "他浑身显得很老，但双眼除外；它们有着海水的颜色，透露出乐观和永不言败的神色。"}, {"c": "（二）", "n": 1610, "t": "可是，他想，我会让它们准确地停留在那里。可惜我再也没有运气。但谁知道呢？也许就在今天。每天都是新的日子。运气好当然不错。但我宁可准确。那么等运气来的时候，你就有所准备了。"}, {"c": "（五）", "n": 1476, "t": "“但好汉不是为失败而生的，”他说，“好汉可以被毁灭，但绝不能被打败。”"}, {"c": "老人与海", "n": 1400, "t": "老人非常确定本地人不会偷他的东西，但觉得没必要把鱼钩和鱼枪留在船里引诱人。"}, {"c": "（六）", "n": 1368, "t": "路那头，老人在他的茅屋里又睡着了。他仍然是趴着睡的，男孩坐在旁边看着他。老人正在梦见狮子。"}, {"c": "老人与海", "n": 1050, "t": "“年龄是我的闹钟，”老人说，“为什么老年人醒得早呢？是为了拥有更长的一天吗？”"}, {"c": "老人与海", "n": 949, "t": "屋里并没有拖网，男孩记得他们是哪天把它卖掉的。但他们每天都假装它还在。老人没有鱼肉黄米饭，这男孩也知道。"}, {"c": "（四）", "n": 880, "t": "我不明白这些事，他想。但幸好我们不必去尝试杀死太阳、月亮或星星。我们只要依靠大海和杀死我们真正的兄弟就足以谋生了。"}, {"c": "（二）", "n": 871, "t": "但老人总是把她当作女性，某个有时肯帮大忙有时不肯的女人，就算她做了某些粗暴或者邪恶的事，那也是因为她身不由己。她就像女人那样受月亮的影响，他想。"}, {"c": "（三）", "n": 800, "t": "“好好休息吧，小鸟，”他说，“然后飞回去拼搏吧，人要靠自己奋斗，鸟和鱼也这样。”"}, {"c": "（三）", "n": 759, "t": "他已经证明过上千次，但这毫无意义。现在他要重新证明它。每次都是从头来过，他重新证明时从不想着过去。"}, {"c": "（二）", "n": 720, "t": "如果他决定往下游，我怎么办呢？我不知道。如果他沉到海底死掉，我该怎么办呢？我不知道。但我会有办法的。我有很多办法。"}, {"c": "（二）", "n": 715, "t": "他做出的选择是留在黑暗的深海，远远地逃离一切罗网、陷阱和诡计。我的选择是到远离所有人——远离全世界的人——的地方去找他。现在我们彼此拴住了，从中午到现在都拴在一起。没有人会来帮他或……"}, {"c": "老人与海", "n": 637, "t": "你去哪里洗呢？男孩想。村里供水的地方在路那边，离这里两条街那么远。我得给他弄点水来，男孩想，还有香皂和一条好毛巾。我怎能这样粗心呢？我必须给他再弄件衬衣和过冬的外套，还有鞋子和另外……"}, {"c": "导读", "n": 630, "t": "想想看啊，要是人每天必须努力去杀死月亮，那会怎么样呢，他想。月亮会逃走的。但想想看人每天必须努力去杀死太阳，那又会怎么样呢？我们真是天生幸运啊，他想。"}, {"c": "（二）", "n": 616, "t": "然后他将会转个身，把它吞下去，他想。他没有把这个想法说出来，因为他知道好事不能说，说了就不会发生。"}, {"c": "导读", "n": 600, "t": "在海明威看来，真相如同冰山，浮现在水面的只是八分之一，而作家的任务，就是在通过小说的文字呈现这八分之一的同时，还要让读者感受到另外八分之七的存在。这就是他独创的“冰山理论”。"}, {"c": "（五）", "n": 561, "t": "自从那鱼遭到撕咬之后，老人再也不忍心去看他。那鱼遇袭时他很心痛，好像受攻击的是他自己。"}, {"c": "（五）", "n": 560, "t": "“想些开心的事情吧，老头子，”他说，“你离家越来越近了。去掉四十磅鱼肉，这船航行起来更轻快啦。”"}, {"c": "（四）", "n": 522, "t": "他认为只要他特别想取胜，他能打败任何人，他也认为这对他的右手不好，会影响捕鱼。"}, {"c": "（五）", "n": 476, "t": "你杀那条鱼，不光是为了谋生和卖给别人当食物，他想。你也出于骄傲而杀他，因为你是个渔夫。他活着时你爱他，他死了你也爱他。如果你爱他，那么杀害他就不是罪过。或者是更严重的罪过？"}, {"c": "（二）", "n": 476, "t": "我拿他没办法，他也拿我没办法，他想。只要他打起精神，那鱼就无可奈何。"}, {"c": "老人与海", "n": 464, "t": "他是个老人，独自划着小船，在湾流1中捕鱼；八十四天来，他没打到鱼。"}, {"c": "（二）", "n": 464, "t": "他记不清从什么时候起开始在独处时自言自语。从前独处时他会唱歌，有时候在夜里，当他独自在捕鱼船或者捕龟船上轮班掌舵时，他也会唱歌。他在孤单时自言自语，也许是从男孩离开他之后开始的。但……"}, {"c": "（五）", "n": 455, "t": "你应该带的东西多着呢，他想。但你又没有带，老头子。现在没空去想那些你没有的工具。好好想想怎么利用手头的东西。"}, {"c": "（六）", "n": 442, "t": "男孩睡了个懒觉，醒后便到老人的茅屋来——他每天早上都来的。男孩看到老人在呼吸，又看见老人的手，随即哭了起来。他非常安静地走出去给老人弄些咖啡来，一路上哭个不停。"}, {"c": "（五）", "n": 432, "t": "他们把我打垮了，他想。我太老了，没法敲死他们。但只要船桨、船舵和短木棒还在，我就会试试看。"}, {"c": "（三）", "n": 408, "t": "他说：“要是那孩子在这里就好啦。”"}, {"c": "（二）", "n": 378, "t": "人老了不该孤身一人的，他想。但这是不可避免的。"}, {"c": "（四）", "n": 374, "t": "鱼啊，你这是在要我的命，老人想。但你有这个权利。老兄啊，我从未见过你这么大、这么漂亮、这么镇定、这么高贵的鱼。来吧，把我干掉吧。不管谁干掉谁都可以。"}, {"c": "（三）", "n": 360, "t": "“我不信教，”他说，“但只要让我抓到这条鱼，我愿意念十遍天主经45和十遍圣母经46；如果抓到他，我保证去朝拜戈布勒圣母。我保证说到做到。”"}, {"c": "老人与海", "n": 348, "t": "他从很久之前就厌倦了吃东西，从来不带午餐。他在小船的船头有瓶水，那足以满足他全天所需。"}, {"c": "老人与海", "n": 340, "t": "不过这些伤疤没有新的。它们古老得像久经侵蚀的无鱼沙漠。"}, {"c": "导读", "n": 338, "t": "“这个故事是一曲颂歌，它提倡哪怕结果一无所得也永不屈服的奋斗精神，赞扬失败之中的道德凯旋。”"}, {"c": "（三）", "n": 338, "t": "“鱼啊，”他说，“我爱你，也非常尊敬你。但我要在今天结束之前把你杀死。”"}, {"c": "（五）", "n": 324, "t": "他歇了片刻，回头望去，看见在街灯的照射中，那鱼的大尾巴高高地竖起在船尾之后。他看见那鱼光秃秃的白色脊骨，黑乎乎的巨大头部和突出的长嘴，以及完全没有皮肉的鱼身。"}, {"c": "（三）", "n": 323, "t": "他看着天空，发现雪白的积云宛如美味的雪糕，再上面是薄如羽毛般的卷云，飘荡在高旷的九月天空中。"}, {"c": "（四）", "n": 306, "t": "“情况并不糟糕，”他说，“这点痛对好汉来说不算什么。”"}, {"c": "老人与海", "n": 306, "t": "他的希望和自信从未消失。现在它们就像海风初起般渐渐强劲起来。"}, {"c": "老人与海", "n": 306, "t": "“这是大鱼出现的月份，”老人说，“要是在五月，谁都可以当渔夫。”"}]}, {"label": "余光中 · 译林(1952 首译)", "pool": 56, "rating": "", "items": [{"c": "10", "n": 120, "t": "“可是人不能认输，”他说，“人可以毁灭，但不能屈服。”"}, {"c": "7", "n": 84, "t": "它的选择是远避一切圈套和诡计，躲在黑暗的深水里。而我的选择是远离人间去那儿找它。远到荒无人烟的地方去找它。如今我们已经对上了，从中午直到现在。双方都没有谁来帮忙。"}, {"c": "9", "n": 84, "t": "以前证明过一千次也不算数。现在他又得证明了。每一次都是从头做起，而做的时候，他从不想念过去。"}, {"c": "9", "n": 72, "t": "他眺望远海，发现自己现在异常孤独。"}, {"c": "10", "n": 70, "t": "“想些愉快的事情吧，老头子，”他说，“你一刻比一刻离家更近。丢了四十磅肉，航行起来还轻些呢。”"}, {"c": "3", "n": 68, "t": "老年是我的闹钟，”老人说，“为什么老年人醒得这么早？是不是这样日子就长些？”"}, {"c": "4", "n": 68, "t": "可是老人想起她时，总想她是女性，会施大恩或吝于施恩；如果她有时竟也撒野作恶，那是因为她忍不住。他想，月亮撩她，就像月亮撩女人一样。"}, {"c": "5", "n": 65, "t": "天天都是新日子。有运气当然好。可是我宁可做得准确。这样，运气一来，我就等着了。"}, {"c": "10", "n": 64, "t": "男孩看出老人还有呼吸，不久又看到老人的双手，便哭了起来。他轻手轻脚地走出茅屋，去拿咖啡，一路上哭个不停。"}, {"c": "10", "n": 64, "t": "老人又梦见那些狮子了。"}, {"c": "8", "n": 64, "t": "“好好休息一下，小鸟，”他说，“然后像人，像鸟，像鱼一样，去碰你的运气。”"}, {"c": "10", "n": 60, "t": "于是他又可怜那大鱼没有东西吃，可是要杀掉它的决心绝不因对它的怜悯而放松。它要供给多少人食物哟，他想。可是他们配吃它吗？不配，当然不配。照它的行为方式和它巍然的尊严看来，谁都不配吃它……"}, {"c": "10", "n": 56, "t": "绝望是愚蠢的，他想。再加，我认为绝望是一种罪过。"}, {"c": "6", "n": 56, "t": "可是他不说出口，因为他知道好事说出了口，就不会实现。"}, {"c": "10", "n": 54, "t": "他并非真正觉得舒服，因为他背上粗索的擦痛几已超过痛苦，成了他不能置信的麻木。可是我经历过更糟的情况，他想。我的右手只割伤了一点，左手抽筋也已经复原，两腿都好。再加，我在粮食方面也占……"}, {"c": "10", "n": 51, "t": "现在它们把我打垮了，他想。我是老人，用短棍打鲨鱼是打不死的。可是只要我还有木桨，还有短棍和舵柄，就要拼它一下。"}, {"c": "老人与海", "n": 48, "t": "老人瘦削而憔悴，颈背皱纹深刻。热带海上阳光的反射引起善性的皮癌，那种褐色的疮疱便长满了两颊，两手时常用索拉扯大鱼，也留下深折的瘢痕。这些瘢痕却都不新，只像无鱼的沙漠里风蚀留痕一样苍……"}, {"c": "9", "n": 48, "t": "云堆正因贸易风而开始拥聚，他向前眺望，看见一行野鸭，背着天空，贴着水面，飞影清晰，一会儿又模糊，一会儿又清晰，才发现一个人在海上是永远有伴的。"}, {"c": "6", "n": 45, "t": "他记不起自己从什么时候开始，便爱一个人大声自言自语。往日，在孤独的时候，他曾爱唱歌自娱；有时夜间独自在渔船上或是龟船上轮班掌舵，他也会唱起歌来。"}, {"c": "7", "n": 45, "t": "万一它打定主意潜下水去，怎么办？我不晓得。万一它沉到水底死掉，又怎么办？我不晓得。可是我总有办法。办法多得很"}, {"c": "7", "n": 45, "t": "等到老人开始清理钓索，拿起鱼叉，那雄鱼便从船边跃起，探看雌鱼的所在，然后展开他那紫翼一般的胸鳍，露出周身宽阔的紫纹，潜入深海。老人还记得他很优美，而且始终守在她身边。"}, {"c": "10", "n": 39, "t": "海水给鱼心的鲜血染成红色。在深逾一英里的蓝色海水里，开始它暗暗的，像一条沙滩。不久它就散开来，像一条云彩。大鱼银白、死寂，只是随波漂流。"}, {"c": "老人与海", "n": 39, "t": "“可是别忘了：有一次你一连八十七天没捉到鱼，后来我们连着三个星期，天天都捉到大鱼。”"}, {"c": "10", "n": 36, "t": "捕鱼这一行一面养我，一面也着实害我。"}, {"c": "10", "n": 36, "t": "他从船舵上扭下舵柄，用双手握住，一遍又一遍地向下痛打，猛劈，狠刺。"}, {"c": "3", "n": 36, "t": "老人睁开眼睛；刹那间，他从远方清醒回来。接着他微笑起来。"}, {"c": "6", "n": 36, "t": "现在只能注意一件事。我生来要做的事。"}, {"c": "7", "n": 36, "t": "我真想见一见它。我只要见它一次，看看对手是什么样子。"}, {"c": "10", "n": 34, "t": "你要沉着、坚强，老头子。”他说。"}, {"c": "10", "n": 34, "t": "你不只是为了求生，为了鱼肉可卖才杀它的，他想。你是为了面子，为了自己是个渔夫才杀它的。"}, {"c": "2", "n": 34, "t": "小屋用一种叫做“瓜诺”的白干棕护心韧皮盖成，内有一床、一桌、一椅，污秽的地板上还有一处地方，供炭炊之用。"}, {"c": "7", "n": 34, "t": "妙，又奇怪，天晓得它的年纪有多大，他想。我从未见过体力这么强壮，或者行动这么离奇的大鱼"}, {"c": "10", "n": 33, "t": "“打它们，”他说，“我要打到自己断气才罢休。”"}, {"c": "9", "n": 33, "t": "如今正是飓风的季节，可是飓风季节的气候，在不起飓风的时候，却是一年中最晴好的日子。"}, {"c": "9", "n": 33, "t": "如果那孩子在这儿，他就会帮我揉手，从前臂一路揉松下来，他想。可是它会松下来的。"}, {"c": "10", "n": 32, "t": "“好了，”他说，“我还是一个老头子。可是我有武器了。”"}, {"c": "3", "n": 32, "t": "男孩说，“能干的渔夫很多，了不起的也有几个。可是像你这样的，只有一个。”"}, {"c": "4", "n": 32, "t": "梦见少年时去过的非洲，梦见漫长的金色海岸和白得刺眼的海岸，还有高耸的海岬、褐色的大山。"}, {"c": "6", "n": 32, "t": "可是，老人想道，我也有这么一颗心，而且我的手脚也和它们的相似。"}, {"c": "译序", "n": 32, "t": "这译本只能得七十分。"}]}, {"label": "张爱玲 · 北京十月", "pool": 117, "rating": "", "items": [{"c": "1", "n": 224, "t": "他的一切全是老的，除了他的眼睛，眼睛和海一个颜色，很愉快，没有战败过。"}, {"c": "译者序", "n": 216, "t": "海明威最常用的主题是毅力。他给毅力下的定义是：“在紧张状态下的从容。”"}, {"c": "译者序", "n": 198, "t": "所以有这些顾虑，同时也担忧我的译笔不能达出原著的淡远的幽默与悲哀，与文字的迷人的韵节。"}, {"c": "4", "n": 153, "t": "他过去已经证明过一千遍了，但是都不算数。现在他又重新证明它。每一次都是新的，他从来不想到他过去做的事。"}, {"c": "2", "n": 150, "t": "老人张开眼睛，在那一刹那间，他是从很远的地方回来。然后他微笑了。"}, {"c": "5", "n": 136, "t": "但是人不是为失败而生的，”他说。“一个男子汉可以被消灭，但是不能被打败。”"}, {"c": "4", "n": 128, "t": "想想看，要是一个人每天都得试着去杀月亮，他想。月亮逃走了。但是你想想，要是一个人每天都得试着去杀太阳，又怎么办？我们天生是幸运的，他想。"}, {"c": "1", "n": 117, "t": "帆上用面粉袋打着补钉；卷起来的时候，看上去像永久的失败的旗帜。"}, {"c": "译者序", "n": 117, "t": "《老人与海》里面的老渔人自己认为他以前的成就都不算，他必须一次又一次地重新证明他的能力，我觉得这两句话非常沉痛，仿佛是海明威在说他自己。"}, {"c": "3", "n": 117, "t": "他挑选居留在辽远的黑暗的深水里，没有罗网陷阱和欺诈的地方。我挑选到人迹不到的地方去找到他。现在我们遇在一起了，自从正午起就遇在一起了。我是没有一个人帮助我，他也没有一个人帮助他。"}, {"c": "1", "n": 112, "t": "但是没有一个伤痕是新的，都是古老的，像一个没有鱼的沙漠里被风沙侵蚀的地层一样。"}, {"c": "1", "n": 102, "t": "老人总觉得不必把鱼钩和鱼叉丢在船上，引诱人家。"}, {"c": "2", "n": 102, "t": "眼睛一闭着，脸上就没有生命。"}, {"c": "1", "n": 96, "t": "并没有网这样东西，孩子也记得他们那时候把它卖了。但是他们每天总要假造着，来这么一套。也并没有一锅黄米饭和鱼，孩子也知道。"}, {"c": "5", "n": 90, "t": "我绝对不要增加他的痛苦，他想。我的痛苦不要紧，我能够控制我的痛苦。但是他的痛苦可以使他发疯。"}, {"c": "1", "n": 85, "t": "“有什么不行呢？”老人说。“大家都是渔夫。”"}, {"c": "5", "n": 72, "t": "“老头子，不要想了，”他自言自语。“你顺着这条航线行驶，事情来到的时候就接受它。”"}, {"c": "2", "n": 72, "t": "你还是把毯子围在身上吧，”孩子说。“只要我活在世上一天，决不让你打鱼不吃饭。”"}, {"c": "3", "n": 72, "t": "假使他决定往下面去，我怎么办呢？我不知道。假如他潜入海底，死了，我怎么办呢；我不知道。但是我会想办法的。我能做的事情很多。"}, {"c": "1", "n": 68, "t": "把肝拿掉，鳍割掉，皮剥掉，肉切成一条条预备腌。"}, {"c": "1", "n": 68, "t": "他竟能够这样谦虚—他太单纯了，以至都没有奇怪自己什么时候才达到这样谦虚的地步。但是他知道他很谦虚，他也知道谦虚并不丢脸，而且也无伤他真正的自尊心。"}, {"c": "2", "n": 68, "t": "但是，老人总想着她是女性的，她可以给人很大的恩宠，也可以不给；假使她做出野蛮的恶毒的事情，那是因为她无法控制自己。月亮影响她，就像月亮影响女人一样，他想着。"}, {"c": "1", "n": 64, "t": "老人教了这孩子怎样打鱼，孩子爱他。"}, {"c": "5", "n": 64, "t": "他天天早上来的。孩子看见老人还有呼吸，然后他看见老人的手，他哭起来了。他静悄悄地走出去，去拿些咖啡来，一路上他一直哭着。"}, {"c": "3", "n": 60, "t": "但是我总是把它们弄得非常准确，他想。不过我现在运气不行了。但是谁知道呢？也许今天。每天都是新的一天。运气好当然更好了。但是我宁可准确。那么运气来的时候你是有准备的。"}, {"c": "3", "n": 60, "t": "也许我当初不该做一个渔夫，他想。但是我是注定为这件事而生的。"}, {"c": "1", "n": 56, "t": "露台上很愉快，晒着太阳。"}, {"c": "1", "n": 56, "t": "老人用他那日炙的、有自信心的眼睛爱怜地望着他。"}, {"c": "5", "n": 56, "t": "他把两只手并拢，摸摸手掌心。它们不是死的，他只要把手张开合拢，就可以感到生命的痛楚。他把背脊靠在船尾，他知道没有死。他的肩膀告诉了他。"}, {"c": "译者序", "n": 56, "t": "我对于海毫无好感。在航海的时候我常常觉得这世界上的水实在太多。"}, {"c": "1", "n": 55, "t": "他们在露台上坐着，许多渔夫都取笑那老人，他并不生气。另有些年纪大些的渔人向他看看，觉得很难过。"}, {"c": "1", "n": 55, "t": "他从来没有失去希望和信心。但是现在它们变得更清新有力了，就像一阵风刮起来一样。"}, {"c": "1", "n": 55, "t": "从前有一张他的妻的着色照片挂在墙上，但是他把它拿下来了，因为看着它使他太寂寞，"}, {"c": "1", "n": 55, "t": "“我想我也许借得到。但是我总想避免借钱。先是借钱，后来就要讨饭了。”"}, {"c": "1", "n": 55, "t": "“正是大鱼来的月份，”老人说。“五月里是谁都可以做个渔夫，不稀奇的。”"}, {"c": "5", "n": 55, "t": "他一面望着那鲨鱼逼近前来，一面向那大鱼看了一眼。等于做了一个梦，他想。我不能阻止他袭击我，但是我也许能弄死他。鲨鱼，他想。他妈的。"}, {"c": "1", "n": 54, "t": "“我不是不肯偷，”孩子说。“但这是我买的。”"}, {"c": "4", "n": 54, "t": "鱼，你现在觉得痛苦了，”他说。“天晓得，我也一样痛苦。”"}, {"c": "4", "n": 54, "t": "在这以后，他开始梦见那长长的黄色海滩，他看见第一只狮子在黄昏里下来到海滩上，然后其余的狮子也来了，他把他的下颏搁在船头的木头上，船停泊在那里，夜晚有微风从岸上吹来，他等着看还有更多……"}, {"c": "2", "n": 54, "t": "“我也许不像我自以为的那么强健，”老人说。“但是我知道许多诀窍，而且我有决心。”"}]}], "x": [{"seg": "「被毁灭，但不被打败」 · 五译本 + 原文", "rows": [["原文", "A man can be destroyed but not defeated.", 102], ["吴劳", "然而人不是为失败而生的。一个人可以被毁灭，但不能给打败。", 5412], ["李继宏", "但好汉不是为失败而生的。好汉可以被毁灭，但绝不能被打败。", 1476], ["余光中", "可是人不能认输。人可以毁灭，但不能屈服。", 120], ["张爱玲", "但是人不是为失败而生的。一个男子汉可以被消灭，但是不能被打败。", 136]]}]}, {"id": "3300061199", "name": "挪威的森林", "author": "村上春树 · 林少华 译", "link": "https://weread.qq.com/web/bookDetail/3300061199", "x_on": false, "editions": [{"label": "林少华 · 上海译文(平台唯一正编版)", "pool": 221, "rating": "", "items": [{"c": "第二章", "n": 7812, "t": "死并非生的对立面，而作为生的一部分永存。"}, {"c": "第一章", "n": 6624, "t": "想到这里，我悲哀得难以自禁。因为，直子连爱都没爱过我。"}, {"c": "第一章", "n": 6545, "t": "我想起自己在过去的人生旅途中失却的许多东西——蹉跎的岁月，死去或离去的人们，无可追回的懊悔。"}, {"c": "第一章", "n": 6409, "t": "三十七岁的我那时坐在波音747客机的座位上。庞大的机体穿过厚重的雨云，俯身向汉堡机场降落。"}, {"c": "第十一章", "n": 4785, "t": "直子死了以后，玲子仍给我来了几封信。"}, {"c": "第十一章", "n": 4545, "t": "目力所及，无不是不知走去哪里的无数男男女女。我从哪里也不是的场所的正中，不断呼唤着绿子。"}, {"c": "第一章", "n": 4536, "t": "“希望你能记住我。记住我这样活过、这样在你身边待过。可能一直记住？” “永远。”我回答。"}, {"c": "第一章", "n": 4114, "t": "而我，仿佛依然置身于那片草地之中，呼吸着草的芬芳，感受着风的轻柔，谛听着鸟的鸣啭：那是一九六九年的秋天，我快满二十岁的时候。"}, {"c": "第八章", "n": 3762, "t": "“那不是努力，只是劳动。”永泽断然说道，“我所说的努力与这截然不同。所谓努力，指的是主动而有目的的活动。”"}, {"c": "第一章", "n": 3757, "t": "记忆这东西总有些不可思议。实际身临其境的时候，几乎未曾意识到那片风景，未曾觉得它有什么撩人情怀之处，更没想到十八年后仍历历在目。"}, {"c": "第四章", "n": 3708, "t": "哪里会有人喜欢孤独，不过是不喜欢失望。"}, {"c": "第三章", "n": 3528, "t": "她所希求的并非是我的臂，而是某人的臂，她所希求的并非是我的体温，而是某人的体温。而我只能是我本身，于是我总觉得有些愧疚。"}, {"c": "第三章", "n": 3080, "t": "对直子的二十岁，我竟有些不可思议。我也好，直子也好，总以为应该还是在十八岁与十九岁之间徘徊才是。十八之后是十九，十九之后再十八——如此固然理想，但她终究二十岁了。到秋天我也将二十岁……"}, {"c": "第一章", "n": 2808, "t": "“或许我还没真正理解你。”我说，“我不是个头脑灵活的人，理解一件事需要有个过程。但只要有时间，总会完全理解你的，而且比世上任何人都理解得彻底。”"}, {"c": "第十一章", "n": 2682, "t": "“嗳，渡边君，和我干那个。”弹完后玲子悄声道。 “真是怪事，”我说，“我想的同样如此。”"}, {"c": "第四章", "n": 2674, "t": "列车远去后，我和小巧女孩不约而同地跨入旅馆。其实双方都不特别想一起睡觉，只是如若不睡，事情便无法收场。"}, {"c": "第三章", "n": 2646, "t": "“我也二十岁了，有点儿像开玩笑似的。”直子说，“我，一点儿也没做二十岁的准备，挺纳闷儿的，就像谁从背后硬推给我的一样。”"}, {"c": "第一章", "n": 2568, "t": "连日温馨的霏霏细雨，将夏日的尘埃冲洗无余。片片山坡叠青泻翠，抽穗的芒草在十月金风的吹拂下蜿蜒起伏，逶迤的薄云紧贴着仿佛冻僵的湛蓝的天穹。凝眸望去，长空寥廓，但觉双目隐隐作痛。"}, {"c": "第一章", "n": 2538, "t": "“那还不容易，永远这样不就行了！”我说。 “这话——可是心里的？” “当然是心里的。”"}, {"c": "第十章", "n": 2538, "t": "“喜欢我喜欢到什么程度？”绿子问。 “整个世界森林里的老虎全都融化成黄油。”"}, {"c": "第三章", "n": 2465, "t": "“不是说我不相信现代文学。我只是不愿意在阅读未经过时间洗礼的书籍上面浪费时间。人生短暂。”"}, {"c": "第六章", "n": 2448, "t": "面对如此光景，头脑渐渐乱成一团，茫无头绪。这到底算什么呢？这纷纭杂陈的场面到底意味着什么呢？"}, {"c": "第三章", "n": 2408, "t": "我几次朝夜幕伸出手去，指尖毫无所触，那小小的光点总是同指尖保持着一点点不可触及的距离。"}, {"c": "第一章", "n": 2340, "t": "在那个年龄，无论目睹什么感受什么还是思考什么，终归都像回旋镖一样转回到自己手上。"}, {"c": "第十章", "n": 2340, "t": "“不要同情自己！”他说，“同情自己是卑劣懦夫干的勾当。”"}, {"c": "作为婚恋对象的渡边与永泽（译序）", "n": 2322, "t": "恋爱最佳年龄段大概在十六到二十一岁之间"}, {"c": "第二章", "n": 2286, "t": "在去东京的新干线中，我回想起她的长处和优点，后悔自己做了一件十分亏心的事，可是已经追悔莫及。我决定把她忘掉。"}, {"c": "第二章", "n": 2250, "t": "世上果然有各种各样的希望，人生目的也各所不同。"}, {"c": "第三章", "n": 2184, "t": "我们两人漫无目标地在东京街头走来转去，上坡，过河，穿铁道口，只管走个没完。没有明确的目的地，反正走路即可。仿佛举行某种拯救灵魂的宗教仪式一般，我们专心致志地大走特走。下雨就撑伞走。"}, {"c": "第三章", "n": 2172, "t": "或许我的心包有一层硬壳，能破壳而入的东西是极其有限的，大概因为这个，我才不能对人一往情深。"}, {"c": "第七章", "n": 2128, "t": "我不由得心想：这样的星期日以后将重复几十次、几百次吧？“安静的、平和的、孤独的星期日”——我出声说道。星期日我是不上发条的。"}, {"c": "第二章", "n": 1980, "t": "木月的葬礼过后大约两周，我和直子见了次面。"}, {"c": "第一章", "n": 1968, "t": "虽然我明白只要写出第一行，往下就会文思泉涌，但就是死活写不出那第一行。"}, {"c": "第四章", "n": 1950, "t": "绅士就是：所做的，不是自己想做之事，而是自己应做之事"}, {"c": "第十章", "n": 1908, "t": "下次在教室见面不要打招呼。"}, {"c": "第二章", "n": 1846, "t": "如今想来，那真是奇特的日日夜夜，在活得好端端的青春时代，居然凡事都以死为轴心旋转不休。"}, {"c": "第一章", "n": 1819, "t": "她朝我转过脸，甜甜地一笑，微微地歪头，轻轻地启齿，定定地看着我的双眼，仿佛在一泓清澈的泉水里寻觅稍纵即逝的小鱼的行踪。"}, {"c": "第二章", "n": 1782, "t": "讲罢敢死队和他做广播体操的趣闻，直子“吃吃”笑了。其实我并不是当笑柄讲的，但结果我也笑了。她的笑脸——尽管稍纵即逝——实在是久违了。"}, {"c": "第一章", "n": 1770, "t": "我这人，无论对什么，都必须诉诸文字，否则就无法弄得水落石出。"}, {"c": "第八章", "n": 1744, "t": "人理解某人是水到渠成的事，并非某人希望对方理解所使然。"}]}], "x": []}, {"id": "912828", "name": "黄金时代", "author": "王小波", "link": "https://weread.qq.com/web/bookDetail/912828", "x_on": false, "editions": [{"label": "双版本合并(十月文艺 × 轻经典)", "pool": 338, "rating": "", "items": [{"c": "", "n": 9146, "t": "我二十一岁时，正在云南插队。陈清扬当时二十六岁，就在我插队的地方当医生。"}, {"c": "封面", "n": 8856, "t": "后来我才知道，生活就是个缓慢受槌的过程，人一天天老下去，奢望也一天天消失，最后变得像挨了槌的牛一样。"}, {"c": "六", "n": 6084, "t": "陈清扬告诉我这件事以后，火车就开走了。以后我再也没见过她。"}, {"c": "", "n": 5886, "t": "该狗既无左眼，又无右眼，也就不能跑回去让队长看见——天知道它跑到哪儿去了。"}, {"c": "五", "n": 5136, "t": "陈清扬说，人活在世上，就是为了忍受摧残，一直到死。想明了这一点，一切都能泰然处之。"}, {"c": "三", "n": 4932, "t": "当我沿着一条路走下去的时候，心里总想着另一条路上的事。这种时候我心里很乱。"}, {"c": "封面", "n": 4064, "t": "那一天我二十一岁，在我一生的黄金时代，我有好多奢望。我想爱，想吃，还想在一瞬间变成天上半明半暗的云。"}, {"c": "", "n": 4063, "t": "别人没有义务先弄明白你是否偷汉再决定是否管你叫破鞋。你倒有义务叫别人无法叫你破鞋。"}, {"c": "版权信息", "n": 3616, "t": "我始终盼着陈清扬来看我，但陈清扬始终没有来。她来的时候，我没有盼着她来。"}, {"c": "封面", "n": 3598, "t": "我说她竟敢觉得自己清白无辜，这本身就是最大的罪孽。照我的看法，每个人的本性都是好吃懒做，好色贪淫，假如你克勤克俭，守身如玉，这就犯了矫饰之罪，比好吃懒做、好色贪淫更可恶。"}, {"c": "封面", "n": 3383, "t": "其实伟大友谊不真也不假，就如世上一切东西一样，你信它是真，它就真下去。你疑它是假，它就是假的。我的话也半真不假。但是我随时准备兑现我的话，哪怕天崩地裂也不退却。就因为这种态度，别人……"}, {"c": "二", "n": 3367, "t": "“记得记得！那会儿我醒了。你在我肚脐上亲了一下吧？好危险，差一点爱上你。”"}, {"c": "黄金时代", "n": 3332, "t": "忽然间我感到很烦很累，不像二十一岁的人。我想，这样下去很快就会老了。"}, {"c": "六", "n": 3157, "t": "陈清扬说，那一刻她感到浑身无力，就瘫软下来，挂在我肩上。那一刻她觉得如春藤绕树，小鸟依人。她再也不想理会别的事，而且在那一瞬间把一切都遗忘。在那一瞬间她爱上了我，而且这件事永远不能……"}, {"c": "黄金时代", "n": 3024, "t": "那里的人习惯于把一切不是破鞋的人说成破鞋，而对真的破鞋放任自流。"}, {"c": "封面", "n": 2941, "t": "按他的逻辑，我身上这个通红通红，直不楞登，长约一尺的东西就是罪恶的化身。"}, {"c": "版权信息", "n": 2800, "t": "陈清扬披头散发眼皮红肿地跑了来，劈头第一句话就是：你别怕，要是你瘫了，我照顾你一辈子。"}, {"c": "封面", "n": 2771, "t": "亚热带旱季的阳光把我晒得浑身赤红，痛痒难当，我的小和尚直翘翘地指向天空，尺寸空前。"}, {"c": "", "n": 2760, "t": "大家都认为，结了婚的女人不偷汉，就该面色黝黑，乳房下垂。而你脸不黑而且白，乳房不下垂而且高耸，所以你是破鞋。"}, {"c": "版权信息", "n": 2628, "t": "大家都说存在的东西一定不存在，这是因为眼前的一切都是骗局。大家都说不存在的东西一定存在，比如王二，假如他不存在，这个名字是从哪里来的？"}, {"c": "二", "n": 2580, "t": "陈清扬后来和我说，每回和我做爱都深受折磨。在内心深处她很想叫出来，想抱住我狂吻，但是她不乐意。她不想爱别人，任何人都不爱；尽管如此，我吻她脚心时，一股辛辣的感觉还是钻到她心里来。"}, {"c": "版权信息", "n": 2541, "t": "大家对这种明火执仗的破鞋行径是如此的害怕，以致连说都不敢啦。"}, {"c": "", "n": 2478, "t": "但是我偏说，陈清扬就是破鞋，而且这一点毋庸置疑。"}, {"c": "封面", "n": 2448, "t": "从此后受术者只知道吃草干活，别的什么都不知道，连杀都不用捆。"}, {"c": "五", "n": 2400, "t": "但是我在深山里在她屁股上打了两下，彻底玷污了她的清白。"}, {"c": "封面", "n": 2329, "t": "唯一的问题是她是个女人，女人家总有点小气。为此我要启发她，所以我开始阐明什么叫做“义气”。"}, {"c": "四", "n": 2295, "t": "她还说，她无疑是当地斗过的破鞋里最漂亮的一个。斗她的时候，周围好几个队的人都去看，这让她觉得无比自豪。"}, {"c": "二", "n": 2288, "t": "等到她追出门去，我已经走了很远，我走路很快，而且从来不回头看。就因为这些原因，她根本就不爱我，也说不上喜欢。"}, {"c": "", "n": 2268, "t": "所谓破鞋者，乃是一个指称，大家都说你是破鞋，你就是破鞋，没什么道理可讲。大家说你偷了汉，你就是偷了汉，这也没什么道理可讲。"}, {"c": "序", "n": 2223, "t": "她丝毫也不怕成为破鞋，这比被人叫做破鞋而不是破鞋好得多。她所讨厌的是使她成为破鞋那件事本身。"}, {"c": "一", "n": 2208, "t": "于是我想到每个人都有自己的本质，放到合适的地方就大放光彩。"}, {"c": "", "n": 2197, "t": "现在大家都管她叫破鞋，弄得她魂不守舍，几乎连自己是谁都不知道了。"}, {"c": "序", "n": 2145, "t": "最后他也没从我嘴里套出话来。他甚至搞不清我是不是哑巴。别人说我不是哑巴，他始终不敢相信，因为他从来没听我说过一句话。他到今天想起我来，还是搞不清我是不是哑巴。想起这一点，我就万分的……"}, {"c": "三", "n": 2142, "t": "当然打陈清扬屁股也不是好事，但是我想别的破鞋和野汉子之间未必有这样的事。这件事离了题，所以就没写。"}, {"c": "四", "n": 2080, "t": "挨斗时她非常熟练，一听见说到我们，就从书包里掏出一双洗得干干净净用麻绳拴好的解放鞋，往脖子上一挂，等待上台了。"}, {"c": "封面", "n": 2048, "t": "我一生经历的无数次勃起，都不及那一次雄浑有力，大概是因为在极荒僻的地方，四野无人。"}, {"c": "版权信息", "n": 1920, "t": "对于我自己来说，存在不存在没有很大的关系。假如没有人来找我，我在附近种点玉米，可以永远不出来。就因为这个原因，我对自己存不存在的事不太关心。"}, {"c": "三", "n": 1824, "t": "陈清扬后来说，她一辈子只交了我一个朋友。她说，这一切都是因为我在河边的小屋里谈到伟大友谊。人活着总要做几件事情，这就是其中之一。以后她就没和任何人有过交情。同样的事做多了没意思。"}, {"c": "", "n": 1768, "t": "这些窟窿使她产生一个希望，就是也许能向我证明，她不是破鞋。有一个人承认她不是破鞋，和没人承认大不一样。可是我偏让她失望。"}, {"c": "封面", "n": 1755, "t": "为了防止斗架伤身，影响春耕，我们把它们都阉了。"}]}], "x": []}, {"id": "25131764", "name": "人生海海", "author": "麦家", "link": "https://weread.qq.com/web/bookDetail/25131764", "x_on": false, "editions": [{"label": "麦家 · 北京十月(唯一版)", "pool": 400, "rating": "", "items": [{"c": "第一章", "n": 33945, "t": "爷爷讲：“绰号是人脸上的疤，难看。但没绰号，像部队里的小战士，没职务，再好看也是没人看的，没斤量的。”"}, {"c": "第四章", "n": 26673, "t": "人啊，心头一定要有个怕，有个躲。世间很大，天外有天，山外有山，不能太任着性子，该低头时要低头，该认错时要认错。"}, {"c": "第十七章", "n": 26514, "t": "报纸上说，生活不是你活过的样子，而是你记住的样子。"}, {"c": "第二十章", "n": 22365, "t": "人比人气死人，我不跟人比，只跟自己比。报纸上说，幸福是养自己心的，不是养人家眼的。"}, {"c": "第五章", "n": 21618, "t": "大人很怪的，平时总教育我们要诚实，讲真话，不能撒谎，自己却经常鬼话连篇。"}, {"c": "第二章", "n": 21402, "t": "人世间就这样，池塘大了，水就深了，水深了，鱼就多了，大鱼小鱼，泥鳅黄鳝，乌龟王八，螃蟹龙虾，鲜的腥的，臊的臭的，什么货色都有。”"}, {"c": "第二十章", "n": 20040, "t": "没有完美的人生，不完美才是人生。"}, {"c": "第十五章", "n": 16590, "t": "我只知道，半夜里我被尿憋醒，迷迷蒙蒙跑去撒尿，经过前堂时一头撞见父亲跪在地上，在对祖先磕头。第二天，我注意到父亲额头上有一块乌青，我看着就想哭了。"}, {"c": "第二十章", "n": 16419, "t": "世上只有一种英雄主义，就是在认清了生活真相后依然热爱生活。"}, {"c": "第二章", "n": 16282, "t": "总之，爷爷活成一个老埠头，你要改变他是很难的，不像我。我像三月里的桃树，一夜之间变成一幅画、一本诗，花枝招展，灿烂得连自己都认不得。"}, {"c": "第二章", "n": 15818, "t": "“喏，给你，不就是几块钱的事嘛，值得用性命去抵。世上命最值钱，我被人骂成太监都照样活着，你死什么死，轮不上。”"}, {"c": "第十七章", "n": 14450, "t": "人要学会放下，放下是一种饶人的善良，也是饶过自己的智慧。"}, {"c": "第十八章", "n": 13212, "t": "报纸上说的，当一个人心怀悲悯时就不会去索取，悲悯是清空欲望的删除键。"}, {"c": "第二章", "n": 12954, "t": "我们经常这样数落太监和他老母亲，我和表哥的友谊也因此变得更加深厚牢固，好像我们有一个共同敌人，我们必须团结一起，不弃不离。"}, {"c": "第三章", "n": 12254, "t": "我本来是鼓足力气抱他的，反而被这个轻压垮了，哭了。"}, {"c": "第一章", "n": 12144, "t": "世间海大，但都在老天爷眼里，如来佛手里，凡人凡事都逃不出报应的锁链子，善有善报，恶有恶果。"}, {"c": "第一章", "n": 11984, "t": "秋末冬初，风是染料，把碧绿的树叶子一层层染，最后染成黄铜色。"}, {"c": "第一章", "n": 11328, "t": "春末秋初都是夏天，像夏天的凌晨四五点和夜晚七八点都是白天一样。"}, {"c": "第十六章", "n": 11196, "t": "这个该死的下午，天地是雪白，可人是污黑的，坏人打好人，儿子骂老子，天理皇道塌下来，压得我窒息，心里眼前一团黑，恨不得哭死。"}, {"c": "第三章", "n": 10422, "t": "爷爷讲：“这就是命，事先讲不清，事后都讲得清。”"}, {"c": "第十七章", "n": 10320, "t": "父亲说：“他就这样疯了。”"}, {"c": "第十八章", "n": 10010, "t": "心有雷霆面若静湖，这是生命的厚度，是沧桑堆积起来的。"}, {"c": "第二十章", "n": 9416, "t": "人生如戏，每一出戏都明里暗地连好的，如果我没有三年流浪汉的垃圾生活，就不可能有后来的垃圾生意；曾经垃圾让我丢尽脸面，如今垃圾加倍地偿还我尊严。"}, {"c": "第九章", "n": 9378, "t": "我活一辈子，什么兵都见过，最怕的就是红卫兵，横的不讲理，竖的不讲人性，叫你彻底没话讲，没理论。"}, {"c": "第二十章", "n": 9350, "t": "当时我连“人生海海”也不知什么意思。她扑哧一下笑了，告诉我这是一句闽南话，是形容人生复杂多变但又不止这意思，它的意思像大海一样宽广，但总的说是教人好好活而不是去死的意思。"}, {"c": "第十八章", "n": 9333, "t": "在乡下，人心像日常生活一样粗糙简单，黑白分明，分辨不了黑白交织出来的复杂图案和色彩。"}, {"c": "第十八章", "n": 9310, "t": "报纸上说，生活是部压榨机，把人榨成了渣子，但人本身是压榨机中的头号零件。"}, {"c": "第七章", "n": 9020, "t": "“他该难过的都难过了还有什么好难过的。”"}, {"c": "第十三章", "n": 9000, "t": "什么是道德？损人利己的事可以做，损人不利己的事不能做。"}, {"c": "第十四章", "n": 8931, "t": "人们爱听瞎话，不爱听真话，正如大家互相不叫名字，爱叫绰号一样。"}, {"c": "第四章", "n": 8766, "t": "俗话讲不怕老只怕小，小鬼作恶老鬼哭。你不晓得，我早晓得，城里被这些小鬼搅翻了天，每天江面上都浮出无名死尸。这些小子心还没有长圆，做事没轻重，还是避一避好。”"}, {"c": "第八章", "n": 8250, "t": "人言可畏，人心叵测。有些人的心是黑的，存心用来害人的，有些人的嘴是专门长来放屁造谣的。"}, {"c": "第十三章", "n": 7944, "t": "人和兽之间，只隔着一团愤怒，像生死之间只隔着一层纸"}, {"c": "第十六章", "n": 7837, "t": "父亲讲，声不高，音偏轻，一字一字吐出来：“你不是人，从今后，我不会再叫你一声爹，不会同你，吃一桌饭，不会管你，是死是活。我只管葬你，料你也活不长了，早死早收场。”"}, {"c": "第九章", "n": 7531, "t": "你无法想象，听到他们走后我激动得哭了。 这一天我哭了好几次，真是难忘的一天啊！"}, {"c": "第二十章", "n": 7500, "t": "一切都是蓄谋已久的，作为一个前麻醉师，阿姨以最专业的方式结束了自己，追随爱人而去。她不能选择和上校同时生，却可以选择同时死。她选择和上校同时死，是为了来生与他同时生吗？"}, {"c": "第十四章", "n": 7488, "t": "人就这样的，往回看什么人都可以做诸葛亮，但往前看诸葛亮也要被气死。"}, {"c": "第十六章", "n": 7189, "t": "爷爷讲：“你公安局给村里出证明，讲明事实。我们讲破天都没用，你们写一张证明就有用。”"}, {"c": "第二十章", "n": 6992, "t": "人生海海，敢死不叫勇气，活着才需要勇气"}, {"c": "第十九章", "n": 6768, "t": "人像一枚硬币，有两面，遇到好的一面是你运气，遇到坏的一面是你晦气，如果两面都叫你遇到则不免要丧气叹气。"}]}], "x": []}, {"id": "3300089720", "name": "沙丘", "author": "弗兰克·赫伯特 · 顾备 译", "link": "https://weread.qq.com/web/bookDetail/3300089720", "x_on": false, "editions": [{"label": "顾备 · 双载体合并(单行本 × 六部曲)", "pool": 587, "rating": "", "items": [{"c": "", "n": 1120, "t": "“曾经，人们一度将思维能力赋予机器，希望用机器代替人类的劳作，将人们从劳作中解放出来。然而，这只会使机器的拥有者奴役其他人。”"}, {"c": "", "n": 697, "t": "阻止某一进程的发展无助于理解其本质，唯有在其发展过程中才能逐渐加深对该进程的理解，必须融入其中，与其一道发展。"}, {"c": "", "n": 576, "t": "希望会蒙蔽观察力。"}, {"c": "", "n": 558, "t": "只有意外和偏差，才是宇宙中最恒定不变的事物。"}, {"c": "", "n": 495, "t": "谨以此书献给那些孜孜不倦的劳作之人，他们不限于纸上谈兵，而是创造出了“真材实料”的王国"}, {"c": "", "n": 468, "t": "“毫无偏差地通往终点的路必定使行路者毫无所得。要证明这里有一座大山，只需向上稍稍攀爬即可。站在山顶上，你会看不见山的。”"}, {"c": "", "n": 408, "t": "对一个人的评价，不是依据你认为他会做什么，而是看他实际上做了些什么。"}, {"c": "", "n": 396, "t": "越接近所欲之物，人便越容易放纵自己的欲望。走上这条道路，一路危机四伏。"}, {"c": "", "n": 390, "t": "“柳枝顺从风意才能根深叶茂，有朝一日繁茂成林，形成一堵挡风墙。这就是柳树的使命。”"}, {"c": "", "n": 374, "t": "“恐惧是思维的杀手，是潜伏的小小死神，会彻底毁灭一个人。我要直面它，让它掠过我的心头，穿越我的身心。当这一切过去之后，我将睁开心灵深处的眼睛，审视它的轨迹。恐惧如风，风过无痕，唯有……"}, {"c": "", "n": 360, "t": "保罗闭上双眼：现在，父亲，我终于可以哀悼您了。他感到泪水滑下自己的面庞。"}, {"c": "", "n": 360, "t": "他们居然想要我儿子的命！"}, {"c": "", "n": 360, "t": "发觉自己的父亲是个普通人，同样是血肉之躯——这也许是世上最可怕的觉醒。"}, {"c": "", "n": 325, "t": "眉毛的形状却承自他那名字讳莫如深的外公"}, {"c": "", "n": 315, "t": "不过，那个公主除了名分之外，什么也得不到。不会有我的孩子，不会得到我的爱抚，不会拥有我温柔的目光，更不会有片刻温存。”"}, {"c": "", "n": 300, "t": "只要用矛钩钩开沙虫环状鳞甲的前端，暴露出沙虫十分敏感的软组织，这家伙担心沙子钻进鳞甲里引起擦伤，就不会钻回到沙子里。事实上，它会卷起巨大的躯干，使被钩开的部分尽可能远离沙漠地表。"}, {"c": "", "n": 300, "t": "人类潜意识的深处存在一种压倒一切的需求，即追求一个符合逻辑、凡事有理可据的宇宙。但是，现实中的宇宙总是领先逻辑一步，是逻辑无法企及的。"}, {"c": "", "n": 294, "t": "她说生命的神秘并不是要解决的问题，而是必须经历的现实。"}, {"c": "", "n": 289, "t": "“胶片片基的供应绝不能出现短缺。”公爵说，“否则，我们怎么才能把自己的宣传信息铺天盖地送往乡村、城市？这里的人民必须知道我统治有方。如果我们不宣传，他们怎么可能知道呢？”"}, {"c": "", "n": 288, "t": "有些人看出了血脉延续在人类社会中的重要性，而最初的贝尼·杰瑟里特学校就掌握在这些人手中。他们注意到，如果不在繁衍过程中将真命之子与动物似的凡人区分开来，这种延续性就不可能存在。”"}, {"c": "", "n": 288, "t": "哈莱克总是这么让人吃惊——满脑子歌谣、引用的语句和鲜花般的诗句……可面对哈克南人的时候，他又是一名无情的杀手。"}, {"c": "", "n": 285, "t": "菲得-罗萨走在男爵肘边，满头黑发烫成一个个发卷，显得喜气洋洋，只是与下面那双阴郁的眼睛不甚协调。他穿着黑色的紧身束腰外衣，紧身长裤，裤脚略呈喇叭形，小脚上套着一双软底鞋。"}, {"c": "", "n": 272, "t": "在我们每个人的身上，都有两种古老的力量——夺取和给予。一个男人不难面对他身体里那股夺取的力量，但他几乎不可能看到给予的力量，除非他变成男人以外的其他什么性别。而对女人来说，情况恰恰……"}, {"c": "", "n": 272, "t": "“我们骑得够远的了。它会把自己埋进沙里，生上一两天的闷气。”保罗说。"}, {"c": "", "n": 270, "t": "“对不起，外公，”厄莉娅说，“你已经中了厄崔迪的戈姆刺。”她站起身来，一支黑针从她手中落下。"}, {"c": "", "n": 266, "t": "而我们，契妮，背负着姬妾名分的我们——历史将会把我们称作妻子。”"}, {"c": "", "n": 264, "t": "一个世界是许多东西的集合——人、土壤、生物、月亮、潮汐、太阳以及许多不知名的东西，其集合被统称为“自然”。在这个模糊的集合中，不存在“现在”这个概念。他想：什么是现在？"}, {"c": "", "n": 256, "t": "保罗静静地坐在黑暗中，脑子里只有一个念头：我母亲是我的敌人。她现在还不知道，但她的确是我的敌人。她要发动圣战。她生我养我，训练了我，但她却是我的敌人。"}, {"c": "", "n": 255, "t": "据说，某一天会出现一个男人，他将在药物的激发下开发自己内心的灵眼，然后，他将有能力看到我们永远看不到的东西——属于女性和男性的过去。”"}, {"c": "", "n": 252, "t": "圣·尖刀厄莉娅说过：“圣母必须把妓女的魅惑手段与童真女神高不可攀的威严结合起来，只要青春不老，就应该毫不懈怠地运用这些特性。"}, {"c": "", "n": 240, "t": "一只眼睛看过去，一只眼睛看现在，一只眼睛看将来——三者结合在一起，合成一个三重幻象，他由此看到了时间转变成的空间。"}, {"c": "", "n": 240, "t": "该死的杰西卡！圣母在心里骂道，要是她遵照命令生个女孩出来，不就什么麻烦都没了？"}, {"c": "", "n": 240, "t": "“不要让你的人民落进某个英雄的手里，再没有比这更可怕的灾难了。”他父亲说。"}, {"c": "", "n": 238, "t": "应该有一门研究不满情绪的学科，因为人们需要偶尔过过苦日子，也需要有适当的压力，这样才能强健心智和体魄。"}, {"c": "", "n": 238, "t": "保罗立即意识到，自己以前从来没见过这么大的造物主，甚至没听说过有这么大尺寸的沙虫。它的长度看上去超过二千四百米，凸起的巨头一路拱起沙浪，像一座不断向前移动的大山。"}, {"c": "", "n": 238, "t": "未来是宽广的，会出现各种各样的结局。但在向未来前进的过程中，时间却成了一扇窄门，只允许一个结局。"}, {"c": "", "n": 234, "t": "与朋友分别才令人伤心，地方不过就是个地方。"}, {"c": "", "n": 234, "t": "她对厄崔迪家族的仇恨是多么刻骨铭心啊，竟连自己的儿子也不放过，就像我对这个男爵所怀的深仇大恨。他想，我对他的致命一击能否像她一样，足以彻底结束男爵"}, {"c": "", "n": 230, "t": "想要了解穆阿迪布，却不了解他的死敌哈克南人，这就像要寻求真理却不懂得谬误，要追逐光明却不懂得黑暗一样，都是不可能的。"}, {"c": "", "n": 225, "t": "自己的期望和之前的判断相反，凯恩斯暗暗承认：我喜欢这位公爵。"}]}], "x": []}, {"id": "926346", "name": "海伯利安", "author": "丹·西蒙斯 · 潘振华等 译", "link": "https://weread.qq.com/web/bookDetail/926346", "x_on": false, "editions": [{"label": "潘振华等 · 四部曲合集·第一部", "pool": 153, "rating": "", "items": [{"c": "01", "n": 702, "t": "禅灵教说，空虚是好迹象；那预示着新层次意识、新的见识、新的体验的到来。 妈的。 我的空虚……仅仅是空虚。"}, {"c": "04", "n": 608, "t": "对任何神灵或观念或普遍准则的忠诚，若是要求“顺从高于一切”，甚至高于善待无辜之人这样起码的品德了，它就是邪恶的。"}, {"c": "尾声", "n": 510, "t": "他们仍旧高声歌唱，不再回头，大步大步地向前进，一路向下，迈进了山谷。"}, {"c": "03", "n": 434, "t": "词语让我们的思想转向自我错觉的无限小径，事实上，我们大多数的思想生活都住在由词语建成的头脑大厦中，也就是说，我们缺乏必要的客观，无法发现语言对现实的可怕扭曲。"}, {"c": "05", "n": 378, "t": "他点头算是默认。“济慈，”他说，“公元一七九五年出生，一八二一年死于肺结核。约翰·济慈。”"}, {"c": "03", "n": 374, "t": "起初有了词语。接着就有了他妈的文字处理器。接着又来了思想处理器。接着就是文学的死亡。事儿就是这样。"}, {"c": "02", "n": 352, "t": "一切都托付给西奥——安静、能干的西奥，让他度过早上。一切都托付给运气，让他度过一天。一切都托付给西塞罗酒吧的酒，让他度过晚上。一切都托付给他无足轻重的职位，让他度过一生。"}, {"c": "03", "n": 338, "t": "起初有了词语。 最后……超越荣誉，超越生命，超越人道…… 最后会有词语。"}, {"c": "01", "n": 320, "t": "经过多次询问，我确定，他们杀塔克是为了让他死，他之所以死是因为他被杀了。"}, {"c": "01", "n": 320, "t": "他曾经是一个父亲。他的孩子已死。领事继续走着，他再一次感觉到某种情绪，那是抱着熟睡孩子上床的心情。"}, {"c": "05", "n": 320, "t": "虽然有严格的法律来保护卡的隐私，但是法律有一个坏习惯——当普通人的利益与极权政府的利益相冲突时，法律就会被忽视，被废黜。"}, {"c": "06", "n": 294, "t": "我还是个孩子时，就曾独自回到希莉的坟墓，向她发誓，我定会向霸主复仇，打那时起，我就知道我必须这么做。我知道我必须付出怎样的代价，不管是我个人的人生，还是整个历史。"}, {"c": "01", "n": 288, "t": "我曾经是天主教徒、启示教徒、新马克思主义者、界面狂徒、虔诚的震荡教徒、恶魔信徒，还是杰克的那达教会的主教、保证重生协会的缴费会员。现在，我很高兴地说，我是名单纯的异教徒。"}, {"c": "05", "n": 288, "t": "它们很快知道，所谓的光阴冢，是至少一万年后的银河未来所投下的人造之物，从那时开始，逆时间进发。然而，更让内核不安的是这样一个事实——它们的预言公式无法分解海伯利安这个变数。"}, {"c": "03", "n": 285, "t": "人工智能非常喜欢，”泰伦娜说，“然后我们就确定，人们肯定不会喜欢的。"}, {"c": "05", "n": 273, "t": "一丝悲伤掠过那双淡褐色的眼睛：“或许对你来说很好笑，但你完全不了解对技术内核的成员来说，丧失一分钟……连接……意味着什么。那是万古的时间和信息。数千年无法交流的死寂。”"}, {"c": "01", "n": 272, "t": "自地球死亡以来，宗教裁判所已经销声匿迹四个世纪了。"}, {"c": "03", "n": 260, "t": "二十世纪的旧地上，某个快餐食物链用死牛肉，油炸一下，加上些致癌物质，包在石油基塑料里，那卖掉了九千亿呢。去想想吧。这就是人类。"}, {"c": "01", "n": 255, "t": "我现在懂得了信仰需要的是纯洁、盲从以及公然违抗理性。我就像宇宙那狂野无穷海洋中的小生命的保护者，而这个宇宙由无情的法则所支配，对栖息在里面的微小生命完全不放在心上。"}, {"c": "01", "n": 238, "t": "毫无疑问，我在停滞不前的人类社会中，发现了终极事实。毕库拉实现了人类的梦想：永生。但也为此付出了他们的人性和不朽的灵魂。"}, {"c": "01", "n": 225, "t": "我知道得越多，我懂得越少。"}, {"c": "01", "n": 225, "t": "我是十字形的人了。"}, {"c": "01", "n": 221, "t": "朝圣者的数量只有在质数的情况下，才能完成伯劳教会发起的北上朝圣之旅。"}, {"c": "02", "n": 221, "t": "“几年来你一直出现在我的梦里，”他对她说。 “对。你的过去，我的未来。事件的冲击波在时间长河里流淌，就像池塘里的波纹。”"}, {"c": "序", "n": 220, "t": "七个朝圣者中至少有一个是驱逐者安插的间谍。此时此刻……我们没有任何办法……得知此人是谁。"}, {"c": "04", "n": 220, "t": "“听着！再不会有任何献祭，不论孩子，还是父母。也不会有人为我们人类以外的其他人牺牲。以恭顺求救赎的时代早已过去。”"}, {"c": "06", "n": 216, "t": "技术内核向霸主提供并继续维护远距传输器。人类科学家和科学小组完全搞不懂远距传输器是如何运作的。"}, {"c": "序", "n": 210, "t": "计算机得花几秒钟转换并解密那串衰减的超光速粒子脉冲信号"}, {"c": "02", "n": 196, "t": "他们一丝不挂地待在黑夜里，站在那儿交欢。她背靠着一棵树，双腿夹着他的身体，世界在他们身后爆炸，防御带闪现着绿光，克莱莫地雷爆炸时发出隆隆的响声。"}, {"c": "04", "n": 192, "t": "——这到底是为什么呢？ ——人类承受的各种形式的苦痛，到底有什么可见的理由？"}, {"c": "03", "n": 192, "t": "我一句话也没说。如果目光能杀人，那我们都将在黄昏前哭喊着：“国王死了，国王万岁！”"}, {"c": "03", "n": 187, "t": "语言不仅仅用来表达思想，而且可以创造思想，没有它，就不会存在这些思想。"}, {"c": "03", "n": 182, "t": "但是我发现，只要这任务是既繁重又反复的，我的头脑就会无拘无束地漫步在更富想象力的区域里，不仅如此，它还会飞也似的逃向更高的层面。"}, {"c": "序", "n": 180, "t": "它违抗一切物理法则，仅仅通过屠杀来交流。"}, {"c": "03", "n": 180, "t": "我试图把这想法解释给天国之门上的朋友听。“尿，屎，”我说，“屁眼直娘贼，天打雷劈屎天打雷劈。屄。嘘嘘屄。天打雷劈！”"}, {"c": "04", "n": 176, "t": "“索尔！带上你的女儿，你唯一的女儿瑞秋，你钟爱的女儿，去一个叫作海伯利安的星球，在我即将指引你之地，将她献为燔祭。”"}, {"c": "04", "n": 170, "t": "她最后和最初的微笑。"}, {"c": "05", "n": 170, "t": "他没放开，反而靠了过来，吻了我。他的嘴唇柔软、温存，那一吻仿佛持续了天长地久。他是机器，我想。表面是人，背后是机器。"}, {"c": "05", "n": 170, "t": "赐福于她 赐福于我们救世主的母亲 赐福于我们赎罪的工具 赐福于我们创造物的新娘 赐福于她"}, {"c": "01", "n": 170, "t": "哦，我的上帝啊……七年来一直活着。死着。十字形……促使他再次活过来。电流……七年来每一秒……都在他身体内翻腾。火焰。饥饿。痛苦。死亡"}]}], "x": []}, {"id": "3300026591", "name": "德米安", "author": "黑塞", "link": "https://weread.qq.com/web/bookDetail/3300026591", "x_on": true, "editions": [{"label": "李贻琼 · 译林", "pool": 191, "rating": "top1 10,400", "items": [{"c": "文前", "n": 10400, "t": "我之所愿无非是尝试依本性而生活， 却缘何如此之难？"}, {"c": "两个世界", "n": 7837, "t": "每个人在成为自我之前，都必须打破之前固有的东西。这些经历并非肉眼可见，却是命运内在而本质的脉络。裂痕会弥合，可以被治愈被遗忘，但它永远寓于内心某个隐秘的角落继续淌血。"}, {"c": "强盗", "n": 5985, "t": "童年渐渐枯萎凋亡，爱恋的人与物渐行渐远，只有孤独和冰冷的周遭世界陪伴。很多人永远无法逾越这片峭壁悬崖，一生都在失落，永远痛苦地缅怀自己失去的欢乐——这是噩梦中的噩梦。"}, {"c": "爱娃夫人", "n": 5616, "t": "“爱不能祈求而来，”她说，“也不能去索取。爱需要自我肯定的力量。它不是被吸引，而是去主动吸引。辛克莱尔，你的爱是被我吸引来的，如果它能吸引到我，我自己就会来的。我不想赠予，而是被赢……"}, {"c": "强盗", "n": 5160, "t": "疏于独立思考和自我评判的人只能顺应现成的世俗法则，让生活变轻松。其他人则有自己的戒条：正派人惯常做的事于他可能是禁忌，而他自认合理的或许遭他人唾弃。所以说，每个人要有他自己的判断……"}, {"c": "贝娅特丽丝", "n": 5100, "t": "我的梦想、我的期待、我内在的转变，对谁都无法诉说，即便我想说。 而我无从说起。"}, {"c": "文前", "n": 5016, "t": "我们可以相互理解，但自我的诠释却只能亲力亲为。"}, {"c": "雅各的战斗", "n": 4851, "t": "我们恨一个人，其实是在他的形象里恨我们自己内心的东西。内心不存在的事物不会激起我们强烈的情绪。"}, {"c": "结束与新生", "n": 4425, "t": "有时我能找到钥匙，下潜到自我深处，在昏暗的镜子里看到命运之象在那里浅睡，我只需朝着镜子躬身，就能看到自己的样子，这个我和他一样，他，就是我的朋友和导师。"}, {"c": "贝娅特丽丝", "n": 4248, "t": "我怎么到现在才发现，这是德米安的脸！"}, {"c": "鸟儿奋力破壳而出", "n": 4116, "t": "其实，偶然并不存在，你必须得到某个东西时，它的出现绝非偶然，而是你自己，你自己的渴望和需求将你引向那里。"}, {"c": "两个世界", "n": 3978, "t": "我的生活全毁了，我甚至在想是不是要离家出走，或者干脆跳河淹死算了。我在黑暗中胡思乱想，坐在最下面一级台阶上，蜷缩成一团，沉浸在自怜自艾中。"}, {"c": "文前", "n": 3795, "t": "我不认为自己世事练达，我曾经是、现在依然是个探索者，但我不再去星辰或书本里寻找知识，而是开始倾听内心血液的沸腾。"}, {"c": "鸟儿奋力破壳而出", "n": 3780, "t": "“飞鸟奋力欲破壳而出。蛋即世界。欲新生者必先摧毁世界。鸟儿飞向上帝，上帝之名是阿布拉克萨斯。”"}, {"c": "强盗", "n": 3723, "t": "生命的启迪往往来自“另一个世界”，并夹带着恐惧、约束和愧疚。它们颇具革命性，冲击着我本愿蜗居其中的平静生活。"}, {"c": "该隐", "n": 3600, "t": "我们生来不应该害怕别人，如果害怕某个人，那是因为你赋予了他强大的力量。你做了错事，正好让他知道了，于是他就能掌控你。"}, {"c": "贝娅特丽丝", "n": 3430, "t": "命运与性情是一个概念的两个名字。"}, {"c": "强盗", "n": 3263, "t": "自视聪明的言说没有任何价值，只能让我们远离自我，进而成为一种罪孽。人应该像乌龟一样完全躲进自己的内心。"}, {"c": "该隐", "n": 3124, "t": "今天，我终于明白，世上最为艰难的就是自我实现的道路。"}, {"c": "雅各的战斗", "n": 3094, "t": "每个人都有自己的天职，但并非自己能选择、规定或任意管理的。想要新的神是错误的，想给予这个世界新的东西是根本的错误！觉醒的人们唯一的责任就是，找到自我，成为自我，自己摸索前行的路，无……"}, {"c": "该隐", "n": 2970, "t": "他们会为我惋惜，但不会真正理解；在他们眼中这只是偶尔的脱轨，其实却是命运使然。"}, {"c": "强盗", "n": 2925, "t": "只有付诸生活的思想才有价值。"}, {"c": "爱娃夫人", "n": 2896, "t": "“是啊，我们必须找到自己的梦，人生的道路才会轻松。但世上没有永恒的梦，新旧交替才是永恒。我们不能抱持一个梦不放手。”"}, {"c": "强盗", "n": 2775, "t": "书籍只是纸张，音乐成了噪声。我像秋天的一棵树，任凭树叶飘零，雨水敲打，自己全无知觉，感受不到阳光或者严寒。生命在萎缩，在内敛，它没有死，它只是在等待。"}, {"c": "雅各的战斗", "n": 2686, "t": "催化我成熟的并不是博学，而是我内心的寻找，对梦境、思想和知觉逐渐增加的信任，对我内心力量的认识，这些都非常有益。"}, {"c": "贝娅特丽丝", "n": 2665, "t": "我和贝娅特丽丝没有说过一句话，但她对我意义重大。她将自己的形象放在我面前，为我打开一扇神圣的大门，让我成为朝圣者。我不再去酒馆，夜里也不再到处闲逛。我又开始独处，重新爱上了阅读和散……"}, {"c": "文前", "n": 2613, "t": "人的一生是自我寻觅的过程，在大大小小的路途上尝试并获得启示，没有人能得到完美的结局。"}, {"c": "该隐", "n": 2534, "t": "。我继续梦到被虐待被强暴，但这次，压在我身上的不是克罗默而是德米安。这新的梦境让我挥之不去，克罗默带给我的是痛苦和折磨，而换成德米安我却好像很愿意承受，恐惧中掺杂着快感。"}, {"c": "强盗", "n": 2492, "t": "如果一只动物或一个人的注意力和意念完全集中在某一特定的事物上，那它或他一定能够达成目标，就是这样。如果你拿出足够的时间去观察一个人，那最终你会比他自己更了解他。”"}, {"c": "爱娃夫人", "n": 2432, "t": "美好的事物并没有离开，只是被掩埋和遮盖，对于自由而成熟的人来说，世界依然流光溢彩，我依然可以像孩童一样享受这一切。"}, {"c": "结束与新生", "n": 2310, "t": "以前我常想，为什么人们不能为自己的理想而活，而现在我看到的是，几乎所有人都可以为了理想去死，只不过那个理想不是个人自由的选择，而是共有的、从他人那里承继来的。"}, {"c": "强盗", "n": 2288, "t": "（我至今仍记得，每次早晨上课，在拥挤的教室那五味杂陈的空气中，我多喜欢闻他衣领里那清新的香皂味儿！）"}, {"c": "爱娃夫人", "n": 2196, "t": "你不应该把自己交给你无法信任的愿望。我知道你想要什么，你要么放弃，要么一心一意追求。只要充满信心，愿望一定会实现。如果心存梦想，又思前想后，怕自己后悔，结果肯定不会如愿。你要克服这……"}, {"c": "贝娅特丽丝", "n": 2159, "t": "不是你，而是你的意象把我们俩结合在一起。你是我命运的一部分。"}, {"c": "爱娃夫人", "n": 2064, "t": "人类付出巨大的努力创造了威力强大的新武器，但精神却陷入深深的荒芜。它赢得了全世界，却为此失去了灵魂。"}, {"c": "爱娃夫人", "n": 2044, "t": "“辛克莱尔，我们永远都在路上，”她说，“不过，当我们彼此的道路交会在一起时，整个世界就是家乡。”"}, {"c": "爱娃夫人", "n": 2034, "t": "人只有与自我无法协调统一时才会感到害怕。"}, {"c": "贝娅特丽丝", "n": 2002, "t": "我原本是多愁善感的乖孩子，但现在像变了个人，对周围的世界漠不关心，只忙于倾听自己的内心，体验那隐秘的、禁忌的、洪流一般涌动的欲望。"}, {"c": "贝娅特丽丝", "n": 2002, "t": "我们内心有一种东西，它无所不知，无所不愿，做任何事都更出色，知道这一点就好。"}, {"c": "两个世界", "n": 1992, "t": "我多么希望母亲能折返回来，能看出我的心事，吻我并满怀慈爱地询问我。然后我大哭一场，将心上的石头融化，在她怀里坦白一切，那时我便得救了。"}]}, {"label": "姜乙 · 果麦(节选)", "pool": 30, "rating": "", "items": []}], "x": [{"seg": "鸟与蛋 · 阿布拉克萨斯(各版必收段)", "rows": [["李贻琼", "飞鸟奋力欲破壳而出。蛋即世界。欲新生者必先摧毁世界。鸟儿飞向上帝，上帝之名是阿布拉克萨斯。", 3780], ["姜乙", "鸟奋争出壳。蛋就是世界。谁若要诞生，就必须毁掉世界。鸟飞向神。神叫阿布拉克萨斯。", 3020], ["丁君君", "鸟要挣脱出壳。蛋就是世界。人要诞于世上，就得摧毁这个世界。鸟飞向神。神的名字叫阿布拉克萨斯。", 1600]]}, {"seg": "Vorrede 开篇(全书第一句)", "rows": [["李贻琼", "我之所愿无非是尝试依本性而生活，却缘何如此之难？", 10400]]}]}, {"id": "brooklyn", "name": "布鲁克林有棵树", "author": "贝蒂·史密斯", "link": "https://weread.qq.com/web/bookDetail/3300048239", "x_on": true, "editions": [{"label": "冯瑞贞(主)", "pool": 767, "rating": "", "items": [{"c": "42", "n": 18306, "t": "“弗兰茜，大约一年前，他给了我一张写好的卡片和两块钱。他说，‘弗兰茜参加毕业典礼的时候，请代我送她一束花——我怕自己忘了。’”"}, {"c": "前 言", "n": 16198, "t": "活下去、继续奋斗，当然更要热爱生活——要爱着生活里的一切，它馈赠的伤怀与喜悦，因为这就是生活的充实。人人皆能从中找到救赎。"}, {"c": "文前", "n": 15966, "t": "等我长大了，要有自己的家，家里要有书、书、书……"}, {"c": "文前", "n": 15419, "t": "孩子必须有一个秘密世界，那里住着世间不存在的东西"}, {"c": "前 言", "n": 14418, "t": "孩提时代，我喜欢倾听，总能听到大人们在说他们的梦想与胆魄，但终归都会以壮志未酬结尾。几乎人人都要说上一句“要是我从头再来一次……”我想，这些先生和女士们已经错过了现在生活中的充实。"}, {"c": "2", "n": 12600, "t": "长大以后，她一定要努力工作，拼命攒钱，把她喜欢的书全部买齐。她就这样静心阅读着，与周围世界和平共处，一本好书，一小碗糖果，独自一人在家，树叶的光影在摇曳，下午的时光在流逝。这是一个……"}, {"c": "文前", "n": 12078, "t": "无论种子散落何处，都会长出一棵树，向着天空，挣扎着生长。"}, {"c": "1", "n": 10384, "t": "妈妈解释说：“和其他人一样，弗兰茜有权每顿饭喝一杯咖啡。如果她觉得倒掉比喝掉更好，那也是她自己的权利。"}, {"c": "23", "n": 9894, "t": "转学是件好事，这件事让她明白天外有天，她原生家庭所接触的世界之外，还有其他世界，而其他世界并不是遥不可及。"}, {"c": "56", "n": 9702, "t": "“再见，弗兰茜。”她低声说。"}, {"c": "文前", "n": 9590, "t": "无论多么贫穷，我们都生机勃勃"}, {"c": "文前", "n": 9128, "t": "贫穷的生活绝不等于是污秽的生活"}, {"c": "36", "n": 9126, "t": "三天后，乔尼去世了。"}, {"c": "第 一 部", "n": 9105, "t": "像我们这种人，能够偶尔浪费一次东西也不错，我们可以趁机体验一下，有钱任性、不用东挪西借是个什么感觉。"}, {"c": "2", "n": 9072, "t": "星期六是个特别的日子。在这一天，她给自己一个特权：不按字母顺序阅读，让图书管理员推荐一本书给她。"}, {"c": "文后", "n": 8250, "t": "没有污浊泥泞的河水，就无法衬托出太阳闪耀的光辉。"}, {"c": "6", "n": 8136, "t": "诺兰一家对待生活总是意犹未尽。他们全心全意地过着自己的生活，但是这还不够，他们还得关注所有他们接触过的人，关注他们的生活。"}, {"c": "文前", "n": 7546, "t": "亲爱的上帝，让我在我生命中的每分每秒都有所收获吧"}, {"c": "1", "n": 7446, "t": "因为这气味让她知道附近有通往河流的水道，虽然很脏，却一样随着河流汇入大海。对她来说，那巨大的恶臭暗示着长途帆船，暗示着海上冒险，她非常喜欢这种气味。"}, {"c": "1", "n": 7290, "t": "不过，她转念一想，莫蒂刚才购买奖品袋的时候，她就在旁边，陪莫蒂一起见证了惊喜，这和自己买奖品袋感觉差不多。"}, {"c": "18", "n": 7259, "t": "下一个是我弟弟，他的胳膊和我一样脏，所以你们不要吃惊，也不用给他说。你们给我说就可以了。"}, {"c": "1", "n": 6479, "t": "有时候，恰逢雨天，无所事事，孤零零地待在公寓里，如果可以享用某种东西，你会感到妙不可言，尽管这东西不过是一杯又黑又苦的咖啡。"}, {"c": "9", "n": 6045, "t": "“诀窍就是：读书写字。你自己识字，选一本好书，每天给孩子读一页。每天都必须这样做，一直坚持到孩子自己会读为止。然后，让她每天坚持读书，我知道这就是秘诀。”"}, {"c": "17", "n": 5985, "t": "每次课后，凯蒂都把自己学到的东西教给孩子们，让他们每天练习半小时。最后，母子三个人都学会了弹钢琴。"}, {"c": "1", "n": 5916, "t": "这个小女孩觉得，就算她比威廉斯堡的任何人都贫穷，但是在某种意义上，她比他们更富有，因为她还有东西可以浪费。"}, {"c": "前 言", "n": 5710, "t": "左拉说，所谓充实的生活，就是养个孩子，栽棵树苗，写本小说。"}, {"c": "33", "n": 5603, "t": "凯蒂停了下来，跪在台阶上，在两个栏杆之间举起了围裙里的武器，对准他的下腹部，扣动了扳机。"}, {"c": "9", "n": 5562, "t": "“现在，我也‘走过这一遭’了。”他说，“现在我是个男人了。”"}, {"c": "1", "n": 5525, "t": "弗兰茜喜欢闻咖啡的味道，喜欢那种热气腾腾的感觉。她一边吃着面包嚼着肉，一边手握杯子，享受着咖啡的温暖。时不时闻一闻又苦又甜的咖啡，比直接喝咖啡更有意思。吃完饭，咖啡就倒入水槽里。"}, {"c": "前 言", "n": 5430, "t": "人生一年又一年，当孩子们都已经开始去充实自己的生活的时候，我已经步入中年了。我也隐隐会想“要是我从头再来一次”……"}, {"c": "9", "n": 5328, "t": "孩子必须有想象力，想象力是无价之宝。孩子必须有一个秘密世界，那里住着世间不存在的东西。她得相信这个秘密世界，这很重要。"}, {"c": "1", "n": 5312, "t": "无论种子散落何处，都会长出一棵树，向着天空，挣扎着生长。这种树长在木板围拢的废墟里，长在人迹罕至的垃圾场，它是唯一能在水泥地里生长的树。它枝繁叶茂，偏偏钟情于居民住宅区"}, {"c": "前 言", "n": 5280, "t": "这些想法根本没有实现，我长大以后的大部分时间都在努力活下去，让自己活下去。充实生命的念头，已经在活下去的激烈竞争中消失殆尽了。"}, {"c": "56", "n": 5117, "t": "“我看起来怎么样，天后？”"}, {"c": "23", "n": 4960, "t": "“世界上没几个坏人。很多人只是运气不好罢了。”"}, {"c": "44", "n": 4927, "t": "但在内心深处，她们都心知肚明，明白彼此之间的关系并不融洽，也永远不会再和好如初了。"}, {"c": "53", "n": 4794, "t": "“不！我不需要任何人。我要让别人需要我……我要让别人需要我。”"}, {"c": "42", "n": 4624, "t": "在这个世界上，除了坚信自己正确无误，加恩德小姐一无所有。"}, {"c": "18", "n": 4570, "t": "一个从社会底层摸爬滚打走出来的人有两种选择：要么脱离旧环境，忘记曾经的不堪；要么超越旧环境，永远不忘本，在内心深处对那些攀爬中不幸落难的人保持同情和理解。"}, {"c": "1", "n": 4515, "t": "按照一条不成文法规，只有男孩子才能进店消费。"}]}, {"label": "方柏林", "pool": 674, "rating": "", "items": [{"c": "第2章 爱上生活", "n": 6426, "t": "活着，奋斗着，爱着我们的生活，爱着生活馈赠的一切悲欢，那就是一种实现。生活的充实常在，人人皆可获得。"}, {"c": "第45章", "n": 4464, "t": "“弗兰西，大约一年前，他就给了我这张卡，卡都写好了，还有两块钱。他说：‘等弗兰西毕业的时候，你给她送束花——我怕自己忘记。’”"}, {"c": "第5章", "n": 3555, "t": "就这样，她拿着一本书，守着一碗零食，独自一人在家，看着树影摇曳，任下午时光溜走，这是一个小女孩所能达到的化境。她就这样看着书，与世界和谐共处着，心里头快乐着。"}, {"c": "第2章 爱上生活", "n": 3408, "t": "左拉说，所谓充实的生活，便是“养个孩子，栽棵树，写本书”。"}, {"c": "第21章", "n": 2688, "t": "一个通过自身艰苦奋斗走出了社会底层的人，通常有两个选择。脱离当初环境后，他可以忘本；他也可以在超出这个环境之后，永不忘记自己的出身，对残酷拼搏中不幸落下来的人充满同情，充满理解。"}, {"c": "第8章", "n": 1872, "t": "尼雷就在边上站着，什么都没说。他来的目的，就是提供精神支持。"}, {"c": "第43章", "n": 1836, "t": "“或许，”弗兰西心想，“她不像爱尼雷那样爱我。可是她更需要我。我想，被人需要和被人爱一样好，或许更好呢。”"}, {"c": "第2章 爱上生活", "n": 1836, "t": "孩提时候，我喜欢倾听，常听大人说：“啊，过去我也有雄心大志！”“过去我也有梦想！”还有，几乎人人都说：“要是我从头再来一次……”我想这些人多多少少都错过了生活的充实。"}, {"c": "第6章", "n": 1782, "t": "“我喝酒，是因为我完蛋了，这个我也知道。我不能和其他男人那样开卡车；这个身材，也不好去当警察。我必须灌啤酒，想唱歌的时候就唱。我喝酒，是因为我本事太小，担子太重。”"}, {"c": "第5章", "n": 1639, "t": "弗兰西也轻轻地说了声“是啊”。她对这气味感到自豪。这让她知道附近有河流。别看它脏，可也一样流向大海的。对她来说，这种刺鼻的臭味说明有远航的船只，有远方的探险，故而她对这气味很喜欢。"}, {"c": "第28章", "n": 1530, "t": "是教育！对了，是教育造成了这种不同！教育会让他们摆脱污浊肮脏的底层。"}, {"c": "第3章", "n": 1494, "t": "树上的绿色枝条从树干向四周发散，枝条上长满了尖尖的叶子，整棵树看起来如同无数撑开的绿伞。有人称之为天堂树。不管它的种子落到什么地方，都会长出一棵树来，向着天空，努力生长。"}, {"c": "第5章", "n": 1485, "t": "她发誓长大后努力工作，好好存钱，将自己喜欢的书全都买下，这个想法是个巨大的安慰。"}, {"c": "第24章", "n": 1452, "t": "转到这个学校是好事，这让她看到在她生下来所接触的世界之外，还有别的世界，而别的世界也并非遥不可及。"}, {"c": "第5章", "n": 1441, "t": "弗兰西呼吸着暖暖的空气，看着树影舞动，读着书，吃着零食，饮着冰水。"}, {"c": "第45章", "n": 1394, "t": "弗兰西走出了屋子。她不再恨佳恩达小姐了。她不喜欢她，却也觉得她可怜。这个世界上，佳恩达唯一能肯定的东西就是她的正确无误。"}, {"c": "第22章", "n": 1368, "t": "这些故事最丑陋的一面是：它们脏归脏，却全都是真的。"}, {"c": "第37章", "n": 1368, "t": "三天后，约翰尼去世了。"}, {"c": "第49章", "n": 1320, "t": "“因为我要是不逼他，他就永远都不会回去上学，”妈妈说，“可是弗兰西你呢，总会继续争取，还要想办法回去的。”"}, {"c": "第61章", "n": 1290, "t": "这回看来，学校显得很小，这不禁让她感到吃惊。她在想，学校大小应该没有变，变的是她的眼界，她的眼界开阔了。"}, {"c": "第33章", "n": 1280, "t": "如果我有孩子，我不会看他们的日记，因为我相信孩子也需要隐私的。如果妈妈再次来看，读到这话的时候，但愿她心领神会。"}, {"c": "第46章", "n": 1275, "t": "“愿我能够一直这样，穿白裙子，拿着红玫瑰；愿我们一直能像今晚这样挥金如土。”弗兰西许了个愿。"}, {"c": "第29章", "n": 1235, "t": "弗兰西的眼里流出了辛酸的眼泪。“他们为什么，”她痛苦地想，“不把娃娃直接送掉，要说我多穷，她多富呢？为什么不直接送出去，要这样说来说去呢？”"}, {"c": "第7章", "n": 1222, "t": "穷人总是热衷于数量之众。"}, {"c": "第4章", "n": 1216, "t": "家里没人。妈妈已经穿好衣服，和茜茜姨妈一起，买了一毛钱的大众票，去看一场日场演出了。"}, {"c": "第24章", "n": 1190, "t": "世上哪有那么多坏人。有很多人只是运气不好罢了。"}, {"c": "第9章", "n": 1173, "t": "风儿轻轻的，香香的，暖暖的，从弗兰西头发上吹过。她手扒在窗台上，脸靠了上去。她一抬头就能看见出租房上方的星星。没多久，她就入睡了。"}, {"c": "第60章", "n": 1136, "t": "“你看一切，要好比你是第一次或最后一次看到那样。如果这样的话，你在世上的日子就会充满荣光。”"}, {"c": "第60章", "n": 1136, "t": "不过弗兰西并不想改掉，改掉口音就跟改掉自己的名字一样无法接受。有口音，说明人有个归属。她是个布鲁克林姑娘，有着一个布鲁克林名字，说话带布鲁克林口音。她不想东改西改以致面目全非。"}, {"c": "第23章", "n": 1134, "t": "当然，弗兰西由于身上气味大，人人都躲着她。不过她已经习惯了孤独。她习惯了一个人走路，习惯了被人看成“与众不同”。她没有觉得多难受。"}, {"c": "第33章", "n": 1122, "t": "弗兰西比社区大部分孩子都幸运。她在该懂的时候，全都弄懂了。她不需要溜到黑黑的过道里，和其他女孩一起鬼鬼祟祟地交流各自的想法。她从来不需要用别别扭扭的方式去学这些。"}, {"c": "第4章", "n": 1120, "t": "有时候什么吃的也没有，外头又下雨，一个人在家里，你会觉得很宽慰，毕竟家里还有点货，虽然这只不过是一杯又黑又苦的咖啡。"}, {"c": "第11章", "n": 1105, "t": "过了五年，他的小提琴就拉到了他爸弹吉他的水平，而他爸爸一辈子没上过任何课。"}, {"c": "第3章", "n": 1080, "t": "一个怀着孩子的大肚子女人，耐心地坐在街边一把硬邦邦的木头椅子里。她在那炽烈的阳光下坐着，看着街上喧嚣的生命，守护着自己腹中那个神秘的生命。"}, {"c": "第43章", "n": 1065, "t": "她低头趴在桌子上哭了。“妈妈不像爱尼雷那样爱我。”她哭着，“我费力让她爱我。不管她去哪里，我都挨近她坐着，她要我干吗我就干吗。可我就是没法让她像爸爸那样爱我。”"}, {"c": "第51章", "n": 1065, "t": "我想有个人。我想紧紧拥住某个人。我需要的不止是这样的拥抱。我需要有人来理解我此时的感受。理解应该是这种拥抱的一部分。"}, {"c": "第19章", "n": 1045, "t": "弗兰西转身，走向地下室，在黑暗中坐了好久，直到那潮水一般的伤痛不再冲刷自己。随着年岁增长，她的感知能力跟着提高，但这回遇到的幻灭不过是个开头，以后还会有很多很多。从此之后，她再也不……"}, {"c": "第42章", "n": 1035, "t": "弗兰西真希望大人不要老是对她这样说话。这个“有朝一日你会感谢我”已经给她够多负担的了。她在想，将来长大成人后，是不是要花大部分时间，把这些人一个个找出来，向他们挨个表示感谢呢？"}, {"c": "第15章", "n": 1024, "t": "“你嫁给他了。他好歹有什么打动了你的心。你就想着这一点吧，把别的都忘掉。”"}, {"c": "第31章", "n": 1022, "t": "关于大海的歌曲背叛了他。"}]}, {"label": "梅静 · 果麦", "pool": 766, "rating": "", "items": [{"c": "第一卷", "n": 4368, "t": "妈妈解释道：“和其他人一样，弗朗茜每顿饭后也可以喝一杯咖啡。她要是想将它倒掉，完全没问题。我想，我们这样的人若能偶尔浪费点儿东西，体会一下手头有钱、不必四处觅食的感觉，也很不错呀……"}, {"c": "第二章", "n": 3710, "t": "她就这样静静地读着书，与世界和平共处。只有小女孩才能感受到这样的快乐吧：一本好书、一小碗零食，独自在家，任叶影变换，任下午的时光流逝。"}, {"c": "第四十二章", "n": 3420, "t": "“弗朗茜，大约一年前，他便给了我那张写好字的卡和两美元，说：‘等弗朗茜毕业时，万一我忘了，代我送点儿花给她。’”"}, {"c": "文前", "n": 2670, "t": "布鲁克林有种树，有些人叫它天堂树。无论种子落在何处，这种树都会挣扎着去碰触蓝天。"}, {"c": "附录 爱上生活", "n": 2618, "t": "努力活着，奋力拼搏，热爱一切或悲伤或快乐的生活，便能得到充实和圆满。圆满生活的大门，向我们每个人敞开。"}, {"c": "第四章", "n": 2208, "t": "穷人总是对囤积大量物品热情无限。"}, {"c": "第一卷", "n": 2193, "t": "它虽然脏，但还是会流进一条终将汇入大海的河。对她来说，这股恶臭会让人想到远航的船只和无尽的冒险，所以她喜欢这股气味。"}, {"c": "第十八章", "n": 2175, "t": "“下一个是我弟弟。他的胳膊也跟我的一样脏，请别吃惊。您不用告诉他。您已经告诉我了。”"}, {"c": "导读", "n": 2156, "t": "世间的一切苦难，似乎都能在书中找到救赎。"}, {"c": "第九章", "n": 2108, "t": "约翰尼感觉好些了，对她说毕竟这事也算不得什么。他还说他已经知道，很多做丈夫的都得“经历这番磨炼”。"}, {"c": "第四十四章", "n": 2106, "t": "“因为我如果不逼他，他就永远不会回去了。”妈妈说，“而你，弗朗茜，肯定会拼尽全力，想方设法地回去。”"}, {"c": "第二十三章", "n": 2064, "t": "对她来说，转学是件好事。她不仅由此看到出生地之外的新世界，也明白了新的世界并非遥不可及。"}, {"c": "第三十七章", "n": 2057, "t": "“从现在开始，”她说，“我既是你们的妈妈，也是你们的爸爸了。”"}, {"c": "第十八章", "n": 1974, "t": "通过自我拼搏从底层爬上来的人，有两种选择：超越原生环境后，他可以选择遗忘；但他也可以在实现阶级提升后，选择牢记，对那些在残酷晋升之路上落败的人，发自内心地表示同情和理解。"}, {"c": "第四十二章", "n": 1850, "t": "献给弗朗茜，恭喜毕业！爱你的，爸爸。"}, {"c": "第二十八章", "n": 1764, "t": "过去，弗朗茜觉得妈妈总是对的。现在，她却发现妈妈偶尔也会犯错。她还发现，爸爸身上某些让妈妈非常喜欢的特质，在别人眼中其实相当可笑。茶叶店里的天平没那么闪亮了，箱柜也缺口掉漆，看起来……"}, {"c": "第二章", "n": 1710, "t": "星期六不一样。这天，她会奖励自己不按字母顺序读书，而是请图书管理员推荐一本。"}, {"c": "第五十六章", "n": 1656, "t": "“首席女歌手，我看起来怎么样？”"}, {"c": "第九章", "n": 1515, "t": "秘诀就是读书写字。你能读书，必须找本好书，每天给孩子读一页。每天不落，直到孩子能自主阅读。到时候，她肯定每天都会读书。我知道，秘诀就在于此。"}, {"c": "第九章", "n": 1496, "t": "有必要让她相信这些，她得先相信这些世上并不存在的东西，然后，当世界丑陋到不堪忍受时，她才能回过头来，住进自己的想象世界。"}, {"c": "第二十三章", "n": 1476, "t": "“世上只有极少数坏人。很多人只是不走运罢了。”"}, {"c": "第一卷", "n": 1462, "t": "没人再想要老人，都在等着他死掉。可他还不想死。就算已经这么老，再没有什么可开心的事，他还是想活着。"}, {"c": "第十七章", "n": 1462, "t": "每堂课后，凯蒂会把自己学到的东西教给孩子们，再让他们每天练习半小时。一段时间后，三人都学会了弹钢琴。"}, {"c": "第五十三章", "n": 1458, "t": "可终有一天，或许还是阳光明媚的一天，孩子们全然不知情地出门，便径直走入你拼命想让他们避开的悲伤中。”"}, {"c": "第四十二章", "n": 1425, "t": "“希望我能一直穿白裙子，抱红玫瑰，也希望我们能一直像今晚这般——挥金如土！”弗朗茜许愿。"}, {"c": "第二十一章", "n": 1316, "t": "不过，现在这样也好。必须要有黑暗、泥泞的水流，才能衬托太阳的夺目光辉呀。"}, {"c": "文前", "n": 1290, "t": "若非数量实在太多，人们肯定会觉得它很美。"}, {"c": "第三十九章", "n": 1278, "t": "“或许，”弗朗茜想，“她不像爱尼利那般爱我。但她更需要我，而不是他。我想，被需要几乎与被爱一样棒吧。或许更棒。”"}, {"c": "第三十九章", "n": 1264, "t": "弗朗茜真希望大人别再对自己说这种话。无数要在“未来表示感谢”的东西，已经让她不堪重负。她觉得，自己最美好的青春年华，是不是都得用来寻找那些人，告诉他们：“您当年说得对，非常感谢您……"}, {"c": "第二卷", "n": 1260, "t": "仿佛，她们都是由无形的薄钢所制。"}, {"c": "第二章", "n": 1245, "t": "弗朗茜呼吸着温暖的空气，边看舞动的叶影，边吃饼干、喝凉水，间或还读读书。"}, {"c": "第一卷", "n": 1242, "t": "她又开始纠结，要不要花一美分买奖品袋呢。哪怕糖不能吃，有惊喜的感觉也不错。但她又说服自己，莫迪花钱买完奖品袋，已经给了她惊喜。相比自己掏钱买，这种感觉几乎也一样好。"}, {"c": "第五卷", "n": 1242, "t": "“嗯，”她轻声应道，“见到你真好，本。”"}, {"c": "第五章", "n": 1190, "t": "老人并非不开心，只是不再渴望我们想要的那些东西。他们只想暖暖和和，有软乎乎的东西吃，能一起回忆往事。别傻啦。要说有什么必然会发生的事，那就是——终有一天，我们都会变老。所以，尽快适……"}, {"c": "第三十九章", "n": 1170, "t": "她趴在桌上，哭了。“妈妈不像爱尼利那样爱我，”她流着泪，“我努力了，努力让她爱我。我紧挨着她坐，她去哪儿我就去哪儿，她让我干吗我就干吗。可我就是没法让她像爸爸那样爱我。”"}, {"c": "第二卷", "n": 1170, "t": "她别无所求，只愿余生能每天看到他，每天听到他说话。于是，她当场决定，为了获此殊荣，一辈子做牛做马也愿意。"}, {"c": "第四十四章", "n": 1168, "t": "但两人心里都知道，这事没完，她们也永远无法再和好如初。"}, {"c": "第一卷", "n": 1152, "t": "等我长大，知道自己将有孩子时，我会记得，哪怕我不是犹太人，走起路来也一定要骄傲又舒缓。”"}, {"c": "第八章", "n": 1104, "t": "弗朗茜也有很多别的特质。她是图书馆那些她读过的书，亦是棕钵里的花。后院那棵挺拔生长的树，也是她生命的一部分。她很爱弟弟，却也跟他争吵不休。她是凯蒂绝望的私下痛哭，也是爸爸醉酒后踉跄……"}, {"c": "文后", "n": 1098, "t": "以微小的力量推动文明"}]}], "x": [{"seg": "题献 · 爱着生活", "rows": [["冯瑞贞", "活下去、继续奋斗，当然更要热爱生活……人人皆能从中找到救赎。", 16198], ["方柏林", "活着，奋斗着，爱着我们的生活……生活的充实常在，人人皆可获得。", 6426], ["梅静", "努力活着，奋力拼搏……圆满生活的大门，向我们每个人敞开。", 2618]]}, {"seg": "咖啡倒掉的权利", "rows": [["冯瑞贞", "如果她觉得倒掉比喝掉更好，那也是她自己的权利。", 10384], ["梅静", "她要是想将它倒掉，完全没问题。", 4368], ["方柏林", "—（该版无此句划线）", null]]}, {"seg": "恶臭河流终汇大海", "rows": [["冯瑞贞", "虽然很脏，却一样随着河流汇入大海。", 7446], ["方柏林", "别看它脏，可也一样流向大海的。", 1639], ["梅静", "它虽然脏，但还是会流进一条终将汇入大海的河。", 2193]]}, {"seg": "父亲之死(三字之差)", "rows": [["冯瑞贞", "三天后，乔尼去世了。", 9126], ["方柏林", "三天后，约翰尼去世了。", 1368], ["梅静", "三天后，约翰尼死了。", 1050]]}]}, {"id": "lp", "name": "小王子", "author": "圣埃克苏佩里", "link": "https://weread.qq.com/web/bookDetail/216212", "x_on": true, "editions": [{"label": "李继宏 · 天津人民", "pool": 395, "rating": "9.1 / 93,861 人", "items": [{"c": "Chapter 08", "n": 65160, "t": "“可惜从前我什么都不懂！我应该看她的行动，而不是听她的言语！她为我散发芬芳，点亮我的生活。我不应该离开她的，我应该看出藏在她那些小把戏后面的柔情。花儿的心事好难捉摸的！当时我太小了……"}, {"c": "Chapter 06", "n": 55524, "t": "“你知道吗，人在难过的时候就会爱上日落。”"}, {"c": "Chapter 04", "n": 54756, "t": "忘记朋友是很可悲的。不是每个人都有过朋友。"}, {"c": "Chapter 01", "n": 52871, "t": "大人自己什么都不懂，总是要小孩来给他们解释，这让我觉得很累。"}, {"c": "Chapter 23", "n": 50439, "t": "“我啊，”小王子说，“要是有五十三分钟，我宁可慢慢地走向一汪甘泉……”"}, {"c": "Chapter 10", "n": 45798, "t": "审判自己要比审判别人难得多。如果你能正确地审判自己，那你就是真正的聪明人。"}, {"c": "Chapter 22", "n": 34215, "t": "人总是对自己所处的地方不满意"}, {"c": "Chapter 05", "n": 32960, "t": "每天早晨洗漱好以后，你必须仔细地清洁和打扮你的星球。你必须强迫自己经常去拔掉猴面包树，它小时候跟玫瑰的幼苗长得很像，你要是能把它认出来，马上就得拔掉。这是非常乏味的劳动，但也非常简……"}, {"c": "Chapter 21", "n": 31440, "t": "看东西只有用心才能看得清楚。重要的东西用眼睛是看不见的。"}, {"c": "Chapter 13", "n": 29676, "t": "“我再跟你说吧，我拥有一朵花，我每天给她浇水。我拥有三座火山，我每周为它们清扫。因为我连死火山也清扫了。谁知道它什么时候会喷发呢！我对我拥有的火山和花朵来说是有用的。但你对星星来说……"}, {"c": "Chapter 25", "n": 25075, "t": "如果让自己被驯化，就难免会流泪……"}, {"c": "献词", "n": 24730, "t": "所有大人最初都是孩子（但这很少有人记得）。"}, {"c": "Chapter 17", "n": 24300, "t": "“在人群里也会孤单的，”蛇说。"}, {"c": "Chapter 26", "n": 24089, "t": "“就像那朵花，如果你爱上一朵生长在某颗星球上的花，当你抬头望着夜空时，你会感到很甜蜜。仿佛所有的星星都开满了鲜花。”"}, {"c": "Chapter 11", "n": 22626, "t": "因为在虚荣的人看来，所有人都是他的崇拜者。"}, {"c": "Chapter 03", "n": 22607, "t": "“就算他不停地向前走，那也走不了多远……”"}, {"c": "Chapter 07", "n": 22162, "t": "如果有人爱上一朵花，天上的星星有亿万颗，而这朵花只长在其中一颗上，这足以让他在仰望夜空时感到很快乐。他会告诉自己：‘在星空的某处有我的花。"}, {"c": "Chapter 04", "n": 21981, "t": "但可惜的是，我不能看见箱子里的绵羊。也许我是有点像大人了。我肯定已经变老了。"}, {"c": "Chapter 02", "n": 20493, "t": "所以我习惯了独处，也没有可以谈心的朋友"}, {"c": "Chapter 14", "n": 20315, "t": "可是在我看来，他是唯一不荒唐的人。也许这是因为他那么忙碌却不是为了他自己。"}, {"c": "Chapter 18", "n": 17290, "t": "“人？几年前我倒见过六七个。但你不知道哪里能找到他们。是风把他们吹来的。他们没有根，这让他们很苦恼。”"}, {"c": "Chapter 25", "n": 16395, "t": "“那些人，”小王子说，“他们坐在特快列车里，却不知道他们要追寻什么。所以他们很烦躁，不停地绕圈子……”"}, {"c": "Chapter 15", "n": 15782, "t": "“地理书，”地理学家说，“是图书中最宝贵的。它们永远不会过时。山脉很少会改变它的位置。海洋很少会变得干涸。我们书写的是永恒的事物。”"}, {"c": "Chapter 21", "n": 15666, "t": "“正是你为你的玫瑰付出的时间，使得你的玫瑰是如此的重要。”"}, {"c": "Chapter 21", "n": 14980, "t": "语言是误解的根源。"}, {"c": "Chapter 07", "n": 13995, "t": "“那些刺根本没有用，它们只是为了表现花朵的恶意。”"}, {"c": "Chapter 24", "n": 13986, "t": "无论是房子、星星还是沙漠，它们都是因为某种看不见的东西而美丽！"}, {"c": "Chapter 04", "n": 13518, "t": "幸亏后来土耳其的独裁者命令其国民改穿欧式服装，违者处以死刑。1920年，那位天文学家穿得非常气派，又在大会上讲述他的发现。这次每个人都接受了他的证据。"}, {"c": "Chapter 17", "n": 13488, "t": "人要显得聪明，有时候就会说点谎话。"}, {"c": "Chapter 04", "n": 12260, "t": "小孩对大人应该宽宏大量才是。"}, {"c": "Chapter 27", "n": 11754, "t": "现在我的悲伤有点平息了。也就是说……还没有彻底平息。我知道他返回了他的星球，因为天亮时我并没有找到他的尸体。其实他的身体不是很重……我喜欢在夜晚聆听星星的笑声。它们就像五亿个小铃铛……"}, {"c": "Chapter 09", "n": 11430, "t": "“是的，我是爱你的，”花儿说，“你却什么都不知道，这是我的错。没关系。但你和我一样笨。祝你幸福……把玻璃罩拿走吧，我再也不想要它了。”"}, {"c": "Chapter 06", "n": 11196, "t": "原来在很长的时间里，你唯一的消遣是默默地欣赏日落。"}, {"c": "Chapter 04", "n": 10504, "t": "他随后在国际天文学大会上翔实地展示了他的发现。但没人相信他，因为他穿的是土耳其的服装。大人就是这样子的。"}, {"c": "Chapter 05", "n": 10476, "t": "“猴面包树在长大之前也是小树苗啊。”"}, {"c": "导读", "n": 10098, "t": "“看东西只有用心才能看得清楚。重要的东西用眼睛是看不见的。”在这里，“心”代表内在的感受，“重要的东西”意味着生活的意义和价值，“眼睛”指代外在的因素。"}, {"c": "Chapter 14", "n": 10036, "t": "因为人是可以既尽忠职守又想偷懒的。"}, {"c": "Chapter 26", "n": 9990, "t": "“当你抬头看着夜空时，因为我住在某颗星星上面，因为我会在某颗星星上面笑，所以对你来说，就好象所有的星星都在笑。到时你将拥有会笑的星星！”"}, {"c": "Chapter 14", "n": 9712, "t": "小王子不敢承认的是，他为离开这颗星球感到惋惜，最重要的原因是在这颗星球上，他每二十四小时能看到一千四百四十次日落！"}, {"c": "Chapter 04", "n": 9588, "t": "如果你对大人说：“我看到一座漂亮红砖房，窗台上摆着几盆天竺葵，屋顶有许多鸽子……”那他们想象不出这座房子是什么样的。你必须说：“我看到一座价值十万法郎的房子。”他们就会惊叫：“哇……"}]}, {"label": "周克希 · 上海译文", "pool": 317, "rating": "9.3 / 8,130 人", "items": [{"c": "18", "n": 5130, "t": "风把他们一会儿吹到这儿，一会儿吹到那儿。他们没有根，活得很辛苦。”"}, {"c": "4", "n": 4964, "t": "可是就为了他的服装的缘故，谁也不信他的话。大人哪，就是这样。"}, {"c": "6", "n": 4488, "t": "“你知道……一个人感到非常忧伤的时候，他就喜欢看日落……”"}, {"c": "1", "n": 4280, "t": "这时候，我就不跟他说什么蟒蛇啊，原始森林啊，星星啊，都不说了。我就说些他能懂的事情。我跟他说桥牌，高尔夫，政治，还有领带。于是大人觉得很高兴，认识了这么个通情达理的人。"}, {"c": "12", "n": 3874, "t": "“忘记我的羞愧，”酒鬼垂下脑袋坦白说。 “为什么感到羞愧？”小王子又问，他想帮助这个人。 “为喝酒感到羞愧！”酒鬼说完这句话，就再也不开口了。"}, {"c": "21", "n": 3696, "t": "“最好你能在同一时间来，”狐狸说，“比如说，下午四点钟吧，那么我在三点钟就会开始感到幸福了。时间越来越近，我就越来越幸福。到了四点钟，我会兴奋得坐立不安；幸福原来也很折磨人的！"}, {"c": "10", "n": 3410, "t": "“这是最难的。审判自己要比审判别人难得多。要是你能审判好自己，你就是个真正的智者。”"}, {"c": "初版译序", "n": 3328, "t": "所有的大人起先都是孩子——但愿我们都能记得这一点。"}, {"c": "21", "n": 3328, "t": "只有用心才能看见。本质的东西用眼是看不见的。"}, {"c": "23", "n": 3052, "t": "“我呀，”小王子心想，“要是我省下这五十三分钟，我就不慌不忙地朝泉水走去……”"}, {"c": "4", "n": 2895, "t": "你要是对大人说：“我看见一幢漂亮的房子，红砖墙，窗前种着天竺葵，屋顶上停着鸽子……”他们想象不出这幢房子是怎样的。你得这么跟他们说：“我看见一幢十万法郎的房子。”他们马上会大声嚷嚷……"}, {"c": "4", "n": 2893, "t": "可是，很遗憾，我已经瞧不见箱子里面的绵羊了。我也许已经有点像那些大人了。我一定是老了。"}, {"c": "9", "n": 2821, "t": "“我既然想认识蝴蝶，就应该受得了两三条毛虫。我觉得这样挺好。要不然有谁来看我呢？你，你到时候已经走得远远的了。至于野兽，我根本不怕。我也有爪子。”"}, {"c": "21", "n": 2772, "t": "语言是误解的根源。"}, {"c": "7", "n": 2720, "t": "“我不信你的话！花儿是纤弱的，天真的。它们想尽量保护自己。它们以为有了刺就会显得很厉害……”"}, {"c": "9", "n": 2720, "t": "因为她不愿意让他看见自己流泪。她是一朵如此骄傲的花儿……"}, {"c": "21", "n": 2628, "t": "如果你能在下午四点钟来，那么我在三点钟就会开始有一种幸福的感觉。"}, {"c": "9", "n": 2601, "t": "“我以前太傻了，”她终于开口了，“请你原谅我。但愿你能幸福。”"}, {"c": "17", "n": 2568, "t": "“在沙漠里真有点孤独……” “在人群中间，你也会感到孤独，”蛇说。"}, {"c": "14", "n": 2483, "t": "小王子不敢承认的是，他留恋这颗受上苍眷顾的星球，是因为每二十四小时就有一千四百四十次日落！"}, {"c": "4", "n": 2448, "t": "那个天文学家在1920年重新作报告，穿着一套非常体面的西装。这一回所有的人都同意了他的观点。"}, {"c": "21", "n": 2409, "t": "“正是你为你的玫瑰花费的时光，才使你的玫瑰变得如此重要。”"}, {"c": "1", "n": 2390, "t": "那些大人自个儿什么也弄不懂，老要孩子们一遍一遍给他们解释，真烦人。"}, {"c": "14", "n": 2310, "t": "因为，一个人可以同时是忠于职守的，又是生性疏懒的。"}, {"c": "4", "n": 2290, "t": "忘记朋友是件令人伤心的事情。并不是人人都有过一个朋友的。再说，我早晚也会变得像那些只关心数字的大人一样的。"}, {"c": "21", "n": 2288, "t": "麦子对我来说毫无用处。我对麦田无动于衷。可悲就可悲在这儿！而你的头发是金黄色的。所以，一旦你驯养了我，事情就变得很美妙了！金黄色的麦子，会让我想起你。我会喜爱风儿吹拂麦浪的声音…………"}, {"c": "10", "n": 2044, "t": "权威首先得建立在合理的基础上。如果你命令你的老百姓都去投海，他们就会造反。我之所以有权让人服从，就是因为我的命令都是合情合理的。”"}, {"c": "6", "n": 1980, "t": "过去很长的时间里，你唯一的乐趣就是观赏夕阳沉落的温柔晚景。"}, {"c": "4", "n": 1932, "t": "孩子应该对大人多多原谅才是。"}, {"c": "11", "n": 1924, "t": "“我崇拜你，”小王子说着，微微耸了耸肩膀，“可是你要这个干什么呢？”"}, {"c": "3", "n": 1862, "t": "“就是笔直往前跑，也跑不了多远……”"}, {"c": "21", "n": 1848, "t": "“我得到了，”狐狸说，“是麦田的颜色给我的。”"}, {"c": "21", "n": 1836, "t": "“这可是你的不是哟，”小王子说，“我本来没想让你受任何伤害，可你却要我驯养你……”"}, {"c": "8", "n": 1833, "t": "他对那些无关紧要的话太当真了，结果自己很苦恼。"}, {"c": "10", "n": 1760, "t": "“要是我命令，”这番话他说得流畅极了，“要是我命令一个将军变成一只海鸟，那个将军不服从，这就不是那个将军的错，这是我的错。”"}, {"c": "7", "n": 1751, "t": "他从没闻过花香。他从没望过星星。他从没爱过一个人。除了算账，他什么事也没做过。他成天像你一样说个没完：‘我有正事要干！我有正事要干！’变得骄气十足。可是这算不得一个人，他是个蘑菇……"}, {"c": "16", "n": 1716, "t": "地球可不是普普通通的行星！它上面有一百十一个国王（当然，黑人国王也包括在内），七千万个地理学家，九十万个商人，七百五十万个酒鬼，三亿一千一百个爱虚荣的人，总共大约有二十亿个大人。"}, {"c": "2", "n": 1640, "t": "“不对！不对！我不要在蟒蛇肚子里的大象。蟒蛇很危险，大象呢，太占地方。"}, {"c": "14", "n": 1625, "t": "“规定没有改变，”点灯人说，“惨就惨在这儿！这颗行星一年比一年转得快，可规定却没变！”"}, {"c": "献给莱翁·维尔特", "n": 1590, "t": "所有的大人起先都是孩子（可是他们中间不大有人记得这一点）。"}]}], "x": [{"seg": "狐狸的诀别 · 第21章", "rows": [["李继宏", "看东西只有用心才能看得清楚。重要的东西用眼睛是看不见的。", 31440], ["周克希", "只有用心才能看见。本质的东西用眼是看不见的。", 3328]]}, {"seg": "忧伤时爱日落 · 第6章", "rows": [["李继宏", "你知道吗，人在难过的时候就会爱上日落。", 55524], ["周克希", "你知道……一个人感到非常忧伤的时候，他就喜欢看日落……", 4488]]}, {"seg": "献词", "rows": [["李继宏", "所有大人最初都是孩子（但这很少有人记得）。", 24730], ["周克希", "所有的大人起先都是孩子——但愿我们都能记得这一点。", 3328]]}, {"seg": "玫瑰的柔情 · 第8章(全书最热段)", "rows": [["李继宏", "我应该看她的行动，而不是听她的言语！她为我散发芬芳……当时我太小了，不懂得爱是什么。", 65160]]}, {"seg": "驯养就会流泪 · 第21章", "rows": [["李继宏", "如果让自己被驯化，就难免会流泪……", 25075]]}, {"seg": "为你玫瑰花费的时间 · 第21章", "rows": [["李继宏", "正是你为你的玫瑰付出的时间，使得你的玫瑰是如此的重要。", 15666], ["周克希", "正是你为你的玫瑰花费的时光，才使你的玫瑰变得如此重要。", 2409]]}]}, {"id": "jc", "name": "约翰·克利斯朵夫", "author": "罗曼·罗兰", "link": "https://weread.qq.com/web/bookDetail/24289562", "x_on": true, "editions": [{"label": "傅雷 · 三版本合并(读客/人文/果麦)", "pool": 709, "rating": "", "items": [{"c": "第一部", "n": 1595, "t": "克利斯朵夫细细地想了想，原来一个人长大之后，对什么都不以为奇了，那时他神通广大，无所不知，无所不晓。于是他也装作大人，把他的好奇心藏起来，做出漠不关心的神气。"}, {"c": "第一部", "n": 1395, "t": "可是人生很快会教他屈服的。"}, {"c": "卷六 安多纳德", "n": 1170, "t": "因为克利斯朵夫在奥里维眼中看见了她，而且也的确是这个突然浮现的形象使克利斯朵夫穿过客厅，向陌生的年轻的使者走过去，去接受那幸福的死者的又凄凉又温柔的敬意。"}, {"c": "第一部", "n": 1136, "t": "江声浩荡，自屋后上升。雨水整天地打在窗上。一层水雾沿着玻璃的裂痕蜿蜒流下。昏黄的天色黑下来了。室内有股闷热之气。"}, {"c": "第二部", "n": 969, "t": "他睁眼醒来，已经天亮了，可是这一天的光辉没有昨天早晨那样轻快了：世界有过一点儿变化了。克利斯朵夫已经尝到了人间的不公道。"}, {"c": "第二部 萨皮纳", "n": 848, "t": "接着她又昏迷了……她离开了世界。"}, {"c": "第二部 萨皮纳", "n": 833, "t": "他们都觉得世界没有安排好。爱人家的得不到人家的爱。被人家爱的偏不爱人家。彼此相爱的又早晚得分离。……你自己痛苦，你也叫人痛苦。而最不幸的人倒还不一定是自己痛苦的人。"}, {"c": "第三部 解脱", "n": 833, "t": "第二天，克利斯朵夫和他已经离得很远，远得连一辈子也不会再见了。而他们俩也永远地孤独下去了。"}, {"c": "第二部", "n": 828, "t": "至于异日的征尘，虽有名城大海，虽有梦中风景，虽有爱人倩影，其刻骨铭心的程度，决比不上这些儿时的散步，或是他每天把小嘴贴在窗上嘘满了水汽所看到的园林一角……"}, {"c": "第二部", "n": 810, "t": "他是哪一种人呢？简直什么都不是。这种什么都不是的人真是人生中可怕的东西！好像一块挂在空中的没有生命的肉，他们要往下掉，非掉下不可；而掉下来的时候把周围的一切都拉下来了。"}, {"c": "第一部 于莱之家", "n": 784, "t": "大多数的友谊，往往只是为了要找个对手谈谈自己，痛快一下。"}, {"c": "第一部 约翰·米希尔之死", "n": 780, "t": "他极需要人家的爱，听到一个亲热的字眼就会怨气全消，得到一点儿感情就会原谅一切。"}, {"c": "卷四 初版序", "n": 774, "t": "“我是即将来到的日子。”"}, {"c": "第二部", "n": 770, "t": "要曼希沃表现思想是毫不困难的，糟糕的是他根本没有思想，甚至不愿意思想。他正如一个庸碌的喜剧演员，只知道卖弄抑扬顿挫的声音，而不问声音表现的内容，只知道又焦急又虚荣地留神他的声音对观……"}, {"c": "第一部", "n": 768, "t": "要散布阳光到别人心里，先得自己心里有阳光。"}, {"c": "卷四 初版序", "n": 748, "t": "我们每一缕的思想，只代表我们生命中的一个时期。倘使活着不是为了纠正我们的错误，克服我们的偏见，扩大我们的思想与心胸，那么活着有什么用？"}, {"c": "第一部", "n": 742, "t": "“人生第一要尽本分。”"}, {"c": "第二部 萨皮纳", "n": 735, "t": "那天晚上，安多纳德一定是和奥里维在一起：因为克利斯朵夫在奥里维眼中看见了她；而且也的确是这个突然浮现的形象使克利斯朵夫穿过客厅，向陌生的年轻的使者走过去，去接受那幸福的死者的又凄凉……"}, {"c": "献言", "n": 728, "t": "各国的受苦、奋斗而必战胜的自由灵魂。"}, {"c": "第二部 奥多", "n": 720, "t": "我心里只有你。你得爱我啊，我的灵魂！你得像我爱你一样地爱我！我是你的，你的，从头到脚都永远是你的。"}, {"c": "第一部", "n": 720, "t": "而且事情一经决定，也不用再翻什么旧账，只要老老实实地尽自己的本分就完了。”"}, {"c": "第二部", "n": 714, "t": "你所爱的人对你可以为所欲为，甚至可以不爱你。你没法恨他；既然他丢掉你，足见你不值得人家的爱，你只能恨自己。这便是致命的痛苦。"}, {"c": "原序", "n": 705, "t": "当你见到克利斯朵夫的面容之日， 是你将死而不死于恶死之日。"}, {"c": "第二部 陷落", "n": 700, "t": "可是实际上什么都不会白费的，人生就不少这样的例子，任何努力绝不落空。可能多少年的杳无音讯，忽然有一天你会发觉你的思想已经有了影响。"}, {"c": "第一部 于莱之家", "n": 689, "t": "他就生活在上帝身上，无须再信上帝。信仰只是为软弱的人、萎靡的人、贫血的人的！他们向往于上帝，有如植物的向往于太阳。唯有垂死的人才留恋生命。凡是自己心中有着太阳有着生命的，干吗还要到……"}, {"c": "第一部", "n": 689, "t": "“好媳妇，得了吧，别难过了，他还会变呢。反正丑也没关系。我们只希望他一件事，就是做个好人。”"}, {"c": "第二部 奥多", "n": 672, "t": "原因是两个孩子的感情在离别的一星期内所达到的高峰，没法在现实生活中维持，而一旦重新相见之下，第一个印象便是发觉各人想的全是虚幻的。唯一的办法是放弃那些幻象，但他们不能毅然决然地承认……"}, {"c": "第二部", "n": 656, "t": "最难受的痛苦就是儿童第一次发现别人的凶恶：他以为全世界的人都在迫害他，没有一点儿倚傍。"}, {"c": "第一部 于莱之家", "n": 640, "t": "可是刚在旧的躯壳中蜕化出来的蛹，只知道在新的躯壳中痛痛快快地欠伸舒展，它还来不及认识新的牢笼的界限。"}, {"c": "第一部 约翰·米希尔之死", "n": 630, "t": "这样，克利斯朵夫在十四岁上就做了一家之主。"}, {"c": "卷二 清晨", "n": 630, "t": "“孩子，这还不是最后一次呢。人是不能要怎么就怎么的。志愿和生活根本是两件事。别难过了。最要紧是不要灰心，继续抱住志愿，继续活下去。其余的就不由我们做主了。”"}, {"c": "第三部 弥娜", "n": 629, "t": "世界上多少心灵原来不是独立的、整个的，而是好些不同的心灵，一个接着一个、一个代替一个地凑合起来的。所以人的心会不断地变化，会整个儿地消灭，会面目全非。"}, {"c": "第四部", "n": 624, "t": "“咱们到了！唉，你多重啊！孩子，你究竟是谁呢？” 孩子回答说： “我是即将来到的日子。”"}, {"c": "第一部", "n": 612, "t": "但或许我们除了头脑、心灵、感官以外，另有一些神秘的力量，在别的力量睡着的时候乘虚而入，做了我们的主宰。"}, {"c": "第二部", "n": 576, "t": "在这片沉闷的黑暗中，在一刻浓似一刻的令人窒息的夜里，像一颗明星流落在阴暗的空间，开始闪出那照耀他一生的光明：音乐，神妙的音乐！……"}, {"c": "第二部", "n": 576, "t": "曼希沃一边揍着孩子一边说孩子并没错，说这是侍候别人的好处，他们仗着有钱，肆无忌惮。鲁意莎一边揍着孩子一边骂丈夫野蛮，说她不答应他碰孩子，把他打伤了。"}, {"c": "原序", "n": 564, "t": "在此大难未已的混乱时代，但愿克利斯朵夫成为一个坚强而忠实的朋友，使大家心中都有一股生与爱的欢乐，使大家能不顾一切地去生活，去爱！"}, {"c": "第三部", "n": 560, "t": "“你想编些歌，为的要做个大人物；你想做个大人物，为的要编些歌。你倒像一条狗追着自己的尾巴打圈儿。”"}, {"c": "第三部", "n": 558, "t": "为着人间最美最高尚的艺术，为着安慰苍生，为人类增光的艺术而吃些苦是值得的。"}, {"c": "第一部", "n": 558, "t": "一所内地的屋子，墙上爬着蔓藤；一个花园，有个孩子在玩儿：他躺在草坪上；一道喷泉涓涓的流入石钵。一个女孩子笑着……"}]}, {"label": "许渊冲 · 全4册", "pool": 471, "rating": "9.1 / 1,107 人", "items": [{"c": "第3章 黎明", "n": 1649, "t": "时光的洪流缓慢地滚滚向前。白日和黑夜永恒地此起彼伏，宛如汪洋大海中的潮汐涨落。一周，一月，旧的才去，新的又来……每一天都像是同一天。"}, {"c": "第3章 黎明", "n": 1206, "t": "但是生活很快会使他懂事的。"}, {"c": "第三节 阿达", "n": 1020, "t": "“你还刚开头呢，孩子。人并不是想做什么，就能做什么的。想做是一回事，生活又是一回事。所以不要难过。最要紧的，你要晓得，是不要放弃想做，不要放弃生活。别的就由不得我们了。”"}, {"c": "第1章 译序", "n": 1008, "t": "伟大的性格往往是在和命运做斗争中形成的，一方面和外在世界，另一方面也和内心世界。"}, {"c": "第3章 黎明", "n": 994, "t": "“人生在世，头等大事就是要尽本分。”"}, {"c": "第3章 黎明", "n": 992, "t": "后来在人生旅途中看到的名胜古迹，汪洋大海，梦里风光，情人丽影，在心灵中留下的印象，怎么也不如这童年的漫游清楚，甚至比不上小嘴贴着窗子，鼻息弄湿了玻璃时，模模糊糊看到的一角花园……"}, {"c": "第3章 黎明", "n": 800, "t": "他只是个中等人才，人到中年，本来应该加倍努力，发挥自己的长处，他却放任自流，顺着下坡路滑了下去；结果，别人就取而代之了。"}, {"c": "第二节 奥托", "n": 765, "t": "事实是两个年轻人一星期没见面，把感情的调子定得太高，而在现实生活中却不可能维持这种感情，因此两个人再次见面，头一个印象都是失望。他们的感情应该降温，但两个人都很难同意。"}, {"c": "第3章 黎明", "n": 750, "t": "克里斯朵夫心里仔细想着事；他以为人一长大，就不会大惊小怪了，人有本事，就什么都会知道了。于是他也想尽快长大，也想掩盖自己的好奇心，装出不在乎的样子。"}, {"c": "第四节", "n": 720, "t": "克里斯朵夫快要倒下，他终于到了对岸。于是他对圣子说： “瞧！我们到了！你多重啊！孩子，你是谁呀？” 圣子答道： “我是新生的未来。”"}, {"c": "第8章 安东妮蒂", "n": 700, "t": "然后，她又沉入了昏迷之中……从此，她就一去不复返了。"}, {"c": "第1章 译序", "n": 680, "t": "创造，肉体也好，精神也好，都要冲出躯壳的牢笼，在生命的狂风暴雨中冲锋陷阵，成为开天辟地的神灵。创造就是消灭死亡。"}, {"c": "第二节 莎冰", "n": 672, "t": "每个人的内心都有一个情人的墓穴。情人一年又一年安安静静地长眠。但是有一天——我们都知道——墓穴还会打开。幽灵会从墓中出来，黯淡的嘴唇会对情人微笑，她一直埋藏在情人的记忆里，就像母亲……"}, {"c": "第二节", "n": 663, "t": "世界上的事起了一点变化。克里斯朵夫已经知道了世上的不公平。"}, {"c": "第二节 奥托", "n": 656, "t": "其实，友情不过是爱情的前奏曲，新的爱情占据了克里斯朵夫的心灵，其他的光辉总是要黯然失色的。"}, {"c": "第三节 阿达", "n": 656, "t": "“吹吧，吹吧！……你爱把我怎么吹就怎么吹！把我吹走吧！我知道要到哪里去。”"}, {"c": "第1章 译序", "n": 612, "t": "为了人类最美好、最高尚的艺术，为了给人类带来安慰，带来光荣，吃吃苦也是划得来的。"}, {"c": "第11章 燃荆", "n": 578, "t": "一刹那间，从思想深处浮起了几个颤抖的形象，就像快要陨灭的光线……一所外省的房子，墙上爬着紫藤；一个花园，有一个孩子在玩，他躺在草坪上；一道喷泉洒落在石池里。一个小女孩在笑……"}, {"c": "第1章 译序", "n": 570, "t": "我没有停留在表面的矛盾上（不管是时代的还是国家的冲突），而是深入内心，发现无论在哪里，人心都是一样的。”"}, {"c": "第2章 一九九四年版译序", "n": 561, "t": "献给世界各国 受苦受难、英勇斗争 取得胜利的自由心灵！"}, {"c": "第4章 清晨", "n": 544, "t": "因为一来对长辈的尊敬，往往会打消孩子推心置腹的念头；二来长辈错误地自以为年纪大、经验多，往往不能认真了解孩子的心情，其实孩子的心有时和大人的一样值得关怀，而且几乎总是更加真诚。"}, {"c": "第11章 燃荆", "n": 530, "t": "要使阳光照耀别人，自己心里非有阳光不可。"}, {"c": "第3章 黎明", "n": 528, "t": "孩子有几秒钟不知道如何是好，到底是哭呢还是吃奶；既然不能同时又哭又吃，他就照常吃奶不误。"}, {"c": "第三节 解脱", "n": 525, "t": "第二天，克里斯朵夫已经走远了——远得永远没再和他见面。两个人就这样永远分开了。"}, {"c": "第三节 解脱", "n": 522, "t": "他的全部智慧，恰恰就是不求智慧，从来不把自己的意志强加于外部世界，而是一切顺其自然，接受自然，喜爱自然。"}, {"c": "第二节", "n": 520, "t": "他心中的一切都在动摇：对父母的敬爱，对宗教的信仰，对生活的信心，对爱的天然需要，对精神生活的盲目而绝对的信任，一切都动摇了。"}, {"c": "第三节 蜜娜", "n": 518, "t": "他看出人生是一场不停的、无情的战斗，要做一个名副其实的人，就应该经常和成千上万的无形敌人作斗争：要击退自然的伤害力，乱七八糟的欲望，见不得人的思想。这些阴险的敌人把你推向堕落，推向……"}, {"c": "第二节", "n": 517, "t": "他多么渴望独立自主，而事实上却是绝对顺从。他自命不凡，其实全是迷信自己。他向往英雄，并有勇气，却又前怕狼，后怕虎！——他的天性一往无前，却又半途而废。"}, {"c": "第二节 莎冰", "n": 507, "t": "“她死了。”"}, {"c": "第三节 蜜娜", "n": 490, "t": "他幼稚的热情像退烧一样消失了；坟墓里的冷气把什么都吹凉了。蜜娜，自尊，爱情，唉！多么可怜！在现实面前，在死亡这唯一的现实面前，什么都微不足道了。这样吃苦，向往，不安，划得来吗？到头……"}, {"c": "第3章 黎明", "n": 480, "t": "说不定我们身上除了理智、心灵、感觉之外，还有些神秘的力量，善于钻其他力量的空子，见缝插针，自作主张"}, {"c": "第3章 黎明", "n": 480, "t": "江流滚滚，声震屋后。从天亮的时候起，雨水就不停地打在玻璃窗上。蒙蒙的雾气凝成了水珠，涓涓不息地顺着玻璃的裂缝往下流。"}, {"c": "第4章 清晨", "n": 473, "t": "这也不能怪他们，一生都是逆来顺受，哪里想得到站起来做人呢！"}, {"c": "第1章 译序", "n": 470, "t": "为了更美，没有一条清规戒律是不可以打破的"}, {"c": "第二节", "n": 468, "t": "梅希奥一面痛打儿子，一面却说儿子并没有错。瞧！这就是伺候人的报应，他们自以为有了钱，就什么坏事都做得出来。路易莎也一面打孩子，一面骂丈夫是畜生，她不许他再碰孩子，因为他已经把孩子打……"}, {"c": "第1章 译序", "n": 464, "t": "欢乐抓住了人。这是一种征服，是对痛苦的一场战争。"}, {"c": "第6章 反抗", "n": 464, "t": "新生命的芬芳太强烈，脆弱的神经受不了，一定要等时间的风风雨雨来把香味冲淡才行。艺术品也要积满了岁月的灰尘，才能被人欣赏。"}, {"c": "第1章 译序", "n": 459, "t": "语言是思想的父母，不是思想的产儿"}, {"c": "第二节", "n": 450, "t": "克里斯朵夫的心灵也像云雀一样。他知道飞起来还会落下去，还会落下去好多回。但是他也知道：落下去还会飞起来，只要他不怕疲倦，总会从烈火中飞起来，用呖呖的歌声，对人间的同伴歌唱天上的光明……"}, {"c": "第三节 蜜娜", "n": 442, "t": "他把名字当偶像崇拜，口袋里老带着一本莱辛的书，因为书中也有个“蜜娜”，他每天从戏院出来后，甚至绕弯路走过一家杂货店，因为店家招牌上有他心爱的“蜜”字和“娜”字。"}]}], "x": [{"seg": "时光洪流 · 卷一结尾", "rows": [["傅雷", "流光慢慢地消逝。昼夜递嬗，好似汪洋大海中的潮汐……循环不已的日月仍好似一日。", 420], ["许渊冲", "时光的洪流缓慢地滚滚向前。白日和黑夜永恒地此起彼伏，宛如汪洋大海中的潮汐涨落。", 1649]]}, {"seg": "舅舅的开导 · 卷二", "rows": [["傅雷", "人是不能要怎么就怎么的。志愿和生活根本是两件事。", 418], ["许渊冲", "想做是一回事，生活又是一回事。", 1020]]}, {"seg": "人生的教训", "rows": [["傅雷", "可是人生很快会教他屈服的。", 1395], ["许渊冲", "但是生活很快会使他懂事的。", 1206]]}, {"seg": "长大的代价", "rows": [["傅雷", "一个人长大之后，对什么都不以为奇了……", 1595]]}]}, {"id": "fruits", "name": "地粮", "author": "纪德", "link": "https://weread.qq.com/web/bookDetail/3300150710", "x_on": true, "editions": [{"label": "唐祖论 · 广西师大《地粮·新粮》", "pool": 236, "rating": "", "items": [{"c": "", "n": 2240, "t": "重要的是你的注视，而不是你看到的事物。"}, {"c": "", "n": 1547, "t": "我希望，在把压积在我胸中的一切情愫都表露在人间以后，我能心满意足而又万念俱寂地死去。"}, {"c": "", "n": 1530, "t": "我们的道路捉摸不定，使我们一生都感到痛苦。我怎么对你说呢？当你细加考虑时，任何选择都是可怕的：一种对任何职责失去引导作用的自由是可怕的。"}, {"c": "", "n": 1298, "t": "拿塔纳埃勒，爱根本不是同情。 行动吧，别去判断这是好是歹。去爱吧，别担心这是善是恶。"}, {"c": "", "n": 1212, "t": "拿塔纳埃勒，对于许多美好的事物，我耗尽了我的爱。这些事物的光辉来自我为之不断燃烧着的爱。我无法使自己厌倦。任何热忱对我来说，都是一种爱的耗损，一种美妙的耗损。"}, {"c": "", "n": 1095, "t": "假如过去不在现在之中投下往事的影子，现在就将装满种种未来。但是可惜，一种唯一的过去只能描绘一种唯一的未来——未来被投射在我们的前方，正像一座无限长的桥梁被投射在太空一样。"}, {"c": "", "n": 1037, "t": "愿你内心的每一种期待连一种愿望都不是，而只是一种表示欢迎的倾向"}, {"c": "", "n": 1020, "t": "每个人不幸的根源，在于他自己在观看，并使他所看到的一切隶属于他自己。每一事物之所以重要，并不是因为我们，而是因为它自己。但愿你的眼睛和被观看的事物合二为一。"}, {"c": "", "n": 1014, "t": "人的一生只有一个春天，但回忆某次欢乐并非再次接近幸福。"}, {"c": "", "n": 1003, "t": "我整个的生命似乎非常需要在崭新的事物中重获锻炼。"}, {"c": "", "n": 992, "t": "每一欲望比起占有我每种欲望的对象更能使我充实，因为占有永远是虚假的。"}, {"c": "", "n": 990, "t": "拿塔纳埃勒，唯独上帝是等不到的。等待上帝，拿塔纳埃勒，这是不明白你已经占有了上帝。不要把上帝和幸福区分开来，要把你整个的幸福都投入每一瞬间。"}, {"c": "", "n": 988, "t": "这个冰凉的杯子被一个高烧病人拿在手中，想喝。他明知应该等待，但水是这样冰凉，高烧又使他如此口渴，他再不能把这爽口的杯子从他的唇边推开。他把这杯冰水一饮而尽。"}, {"c": "", "n": 962, "t": "伤感只是消沉的热忱。"}, {"c": "", "n": 954, "t": "于是，我写道：只是靠对我灵魂的不可救药的毒害，我的肉体才得救。后来，我又完全不明白自己的话是什么意思了。"}, {"c": "", "n": 930, "t": "“海滩上的细沙柔软。”对我来说，限于诵读这一句子是不够的。我要使自己赤裸的脚趾直接感受到这一点。任何不先经过感觉的知识对于我都是无用的。"}, {"c": "", "n": 900, "t": "上帝无处不在，拿塔纳埃勒，愿你别往他处寻求。 每个造物都指向上帝，没有一个造物显示上帝。 一旦我们的目光停止在造物的身上，每个造物都会使我们背离上帝。"}, {"c": "", "n": 900, "t": "我知道我的肉体每天需要多少快乐。我也知道我的脑袋能接受多少快乐。随后，我的睡眠就将开始。超过限度，天地万物不可能多给我什么。"}, {"c": "", "n": 832, "t": "不要去崇拜偶像。"}, {"c": "", "n": 828, "t": "只是由于害怕失去爱，我才会对忧愁、烦恼、痛苦产生同情；否则，我是很难忍受它们的。要让各人自己去关心生活。"}, {"c": "", "n": 826, "t": "“愿我的书教导你，对你自己比对书的本身更感兴趣，进而对一切其他事物比对你自己更感兴趣。”"}, {"c": "", "n": 816, "t": "有时，我觉得旁人在我周围骚动，仅仅是为了增添我个人生活的感觉"}, {"c": "", "n": 800, "t": "我一点不喜欢那些把艰苦奋斗看成自己的功劳的人。因为如果艰苦，他们最好去干别的事情。"}, {"c": "", "n": 782, "t": "但愿我们所有的话都出自心中的爱！"}, {"c": "", "n": 780, "t": "我愿这书能给你出走的希望——从无论什么地方走出去吧，从你住的城市，从你的家庭，从你的卧室，从你的思想中走出去吧。"}, {"c": "", "n": 780, "t": "拿塔纳埃勒，对于梅纳克，我的感情曾超过了友谊，几乎等于爱情。我曾像爱一个兄弟那样爱他。"}, {"c": "", "n": 767, "t": "宁可要一种悲怆的生存，也不要那种安宁"}, {"c": "", "n": 765, "t": "我在体罚中比在犯错误时尝到更多的快感 ——由于我的罪过不是一般性的错误，我是多么以此为荣。"}, {"c": "", "n": 765, "t": "展现道路的地方，产生步行的欲望； 阴影邀请去的角落，存在憩息的欲望； 在深水旁边，产生游泳的欲望， 在每张床榻的边沿，产生爱或睡的欲望。"}, {"c": "", "n": 756, "t": "你不要再梦想重饮那已逝去的流水。"}, {"c": "", "n": 744, "t": "随后，人们终于想到，上帝无处不在，上帝处处都有，上帝是不可找到的神。于是，大家胡乱地下跪。"}, {"c": "", "n": 735, "t": "拿塔纳埃勒，你即将读我的书，我给你取了这个名字，是因为不知道你的名字将是什么。"}, {"c": "", "n": 726, "t": "“认识你自己。”这是一条有害且丑恶的格言。谁观察自己，谁就遏止了自己的发展。毛虫倘使致力于彻底认识自己，它就永远不会变成蝴蝶。"}, {"c": "", "n": 704, "t": "因此我就有这样的习惯，把我生命的每一瞬间加以分离，以便完全隔绝地接受一种快乐，以便骤然间把一种独特的快乐集中在某一瞬间；这种快乐，我从最近的回忆中已不能辨认。"}, {"c": "", "n": 696, "t": "愿我的书教导你，对你自己比对书的本身更感兴趣，进而对一切其他事物比对你自己更感兴趣。"}, {"c": "", "n": 689, "t": "我愿使你获得新生。"}, {"c": "", "n": 646, "t": "某些人在这本书中，只见到或者只愿意见到一种对欲望和本能的赞美。我看这或许有点近视。"}, {"c": "", "n": 592, "t": "在我看来，选择主要并不是选，而是摒弃不为我所择取的事物"}, {"c": "", "n": 572, "t": "凡是你不能说“太好啦”的地方，你就说：“这有什么办法！”正是在那里，幸福才大有希望。"}, {"c": "", "n": 561, "t": "为什么痛苦解除所带来的欢乐比不上欢乐终结所引起的痛苦呢？这是因为，你在痛苦中念念不忘被痛苦夺去的欢乐，而在幸福的氛围中，你根本不会想到你已经避开的痛苦，因为具有幸福感是你的天性。"}]}, {"label": "陈阳 · 果麦《人间食粮》", "pool": 287, "rating": "", "items": [{"c": "", "n": 1416, "t": "真正重要的是你的目光，而不是你眼前所见到的事物。"}, {"c": "", "n": 1245, "t": "我们的生活就像玻璃杯里的冰水，高烧的病人焦渴难耐，将凝结着水珠的玻璃杯捧在手中，他将冰水一饮而尽，明知道应该等一等再慢慢喝下，但就是无法将玻璃杯从唇边移开。这水越是清凉，身体就越发……"}, {"c": "", "n": 1020, "t": "我希望能在世间充分表达自己内心的所有渴望，然后心满意足，了无希望地死去。"}, {"c": "", "n": 1008, "t": "不要同情心，纳桑奈尔，要爱。"}, {"c": "", "n": 966, "t": "你只需要专注于非你不可的事物，然后迫不及待地，耐心地，将自己塑造成天地万物中那个不可取代的人。"}, {"c": "", "n": 901, "t": "纳桑奈尔，永远不要在未来找寻过去的影子。每时每刻都是全新的，把握住每个瞬间吧，不要为快乐事先准备什么。你要知道，就算你准备了，最后出现的也只会是意料之外的另一种乐趣。"}, {"c": "", "n": 833, "t": "去经历悲怆的一生吧，纳桑奈尔，不要平静如水。"}, {"c": "", "n": 833, "t": "我一点也不喜欢那些将辛苦劳作视为美德的人。如果觉得苦不堪言，他们最好还是去做些别的事情。做一件事情乐在其中，恰恰说明我们就适合做这个。纳桑奈尔，发自内心的愉悦感，对我来说就是最重要……"}, {"c": "", "n": 819, "t": "仅仅读到海边的沙滩有多么柔软，对我来说是不够的。我想要光着脚亲自去感受……一切没有直观感受的知识对我来说都没有什么用处。"}, {"c": "", "n": 742, "t": "如果一个人在认为自己是幸福的同时还有思考的能力，那才称得上是真正的强者。"}, {"c": "", "n": 736, "t": "当我静静仰望无垠的天空时，我的欲望便像轻雾一样消散得无影无踪。"}, {"c": "", "n": 704, "t": "希望你是因为我的书而对自己产生了兴趣，继而对其他一切都有了更大的兴趣。"}, {"c": "", "n": 682, "t": "人生道路的不确定性会折磨我们一辈子。我能对你说什么呢？仔细想来，所有选择都令人畏惧。自由也是可怕的，因为它没有任何义务的约束。"}, {"c": "", "n": 660, "t": "不能说“真不错”的时候，就说“那就这样吧”。这样一来，你很有可能会收获幸福。"}, {"c": "", "n": 658, "t": "但泉水只在我们欲念所及的地方流淌，因为只有当我们走近这片土地时，它才真正存在，周围的景色随着我们前行的脚步逐渐展现；我们看不见地平线的尽头；即便是我们近旁也只有不断变幻的表象。"}, {"c": "", "n": 658, "t": "纳桑奈尔，我已经为太多美妙的事物耗尽了自己的爱。正是我熊熊燃烧的欲望让它们焕发出如此夺目的光彩。我乐此不疲。所有热切的激情对我而言都是在消耗爱，多么甜美的消耗。"}, {"c": "", "n": 612, "t": "倘若你说梦想中的幸福不是这样，只有符合你的原则和心意才算得上是幸福，并因此断言自己失去了幸福的话，那你可就真的太不幸了。"}, {"c": "", "n": 592, "t": "如果有人在临终之前看到自己规划的一切全部宣告完成，那么请大家告诉我他是何许人也，我也要成为这样的人。"}, {"c": "", "n": 564, "t": "我整日昏昏欲睡，无精打采，睡再多觉也无济于事。吃完饭，我倒头就睡；一直睡着，醒来的时候却觉得更加倦怠，精神也迟钝而麻木，仿佛要变成一只休眠的蛹。"}, {"c": "", "n": 540, "t": "去行动吧，不要评价行为是好还是坏。去爱吧，不要担心是劫还是缘。"}, {"c": "", "n": 533, "t": "青春啊！人只能拥有一次青春，然后用一生的时光来回忆它。"}, {"c": "", "n": 532, "t": "欲望是有益的，满足欲望也是有益的——满足会让欲望更加强烈。"}, {"c": "", "n": 492, "t": "清空头脑的过程缓慢而艰难，但却比世人向我头脑中灌输知识的过程更有裨益，它让我开始接触真正意义上的教育。"}, {"c": "", "n": 486, "t": "所谓自由，只不过是为自己选择一种受奴役的方式，或者说选择一种自我奉献的形式罢了"}, {"c": "", "n": 480, "t": "人对喜悦的感知是有限度的，过于强烈的喜悦会让人流泪。"}, {"c": "", "n": 468, "t": "我只喜欢偶遇的快乐，是那种能让我惊喜地喊出声来的快乐。这样的快乐像湍流一样奔涌而来，鲜活而强烈，就像刚刚酿出来的最新鲜的葡萄酒。"}, {"c": "", "n": 465, "t": "在某些时刻，我觉得自己虽然身在人群之中，但是来来往往的人群反而让我对自己的私人生活有了更强烈的感受。"}, {"c": "", "n": 448, "t": "不过，只要开口说话，就不要再听他人的声音。"}, {"c": "", "n": 442, "t": "与占有我所渴求的对象相比，欲望本身会让我更加满足——欲求的对象终不过是虚妄。"}, {"c": "", "n": 429, "t": "毋庸置疑，在写作这本书时，我是绝对真诚的；在我的心灵做出背道而驰的选择时，也同样是真诚的。"}, {"c": "", "n": 425, "t": "在我的教导下，他有了一颗浪迹天涯的心，一颗终于获得了快乐的心。接着，我又教会他摆脱我的束缚，去经历他自己的孤独。"}, {"c": "", "n": 420, "t": "我对种种事物大胆出手，自以为有权得到我渴望的每一个对象（话说回来，纳桑奈尔，我所期望的其实完全不是占有，而是爱）。啊！希望我面前的一切事物都色彩斑斓，希望一切美好的事物都因我的爱而……"}, {"c": "", "n": 420, "t": "思考实在劳神费力。我年轻的时候总爱思考自己行为的后果，结果把自己弄得精疲力竭。后来我便相信，想要不再犯错，干脆什么都不要做。"}, {"c": "", "n": 418, "t": "我总是相信自己脚下的这条路就是我自己的路，我相信自己的选择绝不会错。我一向都保持着这样一种大而化之的信心，如果在神的面前宣誓，这种信心差不多就是人们通常所说的信仰了。"}, {"c": "", "n": 407, "t": "纳桑奈尔，我就这样称呼你。你将要阅读我的文字，我并不知道你在未来真正的名字。"}, {"c": "", "n": 406, "t": "无论得到多少，失去的一切永远更多也更好。"}, {"c": "", "n": 400, "t": "将每一个瞬间从生命中抽离出来，这样可以获得孤立而完整的快乐，可以将独一无二的幸福凝聚在这几乎静止的瞬间"}, {"c": "", "n": 391, "t": "总有些古怪的病症，让人偏偏想得到自己没有的东西。"}, {"c": "", "n": 391, "t": "一件东西的重要性并不取决于我们，而是取决于它自己。"}, {"c": "", "n": 391, "t": "在某些日子里，只要不断重复“二加二还是等于四”，只要看到我的拳头放在桌子上……就足以让我心中充满某种宗教般的至福。"}]}], "x": [{"seg": "注视句(全书四版最热共同句)", "rows": [["唐祖论", "重要的是你的注视，而不是你看到的事物。", 2240], ["陈阳", "真正重要的是你的目光，而不是你眼前所见到的事物。", 1416], ["盛澄华", "让重要性在你自己的目光中，而并非在所看到的事物上。", 480], ["李玉民", "关键是你的目光，而不是你目睹的事物。", 119]]}, {"seg": "结尾「抛开这本书，离开我」(寄语)", "rows": [["唐祖论", "拿塔纳埃勒，扔掉我的书吧；别在这本书里寻求满足。别以为可以通过他人找到你的真理；再没有比这更令人羞耻的事情了。", 126], ["陈阳", "纳桑奈尔，现在丢掉我的书吧。从书里解脱出来吧。离开我。离开我吧。", 120], ["盛澄华", "奈带奈蔼，如今，抛开我这书。使你自己从我的书中解脱出来。离开我！", 26]]}, {"seg": "忧郁句", "rows": [["唐祖论", "伤感只是消沉的热忱。", 962], ["陈阳", "忧郁，无非是爱而不得的热情。", 380], ["盛澄华", "忧郁只是消沉后的热诚。", 153]]}]}, {"id": "841490", "name": "源泉", "author": "安·兰德", "link": "https://weread.qq.com/web/bookDetail/841490", "x_on": false, "editions": [{"label": "高晓晴等 · 重庆出版社(双版合并)", "pool": 1253, "rating": "", "items": [{"c": "", "n": 1854, "t": "无物可求，无望可待，无所傍依。"}, {"c": "", "n": 1845, "t": "因为我无意于为了服务或帮助任何人而去建造房屋。我无意于为了拥有客户而建造房屋。我是为了建造房屋而拥有客户。”"}, {"c": "", "n": 1800, "t": "“我亲爱的小伙子，谁能让你这样做？” “这个问题并不重要。重要的是有谁能阻止我这样做？”"}, {"c": "", "n": 1744, "t": "人为什么不能把世界让给他所鄙视的人。"}, {"c": "", "n": 1683, "t": "宗教的抽象概念是人类心灵的财产，而非超自然的启示。"}, {"c": "", "n": 1443, "t": "有一种东西已经消失得无影无踪了。刚才那短暂的一瞬不复存在。"}, {"c": "", "n": 1422, "t": "你明天早晨准时九点来上班。”"}, {"c": "", "n": 1408, "t": "弗兰肯笑了。而吉丁突然间觉得弗兰肯并没有真正相信他的话，而且心知自己也不相信这样的话。然而，他们两人都心照不宣地得到了满足，被一种共同的手段和共同的罪恶紧紧地绑在了一起。"}, {"c": "", "n": 1376, "t": "“洛克先生，这儿只有我们两个人。你为什么不告诉我你是怎么看我的？你想说什么都可以。没有人会听见我们说什么。” “可我没有看你。”"}, {"c": "", "n": 1368, "t": "你的房子是根据它自身的需要而修建的，而其他房子的修建是出于哗众取宠的需要。你的房子的必要性在于房子本身，而其他房子的必要性在于观众。”"}, {"c": "", "n": 1330, "t": "每一代人中，只有少数人能完全理解和完全实现人类的才能，而其余的人都背叛了它。不过这并不重要。正是这极少数人将人类推向前进，而且使生命具有了意义。"}, {"c": "", "n": 1326, "t": "他的牺牲品们有一个普遍的简单共性：他们正直诚实、纯洁无瑕。"}, {"c": "", "n": 1276, "t": "仅此一次，她期待他会流露出某种情感，这“某种情感”可能是要目睹他崩溃的意思。她不知道到底他身上有什么东西能驱使她，让她想看着他垮掉。"}, {"c": "", "n": 1275, "t": "可是，当有听众在场时，吉丁就表现得与刚才判若两人了。某种东西已经消失殆尽。他并不清楚这一点，可是洛克清楚，而这一点吉丁也通过洛克的表情感觉到了。洛克的眼神使他感觉不舒服，甚至使他恼……"}, {"c": "", "n": 1241, "t": "促使她这么做的真正原因不单单是好奇。那是她的一块心病：她担心校委会撤销对洛克的处理决定。"}, {"c": "", "n": 1144, "t": "没有人能教你什么，实质和核心的东西是教不会的。你做着的事，那是你的，而不是我的。我只能教你把它做得更好。我只能教给你手段，可是目的——目的是你自己的。"}, {"c": "", "n": 1080, "t": "但是除了埃斯沃斯·托黑之外，包括约翰尼·斯多克、派特·努南，所有这个班最好学生的成绩都遭到了怀疑。"}, {"c": "", "n": 1078, "t": "吉丁才不在乎呢，只要他的设计能给客户们留下印象就行；客户们才不在乎呢，只要他们的客厅能给他们的客人留下印象就行；而客人们呢，什么样的客厅，关他们什么事呢。"}, {"c": "", "n": 1071, "t": "一离开那间办公室，他就将它们通通都忘了。那是必须做的事，已经做了，便不再与他有任何关系。他又一次自由自在地走上了回家的路。"}, {"c": "", "n":
