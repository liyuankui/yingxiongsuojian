1054, "t": "如果我能从你那里得到我想要的。我将出卖我自己，我也遵守游戏规则，只是暂时的。”"}, {"c": "", "n": 1037, "t": "他们默默相对，那是他们友谊的最后一道封印。"}, {"c": "", "n": 1026, "t": "正直是支持一个观点的能力，那预示着思考的能力，而思考是不能借的。"}, {"c": "", "n": 1020, "t": "你通过从不索取而拒绝一切。"}, {"c": "", "n": 972, "t": "这些岩石是因我而存在的，他想，它们等待我去开凿，等待着甘油炸药和我的命令；等待着被人劈开，经受打磨；等待着被赋予新的生命力；等待着我的手赋予它们形体。"}, {"c": "", "n": 952, "t": "盲目的崇拜本应该是危险的和居心叵测的，当之无愧的敬仰原本是一种责任，受之有愧的崇拜才弥足珍贵。"}, {"c": "", "n": 913, "t": "任何人所持有的对于人类的直接而内省的认识就是对他自己的认识。"}, {"c": "", "n": 901, "t": "你会随着年龄的增长而放弃所有这些念头的。"}, {"c": "", "n": 900, "t": "她既不为这个负担感到高兴，也不为此感到难过。她在多年前就已经失去了表现强烈情感的能力。"}, {"c": "", "n": 882, "t": "永远要成为人们希望你成为的样子。这样一来，在你需要的时候，人们就会帮助你。"}, {"c": "", "n": 876, "t": "那张支票被兑现后便有了“霍华德·洛克建筑师事务所”。"}, {"c": "", "n": 867, "t": "一束阳光射入猪圈里，是阳光让我们看到了粪便，也是阳光冒犯了我们。"}, {"c": "", "n": 845, "t": "弗兰肯再次品读起那篇文章，脸上写满笑意。吉丁从未见他如此开心过。从没有哪一幅事务所的制图，或者哪一幢已经建成的大楼令他像今天这样开心过，就因为读了由另一个人写的印在纸上以供别人阅读……"}, {"c": "", "n": 836, "t": "有人曾经问我，在过去这二十五年里，我可曾有过什么变化。没有。我还是原来的我，只不过比原来更像我了。"}, {"c": "", "n": 825, "t": "以牺牲自尊作为代价。在最重要的领域——价值观、判断、精神、思想——他们将别人置于自我之上，恰恰是以利他主义要求的方式。一个真正自私的人是不为他人的赞扬所动的。他不需要那些赞扬。"}, {"c": "", "n": 810, "t": "霍华德·洛克眼中却看不到任何人。对他来说，街道是空的，他甚至完全可以毫不在意地赤裸而过。"}, {"c": "", "n": 810, "t": "“彼得，你为什么无意中流露出这么多内心的东西？”洛克说。"}, {"c": "", "n": 799, "t": "他知道自己行动的源泉，却无法找到他们行动的动力。"}, {"c": "", "n": 792, "t": "“但是，无论在生活还是文学中，政治、伦理学或哲学本身都不是目的。唯有人本身才是目的。”"}, {"c": "", "n": 784, "t": "“如果一个人在这个世界上吃了苦头，那肯定是他有过错。"}, {"c": "", "n": 784, "t": "这伙人可以原谅任何事，唯独不能原谅在山洪般的嘲讽中依然冷静的人。他们中的一些人来这儿的时候已经准备怜悯他了，但在最初的几分钟之后，所有的人都开始憎恶他。"}]}], "x": []}, {"id": "3300012747", "name": "我就是你啊", "author": "皮埃尔·佩利西耶", "link": "https://weread.qq.com/web/bookDetail/3300012747", "x_on": false, "editions": [{"label": "北京联合出版公司", "pool": 620, "rating": "", "items": [{"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 6240, "t": "解释向来都是没用的。它们唯一的作用就是引发别人的反驳。如果你想要别人反驳你，那就率先提出你的论据。这招屡试不爽！”"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 5066, "t": "“你要克制住想要反驳、威胁和攻击对方的欲望。”"}, {"c": "序言", "n": 3995, "t": "真正决定人际关系质量的是一种能力：在面临矛盾冲突时，你是否有能力维持友谊的小船，让它不要说翻就翻。"}, {"c": "第一种方法：最神奇的方法", "n": 3916, "t": "情绪并不取决于您正在经历什么，而取决于您觉得自己经历了什么。"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 3626, "t": "当我们与别人出现了分歧，我们就摆事实讲道理，然后威胁对方，最后辱骂对方。大多数冲突都是经历了这三个步骤演化来的。"}, {"c": "第一种方法：最神奇的方法", "n": 3588, "t": "拒绝、争吵、威胁、攻击性，实际上这些情绪都与你毫无关系，全都是对方自己的事情，完全与你无关，如果你能领悟到这一点，你的愤怒就不会产生了。"}, {"c": "序言", "n": 3267, "t": "在人类的认知天性中，从“我”到“你”，间隔着三重大山：偏见、情绪和行为。"}, {"c": "第一种方法：最神奇的方法", "n": 3258, "t": "在与他人出现意见分歧时，纠正自己错误的看法，情绪就会自发地消失。"}, {"c": "奥姆明白了为何人们处理不好争端", "n": 3250, "t": "在分歧与冲突当中，谁能保持冷静，谁就是最强者。只有这个人能够掌控一切，而冷静是阻止矛盾激化的唯一途径。"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 3108, "t": "当你手上有很好的反驳观点、威胁手段或者一针见血的评论想要发表时，你是很难控制自己不将它说出来的。如果你成功克制住了这种欲望，你就等同于关上了通往地狱的大门。"}, {"c": "两个误区", "n": 2695, "t": "“唱反调和做评判是永远不会有效的，”智者评价道，“反之，还会加剧冲突。然而这却是每一个试图安抚别人的人下意识去做的事。”"}, {"c": "第一种方法：最神奇的方法", "n": 2652, "t": "“这就是对事实的误判！我正是犯了这种错误。我以为自己看到了蟒蛇，于是感到害怕，最后却发现那不过是条绳子，恐惧也跟着烟消云散，啊，这简直就像魔法一样！”"}, {"c": "文前", "n": 2580, "t": "你不必听信我的言语， 只需将它应用到现实生活当中， 亲自判断它是否有效。"}, {"c": "奥姆授艺赞不怒", "n": 2448, "t": "“没错，‘和’。或者其他可以表达两个并列观点的词：‘同时’‘在我看来’‘对我来说’……您回想一下，正是当我使用了这些词的时候，您将我一点一点拉了上来。我用这些词换掉了‘但是’。”"}, {"c": "艰难的起步", "n": 2445, "t": "没想到智者跟他打的唯一一句招呼，便是：“你居然没有提前到。”智者的语气中带着指责。"}, {"c": "两个误区", "n": 2363, "t": "为了缓和别人的情绪，我们总是反对他们，而这只会让这些情绪更加严重，因为情绪是一种能量，我们越是压制，能量就越活跃。"}, {"c": "一封信", "n": 2310, "t": "一旦你找到了引发你愤怒的根源，然后用安慰自己来取代那种令你痛苦的情绪。你会发现，你的愤怒与他人没有关系，只是因为你联想到了自己过往的经历。别人只是让沉睡在你心中的痛苦经历苏醒了过来……"}, {"c": "蓝王国，红王国", "n": 2261, "t": "每个人的脚底板都是蓝色的。人们猜测，或许是土地中蓝色的泥土，几个世纪以来一点一点将大家的脚底染成了蓝色。要么就是人们蓝色的脚底板，一步一步地把土地染成了蓝色。"}, {"c": "蓝王国，红王国", "n": 2232, "t": "红王国和蓝王国的人民在河的两边相安无事地生活着，都不太关心对岸的情况。"}, {"c": "奥姆接过了使命", "n": 2232, "t": "武力较量无法解决问题——这是血的教训啊。”"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 2223, "t": "解释没法帮你和他人达成共识。相反，越解释情况越糟糕。”"}, {"c": "序言", "n": 2156, "t": "通过“自他交换”，我们在遇到人际冲突或危机时，可以借机提升内在自我，从超越偏见和情绪的视角，洞察对方内在的真实需求，从而化解冲突，收获双赢乃至多赢的好关系。"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 2115, "t": "仅有的那些有效论据，所传递出的信息往往都能够颠覆对方对局势的判断并且对对方有益。”"}, {"c": "如何“以不动应万变”", "n": 2080, "t": "“没错。你要说的就是‘对’，或者见机行事，将其替换成‘同意’‘好的’‘很好’‘我懂’。重要的是，要向对方表明你不会攻击他，也不会评判他。”"}, {"c": "战火", "n": 2052, "t": "那样平平无奇的不和是如何演变成如此血腥的战争？历史的轨迹在哪里出了偏差？他本该做些什么来避免这场悲剧发生？"}, {"c": "第一种方法：最神奇的方法", "n": 2034, "t": "我的恐惧愤怒并非源自真实的情况，而是源于我对事实的理解。"}, {"c": "谈判", "n": 1937, "t": "最后，我再重申一下我的请求：如果您能批准我国百姓去往新的河岸上取水，我必定会感激不尽。"}, {"c": "授艺红国王", "n": 1890, "t": "您所划分的新国界十分像阴阳符号，这是和谐的象征！"}, {"c": "战火", "n": 1845, "t": "几个月过去，红王国夺回了河流。但是这条河如今变成什么样了呢？河底泥沙中仍然残留着大量毒药，人和动物都无法饮用河里的水。人们甚至不敢用这水来灌溉土地。"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 1830, "t": "但威胁只有在以下两种条件下才会有效：第一，双方实力相差悬殊；第二，争议无关重大事件。这二者缺一不可。"}, {"c": "灾难来了", "n": 1808, "t": "于是蓝国王说道：“我亲爱的子民们，如今形势危急。待我返回王宫，给红国王去信一封，请求他允许我们前去取水。数百年来，我们两国共饮一河水，双方相安无事，我想他一定不会拒绝我们的。"}, {"c": "奥姆没有就此罢休", "n": 1800, "t": "“我们总是乐于向别人解释为什么他们是错的，但其实我们最应该做的恰恰是表现出对别人观点有兴趣，这也符合我们自己的利益。奥姆，自私一些——真心实意地表现出对别人的兴趣。”"}, {"c": "赞不怒达成夙愿", "n": 1785, "t": "“并列的艺术有两种好处。首先，他可以确认双方的需求，而不导致冲突。其次，他创造了必要的条件，使得一个使双方都可以满意的解决方法有机会出现。”"}, {"c": "大禹的秘密", "n": 1785, "t": "当某人拒绝我们做某事的时候，我们的第一反应是向他解释为什么他要接受我们的提议。而一旦他没有选择让步，我们就会继续解释，或者提出更多的论据。我们想通过自己的解释强迫别人接受，而对方却……"}, {"c": "矛盾的激化：“分歧”是如何演化成为“冲突”的", "n": 1764, "t": "威胁向来都是没用的。除非你是想故意引诱对方对你发出威胁。如果你想让别人威胁你，那就率先威胁别人，这招百试百灵！”"}, {"c": "奥姆没有就此罢休", "n": 1755, "t": "你需要学会将‘不是的，因为……’换成‘是的，为什么？’，将武力对抗换成智力较量。一个诚恳的‘为什么’拥有无穷的力量！”"}, {"c": "第一种方法：最神奇的方法", "n": 1740, "t": "他的想法改变了，他开始试着换一个角度去看待这名守卫。他开始这样去理解他：这是一个忠于使命的人。“如果我想找人看守我的宫殿，一定也希望能找到这样的士兵。”他想。"}, {"c": "第一种方法：最神奇的方法", "n": 1720, "t": "但实际上那些总表现出鄙夷的人真正看不起的是自己。于是，为了平衡内心的自卑，他们总是试图显得高高在上。”"}, {"c": "情绪使人油盐不进", "n": 1717, "t": "我的国家正在经历一场严重的干旱，我必须得为我的国家找到水源。"}, {"c": "奥姆明白了为何人们处理不好争端", "n": 1703, "t": "恐惧和愤怒使得他们失去了思考的能力。他们开始变得特别擅长做些荒唐事，损害自己的利益。所以，你要学会的第一件事就是掌控这两种情绪。"}]}], "x": []}, {"id": "3300020163", "name": "我的阿勒泰", "author": "李娟", "link": "https://weread.qq.com/web/bookDetail/3300020163", "x_on": false, "editions": [{"label": "花城出版社(影视同名版)", "pool": 482, "rating": "", "items": [{"c": "我所能带给你们的事物", "n": 46620, "t": "原来她挂了电话后，立刻买来驼毛，连夜洗了，烧旺炉子烘干。再用柳条儿抽打着弹松、扯匀，细细裹上纱布。熬了一个通宵才赶制出来。然后又倒了三趟班车，坐了十多个钟头的车赶往乌鲁木齐。"}, {"c": "自序", "n": 45186, "t": "在大雪围拥的安静中，我一遍又一遍翻看这些年的文字，感到非常温暖——我正是这样慢慢地写啊写啊，才成为此刻的自己的。"}, {"c": "摩托车穿过春天的荒野", "n": 32796, "t": "他们两个站在风中，看着我追逐着那张纸币越跑越远，像是永远也不会回来了。"}, {"c": "属于我的马", "n": 32214, "t": "漫长的劳动使阿克哈拉的土地渐渐睁开了眼睛。它看到了我们，认清我们的模样，从此才真正接受了我们。"}, {"c": "我所能带给你们的事物", "n": 31110, "t": "给它什么就吃什么，毫不含糊。到了后来居然连肉也吃。兔子还吃肉？真是没听说过兔子还能吃肉……后来，果然证实了兔子是不能吃肉的，它们才吃了一次肉，就给吃死了。"}, {"c": "摩托车穿过春天的荒野", "n": 30039, "t": "我却在想：此后，再也回不到一个有玛瑙的地方了……"}, {"c": "坐班车到桥头去", "n": 29150, "t": "终于到了。我都写累了。"}, {"c": "我所能带给你们的事物", "n": 26960, "t": "乌鲁木齐总是那么大，有着那么多的人。走在街上，无数种生活的可能性纷至沓来，走在街上，简直想要展开双臂走。"}, {"c": "过年三记", "n": 25398, "t": "明年过年的时候我再也不买这种便宜货了，一定要买那种最粗最大的，可以看好长时间的。一定要买好多好多，让所有人好好看个够。"}, {"c": "打电话", "n": 24395, "t": "看着柜台对面那个十五岁的破小孩满脸通红、结结巴巴、喜难自禁、左脚搓右脚、右脚搓左脚的样子，实在愤怒：都说了一两个小时了，都快十二点了，还让不让人回家睡觉啊？"}, {"c": "属于我的马", "n": 22640, "t": "如果养马只是为了吃肉，生活该索然无味到什么地步？"}, {"c": "我家过去年代的一只猫", "n": 20776, "t": "死去的人全都是已经被原谅的人。"}, {"c": "我所能带给你们的事物", "n": 19604, "t": "她那暂时的欢乐，因这“暂时”而显得那样悲伤。"}, {"c": "通往滴水泉的路", "n": 19465, "t": "滴水泉如同这片大地上的神明。它的水，一滴一滴从无比高远之处落下，一滴一滴敲打着存在于这里的一切生命痕迹的脉搏，一滴一滴无边无际地渗入苦寂的现实生活与美好纯真的传说。"}, {"c": "自序", "n": 17816, "t": "文字里的那个“我”还是十八九岁的光景，贫穷、虚荣、敏感又热情。滋味无穷。"}, {"c": "过年三记", "n": 17040, "t": "每当抬头看到这太阳，都好像是有生以来第一次看到一样——心里微微一动，惊奇感转瞬即逝，但记起现实后的那种猛然而至的空洞感却难以愈合。"}, {"c": "喀吾图的永远之处", "n": 16114, "t": "喀吾图没有暴发，也没有日益庞大的积累。喀吾图只是让你进入它的秩序而已，然后就面对你停止下来。它让你得到的东西，全都是些牵绊住你、让你没法离开这个地方的东西，一直到最后。"}, {"c": "四版自序", "n": 15697, "t": "真实也能遮蔽真实。密集铺陈真实却营造出假象。于是，人们可能以为那就是我的常态吧。"}, {"c": "打电话", "n": 15431, "t": "令人纳闷的是，这两个人明明跟着同一个老板干同样的活啊……"}, {"c": "通往滴水泉的路", "n": 15300, "t": "就在他们盖好房子的那一年，新公路在戈壁滩另一端建成通车了。通往滴水泉的路，被抛弃了。"}, {"c": "坐班车到桥头去", "n": 15232, "t": "孩子们更是被捆扎得里三层外三层，一个个圆乎乎的，胳膊腿儿都动弹不了。拎起个孩子往地上一扔，还会反弹回来。"}, {"c": "木耳", "n": 15210, "t": "我妈在森林里采木耳，采着采着碰到一条蛇。她给吓了一大跳，蛇也被她吓了一大跳。她拔腿就跑，蛇扭头便溜。他们俩就这样迅速消失在茫茫森林里的两个不同方向。"}, {"c": "木耳", "n": 15190, "t": "也许一旦真正投入到无限的自由之中时，得到的反而不会是什么“无限的自由”，而是缩手缩脚和无所适从吧。"}, {"c": "过年三记", "n": 14592, "t": "：“天老爷！清汤寡水的，老子要挽起裤脚跳下去才能捞到几颗米。”"}, {"c": "摩托车穿过春天的荒野", "n": 14430, "t": "大地辽远，动荡不已。天空更为广阔——整个世界，天空占四分之三，大地占四分之一。"}, {"c": "喀吾图的永远之处", "n": 14076, "t": "我成天窝在柜台底下的糖堆里睡觉，睡醒了就搬把椅子坐到门口晒太阳。太阳渐渐偏西，房屋的阴影从后面慢慢覆扫过来。阳光移一寸，我就挪一下椅子。"}, {"c": "摩托车穿过春天的荒野", "n": 13806, "t": "摩托车穿过春天的荒野"}, {"c": "过年三记", "n": 13806, "t": "这烟花之外，四面八方茫茫无际的荒野沙漠……我们是在戈壁腹心，在大地深处深深的深深的一处角落里，面对着这虚渺美好的事物……此时若有眼睛从高远的上方往下看到这幅情景，那么这一切将会令他……"}, {"c": "我所能带给你们的事物", "n": 13530, "t": "先给外婆盛一碗，她笑眯眯喝了一口，然后又默默地喝了一口，说：“好喝。”然后死活也不肯喝第三口了。"}, {"c": "蝗灾", "n": 13428, "t": "我们所有的行为都向羊的利益倾斜，其实是向自己的利益倾斜——我们要通过羊获得更宽裕的生活，什么也不能阻止我们向着无忧无虑的浪费一步步靠近。我们真强大，连命运都能控制住了。"}, {"c": "过年三记", "n": 13376, "t": "这幕强烈的情景非但没能撕破四周的寂静，反而更令这寂静瞬间深不见底。不远处的荒野在烟花的照耀下忽明忽暗。更远的地方，沙漠的轮廓在夜色中脉动了两三下。"}, {"c": "乡村舞会", "n": 13086, "t": "我仍在自己的生活中生活，干必需的活，赚必需的钱。生活平静繁忙。但是我知道这平静和这繁忙之中深深忍抑着什么。"}, {"c": "通往滴水泉的路", "n": 12852, "t": "我永远忘不了途中投宿的那些夜晚，那些孤独地停留在空旷雪白的盐碱滩上的旅店——低矮的、破破烂烂的土坯房，还有房顶上空辉煌灿烂的星空。"}, {"c": "过年三记", "n": 12784, "t": "没有月亮，外面漆黑一团。但星空华丽，在世界上半部分兀自狂欢。星空的明亮与大地的黑暗断然分割。"}, {"c": "木耳", "n": 12690, "t": "这些女人们疯了一样地能吃苦，她们揣几个馍，腰里塞一张塑料纸，带着一只天大的编织袋就敢进林子。而且一进去就好几天不出来，晚上把塑料纸往结满冰霜的草窝里一铺，裹着大衣躺倒，一晚上就捱过……"}, {"c": "我家过去年代的一只猫", "n": 12478, "t": "不管是谁，在这些年里正如它从不曾忘记过家一样，从不曾忘记过它。"}, {"c": "木耳", "n": 12348, "t": "很久很久之后，她才出于失望而渐渐离去了。"}, {"c": "我们这里的澡堂", "n": 12272, "t": "突然有小孩子惊天动地地大哭，四处喊着找妈妈。找到妈妈后，妈妈顺手抽他一个大耳刮。"}, {"c": "我所能带给你们的事物", "n": 12181, "t": "兔子死了的时候，我妈对我说：“以后再也别买这些东西了，你能回来，我们就很高兴了。”我外婆对我说：“以后再也别买这些东西回来了，死了可怜得很……你回来了就好了，我很想你。”"}, {"c": "坐班车到桥头去", "n": 12080, "t": "我眼明手快，逮着个最胖的，一把捞过来抱在膝盖上，沉甸甸的温暖猛地严严实实罩了上来。他的母亲还拼命向我道谢。"}]}], "x": []}, {"id": "244004", "name": "冬牧场", "author": "李娟", "link": "https://weread.qq.com/web/bookDetail/244004", "x_on": false, "editions": [{"label": "花城出版社(新经典)", "pool": 686, "rating": "", "items": [{"c": "二 三天的行程", "n": 19728, "t": "太阳未出时，全世界都像一个梦，唯有月亮是真实的；太阳出来后，全世界都真实了，唯有月亮像一个梦。"}, {"c": "八 冷", "n": 13424, "t": "人之所以能够感到“幸福”，不是因为生活得舒适，而是因为生活得有希望。"}, {"c": "四 冬牧场", "n": 9815, "t": "这是荒野，什么样的挫折都得接受，什么样的灾难都得吞咽。"}, {"c": "五 地下的家", "n": 9503, "t": "有趣的是，兽医来时，那边托他捎来的东西是一大包油饼。兽医走时，这边托他送过去的东西，仍是一大包刚炸好的油饼……何必呢……"}, {"c": "一 最开始", "n": 9191, "t": "总之，在阿克哈拉村，我实在是个扑朔迷离的人物。主要有四大疑点：一、不结婚；二、不工作；三、不串门；四、不体面。"}, {"c": "三版自序", "n": 9112, "t": "我希望人长久，希望大家渐离贫苦，希望大地上一切生命安度冬夏，希望自己变得强大有力——贪得无厌地希望着。并且一直希望到了现在。"}, {"c": "十五 大家", "n": 7546, "t": "大家都愿意盲从，好像世上最安全的事就是让自己消失在“多数”之中。"}, {"c": "三十五 回家的路", "n": 7216, "t": "如果因为“不认识”而拒绝一份人情，就意味着已打定了主意日后不愿回报……这就是自私。而在荒野里，接受别人的帮助与款待，同帮助和款待别人一样重要。"}, {"c": "三十一 迅速消失的一切", "n": 7146, "t": "居麻感叹道：“明天让他入党吧！”"}, {"c": "六 冬宰", "n": 7005, "t": "大约生命的事情就是这样的吧：终究各归其途，只要安心就好。"}, {"c": "一 最开始", "n": 6928, "t": "一般牧民在买鞋时会选择大两个码的，可多穿两双厚袜子。我思前想后，穿了双大八个码的……于是，我的袜子穿得比谁都多。只是矮个儿穿大鞋相当招眼，像踩着两只船一样，划过来，划过去。"}, {"c": "五 地下的家", "n": 6732, "t": "有一天我的手机从挂在墙上的背包里掉到地上，小牛默默啃了一夜。本来一直关机的，硬是被啃得开了机。居麻说：小牛想妈妈了，想给妈妈打电话了。"}, {"c": "一 最开始", "n": 6480, "t": "其实，最主要的原因是：这些年居麻欠了我家好多钱。他家又太穷，看情形是还不起了，也不指望了。不如到他家住几个月，把钱全吃回来——这是我妈的主意。"}, {"c": "再版序", "n": 6120, "t": "于是很多读者说它是避暑神器，夏天读最合适。"}, {"c": "十 加玛苏鲁", "n": 6084, "t": "加玛走后我们都备感寂寞。一月初，她托兽医捎来一封信。这回居麻认真地翻译给我听了，开头第一句是：“冬窝子里的爸爸妈妈，还有李娟，你们好吗？身体好吗？”只这一句，就让人想要流泪。"}, {"c": "一 最开始", "n": 6064, "t": "万一人家晚上要过夫妻生活，岂不……岂不影响我休息？"}, {"c": "三十 我在体验什么", "n": 6032, "t": "但是，虽说太敏感的人会受苦，我却情愿受这敏感的苦，也不愿成为另外情形的人。"}, {"c": "三十五 回家的路", "n": 6017, "t": "眼下的世界仍被大雪严密地封堵着，白茫茫直到天边，但对我来说，这个冬天已经结束了。之前觉得漫长难捱，如今猛然觉得，竟是那么地匆忙、草率、不知所措。"}, {"c": "六 冬宰", "n": 5593, "t": "你不因有罪而死，我们不为挨饿而生。"}, {"c": "七 唯一的水", "n": 5440, "t": "而且雪停后的晴空，明朗灿烂得无从形容，似乎天上真的全都空了，真的把雪全都交给了大地。从此天空不再沉重了，不再那么辛苦了。"}, {"c": "十四 梅花猫和熊猫狗", "n": 5049, "t": "生命远比所看到、所了解的更结实，更顽强。"}, {"c": "四 冬牧场", "n": 4964, "t": "大约因为，进入荒野，当你微弱得只剩呼吸时，感到什么也无法填满眼前的空旷与阔大时，就只好唱起歌来。只好用歌声去放大自己的气息，用歌声去占据广阔的安静。"}, {"c": "十七 与世隔绝", "n": 4896, "t": "从此以后，荒野的寂静被撕开了。我们，有电视看了！"}, {"c": "十五 大家", "n": 4768, "t": "多么勇敢的小马啊！像个王子一样神气，还长长地拖着软软的小鸡鸡。"}, {"c": "十七 与世隔绝", "n": 4704, "t": "生活本来就够局促了，如果再潦草地应付，那就是“破罐破摔”了。再窘迫的生命也需要“尊严”这个东西。而“尊严”需得从最小的细节上去呵护。"}, {"c": "九 羊的冬天", "n": 4592, "t": "我问居麻：“放羊的时候你都在干些什么？” 他说：“在放羊。” 我真蠢。"}, {"c": "三版自序", "n": 4554, "t": "我的勇气——年轻的心才有的那种热情和勇气——已经用尽。"}, {"c": "再版序", "n": 4511, "t": "谢谢所有人。谢谢你们经过这片牧场并为之驻足片刻。"}, {"c": "一 最开始", "n": 4496, "t": "启程前做的最后一件事是依据牧人的习惯把表往前调了两个小时，改为本地时间。之前我一直用北京时间。"}, {"c": "五 地下的家", "n": 4470, "t": "作为一个郑重的家，这家里的生活也是郑重的。哪怕只是出去放个羊，居麻也会花很长时间把靴子擦得锃亮。如果哪天早上嫂子突然取出干净衣服给他替换，他更是高兴得唱老半天歌，一直唱到放羊回来为……"}, {"c": "文后插图", "n": 4466, "t": "离开冬牧场前的最后一次清理羊圈的工作，把又软又纯的粪块挖起来砌在羊圈最外侧，它们将成为温暖我们下一个冬天的燃料"}, {"c": "二 三天的行程", "n": 4360, "t": "这个小小的被窝，黑暗，温暖，把冷空气严严实实隔绝开来，是宇宙中的宇宙，苹果中的籽核……"}, {"c": "三十 我在体验什么", "n": 4304, "t": "当我欢乐或惊奇时，碰都不想去碰那个本子，碰一下都是干扰——那时的我只想全情投入眼下的生活。只在尴尬和冷清的失意时分，我才会取出那本子，记录不久前发生过的欢乐和惊奇。"}, {"c": "再版序", "n": 4176, "t": "“命运是深渊，但人心不是深渊。哪怕什么也不能逆转，先付出努力再说吧。”"}, {"c": "二 三天的行程", "n": 4128, "t": "这时，不知是守夜的两个男人中的谁，坐在帐篷外侧，拧亮手电，照着我穿鞋、走远，直到我蹲下后才熄灯。（灯光一熄，华丽的银河哗然闪现在上方！）听到我往回走的脚步声时，才重新拧亮灯光照着我……"}, {"c": "八 冷", "n": 4090, "t": "无论如何，寒冷的日子总是意味着寒冷的“正在过去”。"}, {"c": "二十二 暮色中", "n": 4080, "t": "北京又怎样？黄河又怎样？此刻，我们的假人俯视着的沙窝子才是这个世界的中心。"}, {"c": "十二 嫂子", "n": 4008, "t": "快要离开这个家庭时，我挑一个光线柔和的黄昏给这夫妻俩好好地照了一张相。看照片时，居麻沉重地说：“我明明在这边，你嫂子的头为啥要往那边偏？可能不喜欢我了……”"}, {"c": "十二 嫂子", "n": 3780, "t": "其实，当我一离开这样的生活，这些技巧就全都用不上了。永远用不上了。但我还是为收获它们而感激。倘若我能在这样的生活中走得再长久一些，妥实一些，说不定会顺着这些小小的生活经验摸索出更大……"}, {"c": "四 冬牧场", "n": 3706, "t": "这些夸张的饰物令她们黯淡的生命充满尊严，闪耀着她们朴素一生里全部的荣耀与傲慢。——这里毕竟是荒野啊，单调、空旷、沉寂、艰辛。再微小的装饰物出现在这里，都忍不住用意浓烈、大放光彩。"}]}], "x": []}]};

function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
  const lines = []; let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; if (lines.length === maxLines) break; }
    else line += ch;
  }
  if (lines.length < maxLines && line) lines.push(line);
  if (text.length > lines.join('').length) {
    let last = lines[lines.length-1] || '';
    if (lines.length === maxLines && last) lines[lines.length-1] = last.slice(0, Math.max(2, last.length - 1)) + '……';
  }
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineH));
  return y + lines.length * lineH;
}

let FAMILY_UID = null;
try { FAMILY_UID = localStorage.getItem('sbf-uid'); } catch(e) {}
if (!FAMILY_UID) {
  try {
    for (const k of ['sanbanfu-uid','xianlihoubing-uid','geziweizhan-uid','shiyuyuanwei-uid','yinshuisiyuan-uid']) {
      const v = localStorage.getItem(k); if (v) { FAMILY_UID = v; break; }
    }
    FAMILY_UID = FAMILY_UID || 'u-' + Math.random().toString(36).slice(2,10);
    localStorage.setItem('sbf-uid', FAMILY_UID);
  } catch(e) { FAMILY_UID = 'unknown'; }
}
function track(ev, props) {
  try {
    if (location.protocol !== 'https:' && location.protocol !== 'http:') return;
    if (navigator.webdriver) return;
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
    navigator.sendBeacon('https://us.i.posthog.com/capture/', JSON.stringify({
      api_key: POSTHOG_KEY, event: ev, distinct_id: FAMILY_UID,
      properties: Object.assign({ project: 'yingxiongsuojian' }, props || {}),
    }));
  } catch (e) {}
}

renderShelf();
applyView(location.hash.replace('#', '') || 'shelf');
window.addEventListener('hashchange', () => applyView(location.hash.replace('#', '') || 'shelf'));
track('page_view', { book: document.body.dataset.book });
